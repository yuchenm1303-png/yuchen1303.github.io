name = "ai-ledger-parser"
# 当前 Worker 生产入口是诊断包装器：先包住 orchestrator 做超时兜底与模型诊断，
# 再由 src/index-orchestrator.js 分流聊天、搜索、天气、附件和本地命令协议。
main = "src/index-orchestrator-diagnostics.js"
compatibility_date = "2026-05-10"

[ai]
binding = "AI"

[vars]
AI_MODEL = "@cf/meta/llama-3.1-8b-instruct"
GEMINI_MODEL = "gemini-2.5-flash"
PLANNER_PROVIDER = "nvidia"
NVIDIA_BASE_URL = "https://integrate.api.nvidia.com/v1"
NVIDIA_KIMI_MODEL = "moonshotai/kimi-k2.6"
NVIDIA_MISTRAL_MODEL = "mistralai/mistral-medium-3.5-128b"
NVIDIA_PLANNER_MODEL = "mistralai/mistral-medium-3.5-128b"
NVIDIA_CHAT_FALLBACK = "true"
ALLOWED_ORIGINS = "https://yuchenm1303-png.github.io,https://localhost"
