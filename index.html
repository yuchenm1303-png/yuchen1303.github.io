<!doctype html>
<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GaN HEMT 重离子辐照仿真分析</title>
<style>
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","Microsoft YaHei",Arial,sans-serif;background:#eef7ff;color:#123}.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 18% 12%,#dff4ff 0,#eff8ff 30%,transparent 48%),radial-gradient(circle at 86% 22%,#eadfff 0,#f9ecff 26%,transparent 45%),linear-gradient(135deg,#f7fbff,#eef6fa 46%,#fbfdff)}.panel{width:min(560px,88vw);padding:30px 24px;border-radius:28px;background:rgba(255,255,255,.58);border:1px solid rgba(255,255,255,.72);box-shadow:0 24px 80px rgba(23,49,84,.18);backdrop-filter:blur(28px) saturate(180%)}.spinner{width:34px;height:34px;margin:0 auto 16px;border-radius:50%;border:3px solid rgba(30,96,145,.18);border-top-color:#1e6091;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}h1{font-size:24px;margin:0 0 8px}.muted{color:#64748b;font-size:14px}.err{color:#b91c1c}</style>
</head>
<body>
<div class="loading"><div class="panel"><div class="spinner"></div><h1>正在加载</h1><div class="muted">正在载入原始 16 张结果图，应用优化...</div></div></div>
<script>
const FULL_REPORT_URL='https://raw.githubusercontent.com/yuchenm1303-png/yuchen1303.github.io/25b3070a0411c4903ec95c7bfcd8707fa27776b3/index.html';
const EXTRA_CSS=`
/* === layout polish injected by ChatGPT === */
main{max-width:1180px!important}.grid{display:grid!important;grid-template-columns:repeat(auto-fit,minmax(min(440px,100%),1fr))!important;gap:22px!important;align-items:start!important}.grid>h2{grid-column:1/-1!important;margin:44px 0 0!important;padding-top:12px!important;font-size:27px!important;letter-spacing:-.3px!important}.section-note{grid-column:1/-1!important;border-radius:26px!important;padding:18px 22px!important;margin:0 0 2px!important;background:linear-gradient(145deg,rgba(255,255,255,.76),rgba(255,255,255,.42))!important;border:1px solid rgba(255,255,255,.72)!important;box-shadow:0 16px 54px rgba(23,49,84,.12)!important;backdrop-filter:blur(26px) saturate(180%)!important;color:#334155!important;font-size:15px!important;line-height:1.85!important}.section-note b{color:#153a5b}.section-note .key{display:inline-block;margin:4px 7px 4px 0;padding:4px 10px;border-radius:999px;background:rgba(239,246,255,.75);border:1px solid rgba(191,219,254,.85);color:#1d4ed8;font-weight:700;font-size:13px}.card{padding:20px!important}.card p{font-size:15px!important;line-height:1.85!important;color:#526274!important}.card-head{margin-bottom:12px!important}.card h3{font-size:21px!important;line-height:1.35!important;color:#1f7a68!important}.zoom{box-shadow:0 8px 24px rgba(31,71,109,.08)!important}.note{font-size:16px!important;line-height:1.85!important}.summary{gap:18px!important}.metric{min-height:118px!important}.metric b{font-size:30px!important}.analysis-box{grid-column:1/-1;border-radius:26px;padding:18px 22px;background:linear-gradient(145deg,rgba(236,253,245,.78),rgba(255,255,255,.42));border:1px solid rgba(255,255,255,.72);box-shadow:0 16px 54px rgba(23,49,84,.12);font-size:15px;line-height:1.85;color:#334155}.analysis-box b{color:#047857}img{transition:transform .22s ease,box-shadow .22s ease!important}img:hover{transform:scale(1.008)!important;box-shadow:0 18px 46px rgba(15,23,42,.14)!important}.modal img{transform:none!important}footer{margin-top:12px!important}@media(max-width:760px){.grid{grid-template-columns:1fr!important;gap:18px!important}.grid>h2{font-size:24px!important;margin-top:34px!important}.section-note,.analysis-box{font-size:15px!important;padding:16px!important}.card{padding:17px!important}.card-head{display:block!important}.zoom{float:right;margin-top:-2px!important}.card h3{font-size:19px!important}.summary{grid-template-columns:repeat(2,minmax(0,1fr))!important}.metric{min-height:104px!important}.metric b{font-size:24px!important}}
`;
const NOTES={
  '<h2 id="dc"><span>1</span>DC 直流分析</h2>':'<h2 id="dc"><span>1</span>DC 直流分析</h2><div class="section-note"><b>本部分用于判断器件的稳态阻断能力。</b>重点观察漏极电压升高时 Drain TotalCurrent 是否保持在安全范围内，尤其关注 400 V 关键点与 2 μA 判据的关系。<br><span class="key">常温漏电：nA 量级</span><span class="key">高温末态：μA 量级</span><span class="key">判据：2 μA</span></div>',
  '<h2 id="trpeak"><span>2</span>TR 瞬态峰值</h2>':'<h2 id="trpeak"><span>2</span>TR 瞬态峰值</h2><div class="section-note"><b>本部分反映重离子入射后的瞬态电流扰动。</b>LET 越大，器件内部沉积电荷越强，漏极总电流峰值一般越高。这里重点比较不同温度、不同栅压下的 Peak |Drain TotalCurrent|、峰值时间和末态电流。</div>',
  '<h2 id="trwave"><span>3</span>TR 波形对比</h2>':'<h2 id="trwave"><span>3</span>TR 波形对比</h2><div class="section-note"><b>本部分用于观察单条瞬态曲线的形状。</b>相比只看峰值，波形能说明电流尖峰出现时间、恢复速度以及不同电流分量之间的关系。报告中这些图适合放在论文结果分析部分，用来支撑“LET 增强导致瞬态响应增强”的结论。</div>',
  '<h2 id="heat"><span>4</span>二维热图</h2>':'<h2 id="heat"><span>4</span>二维热图</h2><div class="section-note"><b>热图用于快速比较多变量条件下的敏感区域。</b>横向看 LET，纵向看温度和栅压，可以更直观看出哪些组合条件下峰值电流、末态电流或漏电流更突出。颜色越深，一般代表对应指标越高。</div>'
};
const CONCLUSION='<div class="analysis-box"><b>综合判断：</b>当前结果可以支撑“常温 DC 阻断能力较好，重离子 LET 增强会提高瞬态电流峰值，高温会显著抬升漏电水平”的基本结论。写论文时建议把 DC 结果和 TR 结果分开表述：DC 侧重稳态漏电与阻断判据，TR 侧重瞬态峰值、峰值时间和波形恢复过程。</div>';
function improve(html){
  html=html.replace('</style>',EXTRA_CSS+'</style>');
  for(const [k,v] of Object.entries(NOTES)){html=html.replace(k,v)}
  html=html.replace('<h2 id="trpeak"',CONCLUSION+'<h2 id="trpeak"');
  return html;
}
fetch(FULL_REPORT_URL,{cache:'force-cache'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(html=>{document.open();document.write(improve(html));document.close()}).catch(err=>{document.body.innerHTML='<div class="loading"><div class="panel"><h1 class="err">完整报告加载失败</h1><p class="muted">请刷新页面重试，或检查网络是否能访问 GitHub Raw 资源。</p><p class="muted">错误信息：'+String(err).replace(/[<>]/g,'')+'</p></div></div>'});
</script>
</body>
</html>
