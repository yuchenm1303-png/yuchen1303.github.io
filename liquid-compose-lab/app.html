<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>液态 Compose 玻璃调参台</title>
<style>
:root{--mix:.92;--blur:28px;--frost:.72;--tint:.42;--edge:.64;--inner:.72;--read:.82;--slot:.78;--phase:18%;--radius:34px}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","Microsoft YaHei",Arial,sans-serif;color:#f7f9ff;background:#07112f}.page{min-height:100vh;padding:28px;background:radial-gradient(circle at calc(12% + var(--phase)) 25%,rgba(91,230,215,.34),transparent 23%),radial-gradient(circle at 88% 68%,rgba(255,80,205,.46),transparent 26%),radial-gradient(circle at 63% 8%,rgba(120,160,255,.34),transparent 20%),linear-gradient(135deg,#07112c,#0b1940 50%,#201645)}.layout{max-width:1180px;margin:auto;display:grid;grid-template-columns:1fr 340px;gap:22px}.stage{position:relative;min-height:700px;border-radius:34px;padding:26px;overflow:hidden;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.03);box-shadow:0 30px 100px rgba(0,0,0,.34)}.stage:before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;left:-80px;top:180px;background:radial-gradient(circle at 30% 26%,#c8f0ff,#6997bd 42%,#111724 76%)}.stage:after{content:"";position:absolute;width:320px;height:320px;border-radius:50%;right:-80px;bottom:20px;background:radial-gradient(circle at 35% 25%,#ffd6f8,#ed45be 42%,#21102d 76%)}.orb{position:absolute;right:22%;top:-90px;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle at 40% 28%,#e4f5ff,#6c94bb 48%,#18233c 78%);opacity:.7}.title{position:relative;z-index:2}.title h1{font-size:clamp(30px,5vw,56px);line-height:1;margin:0 0 10px;letter-spacing:-1.6px}.title p{margin:0;color:rgba(232,238,255,.62);font-weight:800}.preview{position:relative;z-index:2;min-height:540px;display:grid;place-items:center}.glass{position:relative;width:min(760px,94%);min-height:360px;padding:54px 58px 42px;border-radius:var(--radius);overflow:hidden;isolation:isolate;background:linear-gradient(125deg,rgba(255,255,255,calc(.11 * var(--frost))),rgba(255,255,255,calc(.025 * var(--frost)))),linear-gradient(100deg,rgba(79,225,211,calc(.12 * var(--mix))),rgba(85,129,238,calc(.18 * var(--mix))),rgba(238,103,211,calc(.16 * var(--mix))));backdrop-filter:blur(var(--blur)) saturate(calc(120% + 70% * var(--mix)));-webkit-backdrop-filter:blur(var(--blur)) saturate(calc(120% + 70% * var(--mix)));border:1px solid rgba(255,255,255,calc(.18 * var(--edge)));box-shadow:inset 0 1px rgba(255,255,255,calc(.22 * var(--edge))),inset 0 -1px rgba(5,10,28,calc(.34 * var(--inner))),0 26px 80px rgba(0,0,0,.22)}.glass:before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at calc(18% + var(--phase)) 16%,rgba(255,255,255,calc(.20 * var(--frost))),transparent 34%),radial-gradient(circle at 84% 44%,rgba(179,216,255,calc(.15 * var(--tint))),transparent 38%),linear-gradient(180deg,rgba(2,8,28,calc(.09 * var(--read))),transparent 42%,rgba(2,8,28,calc(.13 * var(--read))));z-index:-1}.glass:after{content:"";position:absolute;inset:2px;border-radius:calc(var(--radius) - 2px);border:1px solid rgba(7,12,31,calc(.20 * var(--inner)));box-shadow:inset 0 0 0 1px rgba(255,255,255,calc(.07 * var(--edge)));pointer-events:none}.card-title{font-size:clamp(34px,5vw,58px);line-height:.95;margin:0;color:rgba(255,255,255,.94);letter-spacing:-1.2px}.sub{margin:16px 0 58px;color:rgba(235,241,255,.54);font-size:15px;font-weight:800}.seg{height:58px;border-radius:999px;display:grid;grid-template-columns:repeat(3,1fr);overflow:hidden;background:linear-gradient(110deg,rgba(255,255,255,calc(.08 + .04 * var(--slot))),rgba(255,255,255,calc(.025 + .03 * var(--slot)))),linear-gradient(90deg,rgba(94,226,212,calc(.08 * var(--mix))),rgba(96,124,230,calc(.12 * var(--mix))),rgba(238,103,211,calc(.08 * var(--mix))));backdrop-filter:blur(calc(var(--blur) * .55));border:1px solid rgba(255,255,255,calc(.10 * var(--edge)))}.seg span{display:grid;place-items:center;color:rgba(255,255,255,.76);font-size:16px;font-weight:900}.seg span+span{border-left:1px solid rgba(255,255,255,calc(.05 * var(--slot)))}.hint{position:absolute;left:58px;right:58px;bottom:30px;margin:0;color:rgba(238,243,255,.60);font-size:14px;font-weight:850}.panel{position:sticky;top:22px;align-self:start;border-radius:28px;padding:18px;background:rgba(7,13,33,.72);border:1px solid rgba(255,255,255,.11);box-shadow:0 24px 80px rgba(0,0,0,.30);backdrop-filter:blur(24px)}.panel h2{margin:0 0 8px;font-size:21px}.panel p{margin:0 0 14px;color:rgba(230,238,255,.58);font-size:13px;line-height:1.55}.control{margin:13px 0}.control label{display:flex;justify-content:space-between;font-size:13px;font-weight:900;color:rgba(245,248,255,.84);margin-bottom:6px}.control small{color:rgba(232,238,255,.45);font-weight:800}.control input{width:100%;accent-color:#8da8ff}.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.btns button{border:0;border-radius:16px;padding:12px 10px;color:#fff;font-weight:900;background:linear-gradient(135deg,rgba(118,148,255,.38),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.10)}pre{margin-top:14px;padding:12px;border-radius:18px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.08);color:rgba(230,238,255,.72);font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;max-height:210px;overflow:auto}@media(max-width:920px){.layout{grid-template-columns:1fr}.panel{position:relative}.glass{padding:36px 28px 34px;min-height:320px}.hint{left:28px;right:28px}}
</style></head>
<body><div class="page"><div class="layout"><section class="stage"><div class="orb"></div><div class="title"><h1>液态 Compose 玻璃调参台</h1><p>真实 backdrop-filter 预览，用来反推 Compose / Canvas 参数。</p></div><div class="preview"><div class="glass"><h2 class="card-title">Liquid Compose</h2><p class="sub">source-linked material · thin · frosted · readable</p><div class="seg"><span>Compose</span><span>Canvas</span><span>同源</span></div><p class="hint">目标：背景色进入玻璃，背景细节被柔化，边缘薄、润、克制。</p></div></div></section><aside class="panel"><h2>参数滑块</h2><p>调好后复制 Kotlin 参数发给我。</p><div id="controls"></div><div class="btns"><button id="soft">柔和参考</button><button id="color">彩色参考</button><button id="copy">复制参数</button><button id="reset">重置</button></div><pre id="code"></pre></aside></div></div><script>
const params={mix:['背景融合',0,1.8,.01,.92,'--mix',''],blur:['背景柔化',0,48,1,28,'--blur','px'],frost:['玻璃雾度',0,1.6,.01,.72,'--frost',''],tint:['色场补偿',0,1.6,.01,.42,'--tint',''],edge:['边缘薄线',0,1.6,.01,.64,'--edge',''],inner:['内侧暗边',0,1.6,.01,.72,'--inner',''],read:['可读暗场',0,1.6,.01,.82,'--read',''],slot:['槽体嵌入',0,1.6,.01,.78,'--slot',''],radius:['圆角半径',18,70,1,34,'--radius','px'],phase:['环境相位',0,100,1,18,'--phase','%']};
const root=document.documentElement, box=document.getElementById('controls'), code=document.getElementById('code');
function fmt(v){return Number(v).toFixed(2).replace(/\.00$/,'')}
function apply(){for(const k in params){let p=params[k];root.style.setProperty(p[5],p[4]+p[6]);let o=document.querySelector('[data-o='+k+']');if(o)o.textContent=fmt(p[4])+p[6]}code.textContent=`sourceMix=${fmt(params.mix[4])}f\nbackgroundSoftness=${fmt(params.blur[4]/48)}f\nfrost=${fmt(params.frost[4])}f\ntintCompensation=${fmt(params.tint[4])}f\nedge=${fmt(params.edge[4])}f\ninnerShade=${fmt(params.inner[4])}f\nreadability=${fmt(params.read[4])}f\nsegmentDepth=${fmt(params.slot[4])}f\nphase=${fmt(params.phase[4]/100)}f\nradiusDp=${fmt(params.radius[4])}f`;localStorage.setItem('lc-lab-app',JSON.stringify(Object.fromEntries(Object.entries(params).map(([k,p])=>[k,p[4]]))))}
function build(){let saved=JSON.parse(localStorage.getItem('lc-lab-app')||'{}');box.innerHTML='';for(const k in params){let p=params[k];if(saved[k]!=null)p[4]=saved[k];let el=document.createElement('div');el.className='control';el.innerHTML=`<label><span>${p[0]}</span><small data-o="${k}"></small></label><input type="range" min="${p[1]}" max="${p[2]}" step="${p[3]}" value="${p[4]}">`;el.querySelector('input').oninput=e=>{p[4]=Number(e.target.value);apply()};box.appendChild(el)}apply()}
function preset(o){localStorage.removeItem('lc-lab-app');for(const k in o)params[k][4]=o[k];build()}document.getElementById('soft').onclick=()=>preset({mix:.78,blur:34,frost:.86,tint:.30,edge:.54,inner:.58,read:.76,slot:.62,radius:36,phase:15});document.getElementById('color').onclick=()=>preset({mix:1.25,blur:30,frost:.74,tint:.82,edge:.62,inner:.48,read:.58,slot:.54,radius:36,phase:42});document.getElementById('reset').onclick=()=>{localStorage.removeItem('lc-lab-app');location.reload()};document.getElementById('copy').onclick=()=>navigator.clipboard?.writeText(code.textContent);build();
</script></body></html>
