<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>液态 Compose 玻璃调参台</title>
<style>
:root{
  --source: .92;
  --blur: 28px;
  --frost: .72;
  --tint: .42;
  --edge: .64;
  --inner: .72;
  --read: .82;
  --segment: .78;
  --radius: 34px;
  --phase: 18%;
  --scale: 1;
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","Microsoft YaHei",Arial,sans-serif;color:#f7f9ff;background:#07112f}body{overflow-x:hidden}.page{min-height:100vh;padding:28px clamp(14px,3vw,36px);background:radial-gradient(circle at calc(15% + var(--phase)) 24%,rgba(94,226,212,.34),transparent 22%),radial-gradient(circle at 88% 68%,rgba(255,79,205,.46),transparent 24%),radial-gradient(circle at 65% 8%,rgba(110,154,255,.32),transparent 20%),linear-gradient(135deg,#07112c,#0b1940 48%,#1b1642);}.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;max-width:1260px;margin:0 auto}.stage{position:relative;min-height:720px;border-radius:34px;padding:28px;overflow:hidden;border:1px solid rgba(255,255,255,.08);background:linear-gradient(145deg,rgba(255,255,255,.035),rgba(255,255,255,.01));box-shadow:0 30px 100px rgba(0,0,0,.32)}.stage:before,.stage:after{content:"";position:absolute;border-radius:50%;filter:blur(4px);opacity:.9}.stage:before{width:260px;height:260px;left:-70px;top:170px;background:radial-gradient(circle at 30% 28%,#c3ecff,#5e92b8 42%,#101521 78%)}.stage:after{width:300px;height:300px;right:-70px;bottom:24px;background:radial-gradient(circle at 35% 25%,#ffd3f7,#e749bd 42%,#22112d 76%)}.orb{position:absolute;right:20%;top:-80px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle at 40% 28%,#d8efff,#6f94b7 46%,#18223a 78%);filter:blur(2px);opacity:.65}.stripe{position:absolute;inset:-20%;background:linear-gradient(120deg,transparent 28%,rgba(255,255,255,.05) 31%,transparent 34%,transparent 58%,rgba(255,255,255,.04) 61%,transparent 64%);transform:translateX(calc((var(--phase) - 50%) * .45));opacity:.65}.title{position:relative;z-index:2;margin:4px 0 28px}.title h1{font-size:clamp(28px,4.5vw,54px);line-height:1;margin:0 0 10px;letter-spacing:-1.4px}.title p{margin:0;color:rgba(232,238,255,.62);font-weight:800}.preview-wrap{position:relative;z-index:2;display:grid;place-items:center;min-height:520px}.glass-card{width:min(760px,92%);min-height:360px;border-radius:calc(var(--radius) * var(--scale));position:relative;overflow:hidden;padding:54px 58px 42px;isolation:isolate;background:linear-gradient(125deg,rgba(255,255,255,calc(.11 * var(--frost))),rgba(255,255,255,calc(.025 * var(--frost)))) ,linear-gradient(100deg,rgba(79,225,211,calc(.12 * var(--source))),rgba(85,129,238,calc(.18 * var(--source))),rgba(238,103,211,calc(.16 * var(--source))));backdrop-filter:blur(var(--blur)) saturate(calc(120% + 70% * var(--source))) brightness(calc(1 + .12 * var(--frost)));-webkit-backdrop-filter:blur(var(--blur)) saturate(calc(120% + 70% * var(--source))) brightness(calc(1 + .12 * var(--frost)));border:1px solid rgba(255,255,255,calc(.18 * var(--edge)));box-shadow:inset 0 1px rgba(255,255,255,calc(.22 * var(--edge))),inset 0 -1px rgba(5,10,28,calc(.34 * var(--inner))),0 26px 80px rgba(0,0,0,.20)}.glass-card:before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at calc(18% + var(--phase)) 16%,rgba(255,255,255,calc(.20 * var(--frost))),transparent 34%),radial-gradient(circle at calc(84% - var(--phase) * .25) 44%,rgba(179,216,255,calc(.15 * var(--tint))),transparent 38%),linear-gradient(180deg,rgba(2,8,28,calc(.09 * var(--read))),transparent 42%,rgba(2,8,28,calc(.13 * var(--read))));pointer-events:none;z-index:-1}.glass-card:after{content:"";position:absolute;inset:2px;border-radius:calc(var(--radius) * var(--scale) - 2px);border:1px solid rgba(7,12,31,calc(.20 * var(--inner)));box-shadow:inset 0 0 0 1px rgba(255,255,255,calc(.07 * var(--edge)));pointer-events:none}.card-title{font-size:clamp(34px,5vw,58px);line-height:.95;margin:0;color:rgba(255,255,255,.94);letter-spacing:-1.2px}.card-sub{margin:16px 0 58px;color:rgba(235,241,255,.54);font-size:15px;font-weight:800;letter-spacing:.4px}.seg{height:58px;border-radius:999px;display:grid;grid-template-columns:repeat(3,1fr);align-items:center;overflow:hidden;background:linear-gradient(110deg,rgba(255,255,255,calc(.08 + .04 * var(--segment))),rgba(255,255,255,calc(.025 + .03 * var(--segment)))),linear-gradient(90deg,rgba(94,226,212,calc(.08 * var(--source))),rgba(96,124,230,calc(.12 * var(--source))),rgba(238,103,211,calc(.08 * var(--source))));backdrop-filter:blur(calc(var(--blur) * .55)) saturate(160%);-webkit-backdrop-filter:blur(calc(var(--blur) * .55)) saturate(160%);box-shadow:inset 0 1px rgba(255,255,255,calc(.12 * var(--edge))),inset 0 -1px rgba(0,0,0,calc(.16 * var(--segment)));border:1px solid rgba(255,255,255,calc(.10 * var(--edge)))}.seg span{height:100%;display:grid;place-items:center;color:rgba(255,255,255,.76);font-weight:900;font-size:16px}.seg span+span{border-left:1px solid rgba(255,255,255,calc(.05 * var(--segment)))}.hint{position:absolute;left:58px;right:58px;bottom:30px;margin:0;color:rgba(238,243,255,.60);font-size:14px;font-weight:850}.panel{position:sticky;top:22px;align-self:start;border-radius:28px;padding:18px;background:rgba(7,13,33,.70);border:1px solid rgba(255,255,255,.10);box-shadow:0 24px 80px rgba(0,0,0,.28);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}.panel h2{margin:0 0 8px;font-size:21px}.panel p{margin:0 0 16px;color:rgba(230,238,255,.58);font-size:13px;line-height:1.55}.control{margin:14px 0}.control label{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:900;color:rgba(245,248,255,.84);margin-bottom:7px}.control small{color:rgba(232,238,255,.45);font-weight:800}.control input{width:100%;accent-color:#8da8ff}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.actions button{border:0;border-radius:16px;padding:12px 10px;color:#fff;font-weight:900;background:linear-gradient(135deg,rgba(118,148,255,.38),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.10);cursor:pointer}.code{margin-top:14px;padding:12px;border-radius:18px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.08);color:rgba(230,238,255,.72);font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;max-height:210px;overflow:auto}.badge-row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.badge{font-size:12px;font-weight:900;color:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 9px;background:rgba(255,255,255,.06)}@media(max-width:980px){.layout{grid-template-columns:1fr}.panel{position:relative;top:0}.stage{min-height:640px;padding:18px}.glass-card{padding:36px 28px 34px;min-height:320px}.hint{left:28px;right:28px}.card-sub{margin-bottom:40px}}
</style>
</head>
<body>
<div class="page">
  <div class="layout">
    <section class="stage">
      <div class="orb"></div><div class="stripe"></div>
      <div class="title"><h1>液态 Compose 玻璃调参台</h1><p>Web 预览用真实 backdrop-filter；参数用于反推 Compose / Canvas 伪玻璃。</p></div>
      <div class="preview-wrap">
        <div class="glass-card">
          <h2 class="card-title">Liquid Compose</h2>
          <p class="card-sub">source-linked material · thin · frosted · readable</p>
          <div class="seg"><span>Compose</span><span>Canvas</span><span>同源</span></div>
          <p class="hint">目标：背景色进入玻璃，背景细节被柔化，边缘保持薄、润、克制。</p>
        </div>
      </div>
    </section>
    <aside class="panel">
      <h2>参数滑块</h2>
      <p>这里比 App 里调更快。满意后复制参数，我再把 Compose 版本按同一方向固化。</p>
      <div class="badge-row"><span class="badge">source / effect</span><span class="badge">thin material</span><span class="badge">no shader fallback</span></div>
      <div id="controls"></div>
      <div class="actions"><button id="copyCss">复制 CSS</button><button id="copyKotlin">复制 Kotlin 参数</button><button id="presetSoft">柔和参考</button><button id="presetColor">彩色参考</button></div>
      <pre class="code" id="code"></pre>
    </aside>
  </div>
</div>
<script>
const params={
  source:{label:'背景融合',desc:'背景颜色进入玻璃',min:0,max:1.8,step:.01,value:.92,css:'--source'},
  blur:{label:'背景柔化',desc:'真实网站 blur，Compose 里对应伪柔化',min:0,max:48,step:1,value:28,css:'--blur',unit:'px'},
  frost:{label:'玻璃雾度',desc:'乳玻璃/雾面强度',min:0,max:1.6,step:.01,value:.72,css:'--frost'},
  tint:{label:'色场补偿',desc:'背景太暗时补青紫色面',min:0,max:1.6,step:.01,value:.42,css:'--tint'},
  edge:{label:'边缘薄线',desc:'薄边和顶部一笔光',min:0,max:1.6,step:.01,value:.64,css:'--edge'},
  inner:{label:'内侧暗边',desc:'单层内凹压边',min:0,max:1.6,step:.01,value:.72,css:'--inner'},
  read:{label:'可读暗场',desc:'保护文字对比度',min:0,max:1.6,step:.01,value:.82,css:'--read'},
  segment:{label:'槽体嵌入',desc:'分段胶囊压入感',min:0,max:1.6,step:.01,value:.78,css:'--segment'},
  radius:{label:'圆角半径',desc:'外壳圆角',min:18,max:70,step:1,value:34,css:'--radius',unit:'px'},
  phase:{label:'环境相位',desc:'模拟背景色场移动',min:0,max:100,step:1,value:18,css:'--phase',unit:'%'},
  scale:{label:'圆角倍率',desc:'辅助观察大/小圆角',min:.75,max:1.55,step:.01,value:1,css:'--scale'}
};
const root=document.documentElement, controls=document.getElementById('controls'), code=document.getElementById('code');
function fmt(v){return Number(v).toFixed(2).replace(/\.00$/,'')}
function apply(){
  for(const k in params){const p=params[k];root.style.setProperty(p.css, p.value + (p.unit||''));const out=document.querySelector(`[data-out="${k}"]`);if(out)out.textContent=fmt(p.value)+(p.unit||'')}
  const kotlin=`BackdropEnvironment(\n  sourceMix = ${fmt(params.source.value)}f,\n  backgroundSoftness = ${fmt(params.blur.value/48)}f,\n  frost = ${fmt(params.frost.value)}f,\n  tintCompensation = ${fmt(params.tint.value)}f,\n  edge = ${fmt(params.edge.value)}f,\n  innerShade = ${fmt(params.inner.value)}f,\n  readability = ${fmt(params.read.value)}f,\n  segmentDepth = ${fmt(params.segment.value)}f,\n  phase = ${fmt(params.phase.value/100)}f,\n  radiusDp = ${fmt(params.radius.value)}f\n)`;
  code.textContent=kotlin;
  localStorage.setItem('liquid-compose-lab',JSON.stringify(Object.fromEntries(Object.entries(params).map(([k,p])=>[k,p.value]))));
}
function build(){
  const saved=JSON.parse(localStorage.getItem('liquid-compose-lab')||'{}');
  for(const k in params){if(saved[k]!=null)params[k].value=saved[k];const p=params[k];const el=document.createElement('div');el.className='control';el.innerHTML=`<label><span>${p.label}</span><small data-out="${k}"></small></label><input type="range" min="${p.min}" max="${p.max}" step="${p.step}" value="${p.value}"><small>${p.desc}</small>`;el.querySelector('input').addEventListener('input',e=>{p.value=Number(e.target.value);apply()});controls.appendChild(el)}apply();
}
function setPreset(obj){for(const k in obj){if(params[k])params[k].value=obj[k]}controls.innerHTML='';build()}
document.getElementById('presetSoft').onclick=()=>setPreset({source:.78,blur:34,frost:.86,tint:.30,edge:.54,inner:.58,read:.76,segment:.62,radius:36,phase:15,scale:1});
document.getElementById('presetColor').onclick=()=>setPreset({source:1.25,blur:30,frost:.74,tint:.82,edge:.62,inner:.48,read:.58,segment:.54,radius:36,phase:42,scale:1});
document.getElementById('copyKotlin').onclick=()=>navigator.clipboard?.writeText(code.textContent);
document.getElementById('copyCss').onclick=()=>{const css=Object.values(params).map(p=>`${p.css}: ${p.value}${p.unit||''};`).join('\n');navigator.clipboard?.writeText(css)};
build();
</script>
</body>
</html>
