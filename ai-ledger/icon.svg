<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="AI助手图标">
  <title>AI助手图标</title>
  <defs>
    <clipPath id="clip">
      <rect width="1024" height="1024" rx="112" ry="112"/>
    </clipPath>

    <radialGradient id="skyBlue" cx="10%" cy="12%" r="72%">
      <stop offset="0" stop-color="#2B91FF" stop-opacity="0.72"/>
      <stop offset="0.34" stop-color="#071F62" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#020A31"/>
    </radialGradient>
    <radialGradient id="warmGlow" cx="96%" cy="63%" r="55%">
      <stop offset="0" stop-color="#FFB56D" stop-opacity="0.95"/>
      <stop offset="0.24" stop-color="#FF7F91" stop-opacity="0.62"/>
      <stop offset="0.58" stop-color="#42245E" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#020A31" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="leftRim" cx="0%" cy="50%" r="45%">
      <stop offset="0" stop-color="#65C2FF" stop-opacity="0.82"/>
      <stop offset="0.38" stop-color="#1E66FF" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#1E66FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glassSheen" cx="50%" cy="0%" r="85%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.34" stop-color="#9ACBFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="border" x1="30" y1="60" x2="990" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#88D7FF"/>
      <stop offset="0.20" stop-color="#2E83FF"/>
      <stop offset="0.56" stop-color="#6B5AF0"/>
      <stop offset="0.84" stop-color="#FF91AC"/>
      <stop offset="1" stop-color="#FFD29A"/>
    </linearGradient>
    <linearGradient id="borderHi" x1="60" y1="92" x2="950" y2="940" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="0.28" stop-color="#87BEFF" stop-opacity="0.20"/>
      <stop offset="0.74" stop-color="#FFD2D0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.50"/>
    </linearGradient>
    <linearGradient id="waveTop" x1="0" y1="560" x2="1024" y2="665" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1A67FF" stop-opacity="0.88"/>
      <stop offset="0.28" stop-color="#2D5EEB" stop-opacity="0.82"/>
      <stop offset="0.55" stop-color="#7566E8" stop-opacity="0.74"/>
      <stop offset="0.78" stop-color="#FF9C99" stop-opacity="0.84"/>
      <stop offset="1" stop-color="#FFB86D" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="waveSoft" x1="0" y1="620" x2="1024" y2="765" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2F7BFF" stop-opacity="0.36"/>
      <stop offset="0.38" stop-color="#5A63EF" stop-opacity="0.34"/>
      <stop offset="0.72" stop-color="#FF9AAC" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFBC7A" stop-opacity="0.46"/>
    </linearGradient>
    <linearGradient id="deepWave" x1="0" y1="725" x2="1024" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#031150" stop-opacity="0.96"/>
      <stop offset="0.35" stop-color="#071B5E" stop-opacity="0.92"/>
      <stop offset="0.68" stop-color="#161B54" stop-opacity="0.84"/>
      <stop offset="1" stop-color="#5E345D" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="horizon" x1="142" y1="512" x2="935" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9CC7FF" stop-opacity="0.42"/>
      <stop offset="0.50" stop-color="#B2A8FF" stop-opacity="0.34"/>
      <stop offset="0.77" stop-color="#FFD4D4" stop-opacity="0.74"/>
      <stop offset="1" stop-color="#FFE2A6" stop-opacity="0.64"/>
    </linearGradient>

    <filter id="softBlur" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.92" numOctaves="2" seed="8"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.045"/>
      </feComponentTransfer>
    </filter>
    <filter id="starGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1024" height="1024" fill="#020A31"/>
    <rect width="1024" height="1024" fill="url(#skyBlue)"/>
    <rect width="1024" height="1024" fill="url(#warmGlow)"/>
    <rect width="1024" height="1024" fill="url(#leftRim)"/>
    <rect width="1024" height="1024" fill="url(#glassSheen)"/>
    <rect width="1024" height="1024" filter="url(#grain)" opacity="0.72"/>

    <g fill="#FFFFFF" opacity="0.92">
      <circle cx="92" cy="210" r="2"/><circle cx="124" cy="386" r="1.6"/><circle cx="177" cy="72" r="1.8"/>
      <circle cx="180" cy="471" r="2.2"/><circle cx="205" cy="142" r="1.8"/><circle cx="228" cy="258" r="2"/>
      <circle cx="248" cy="398" r="1.7"/><circle cx="288" cy="520" r="2.3"/><circle cx="313" cy="38" r="1.4"/>
      <circle cx="338" cy="148" r="1.4"/><circle cx="364" cy="318" r="2.2"/><circle cx="397" cy="244" r="1.5"/>
      <circle cx="432" cy="434" r="1.5"/><circle cx="464" cy="118" r="2"/><circle cx="506" cy="360" r="2"/>
      <circle cx="545" cy="74" r="1.5"/><circle cx="569" cy="213" r="2"/><circle cx="606" cy="473" r="1.6"/>
      <circle cx="642" cy="146" r="1.8"/><circle cx="681" cy="332" r="1.8"/><circle cx="716" cy="238" r="1.6"/>
      <circle cx="748" cy="498" r="1.8"/><circle cx="790" cy="124" r="2"/><circle cx="820" cy="278" r="1.9"/>
      <circle cx="846" cy="431" r="2"/><circle cx="898" cy="216" r="1.8"/><circle cx="930" cy="330" r="1.6"/>
      <circle cx="972" cy="487" r="1.6"/><circle cx="676" cy="24" r="1.4"/><circle cx="735" cy="82" r="1.4"/>
      <circle cx="879" cy="72" r="1.4"/><circle cx="946" cy="106" r="1.8"/><circle cx="294" cy="190" r="1.4"/>
      <circle cx="430" cy="286" r="1.8"/><circle cx="742" cy="360" r="2.2"/><circle cx="903" cy="524" r="1.7"/>
    </g>

    <g stroke="#FFFFFF" stroke-linecap="round" filter="url(#starGlow)" opacity="0.96">
      <path d="M409 204v37M390.5 222.5h37" stroke-width="3.2"/>
      <path d="M245 440v29M230.5 454.5h29" stroke-width="2.8"/>
      <path d="M674 492v22M663 503h22" stroke-width="2.3"/>
      <path d="M916 250v18M907 259h18" stroke-width="2"/>
      <path d="M526 108v18M517 117h18" stroke-width="2"/>
      <path d="M202 164v16M194 172h16" stroke-width="2"/>
    </g>

    <path d="M-20 598 C96 543 182 513 294 526 C401 538 481 591 573 626 C671 663 758 676 843 642 C918 612 973 559 1044 545 L1044 760 L-20 760 Z" fill="url(#waveSoft)" filter="url(#softBlur)" opacity="0.88"/>
    <path d="M-22 593 C93 540 181 514 292 529 C405 544 477 591 570 628 C670 668 755 678 841 646 C920 617 975 562 1046 548 L1046 755 L-22 755 Z" fill="url(#waveTop)" opacity="0.82"/>
    <path d="M-22 596 C95 540 181 514 292 529 C405 544 477 591 570 628 C670 668 755 678 841 646 C920 617 975 562 1046 548" fill="none" stroke="url(#horizon)" stroke-width="5.2" opacity="0.86"/>
    <path d="M-26 731 C93 681 193 666 305 700 C438 740 498 801 632 800 C755 799 842 755 950 706 C994 686 1029 678 1050 678 L1050 1048 L-26 1048 Z" fill="url(#deepWave)" opacity="0.98"/>
    <path d="M-26 728 C96 676 194 664 306 698 C438 739 496 799 632 798 C756 797 843 753 950 704 C994 684 1029 676 1050 676" fill="none" stroke="#7CB7FF" stroke-width="2.8" opacity="0.23"/>
    <path d="M480 666 C594 724 716 735 841 666 C911 627 977 586 1046 572 L1046 750 C948 688 891 722 814 754 C706 799 589 765 486 697 Z" fill="#FF9A7E" opacity="0.14"/>

    <rect x="8" y="8" width="1008" height="1008" rx="108" ry="108" fill="none" stroke="url(#border)" stroke-width="16" opacity="0.92"/>
    <rect x="27" y="27" width="970" height="970" rx="96" ry="96" fill="none" stroke="url(#borderHi)" stroke-width="3.2" opacity="0.78"/>
    <path d="M39 72 C70 33 118 23 171 23 L854 23 C928 23 984 72 998 145" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.16"/>
    <path d="M24 816 L24 170 C24 94 82 28 164 24" fill="none" stroke="#7AD2FF" stroke-width="7" opacity="0.42"/>
    <path d="M1000 194 L1000 824 C1000 889 958 958 884 996" fill="none" stroke="#FFD0A0" stroke-width="7" opacity="0.36"/>
