<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="AI助手图标">
  <title>AI助手图标</title>
  <defs>
    <clipPath id="clip"><rect width="512" height="512" rx="94" ry="94"/></clipPath>
    <radialGradient id="sky" cx="18%" cy="10%" r="88%">
