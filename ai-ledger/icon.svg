      <stop offset="0.62" stop-color="#020c3a"/>
      <stop offset="1" stop-color="#02072d"/>
    </radialGradient>
    <radialGradient id="glow" cx="98%" cy="62%" r="58%">
      <stop offset="0" stop-color="#ffbd72" stop-opacity="1"/>
      <stop offset="0.28" stop-color="#ff7d91" stop-opacity="0.72"/>
      <stop offset="0.62" stop-color="#462360" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#02072d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave1" x1="0" y1="290" x2="512" y2="355" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b6fff" stop-opacity="0.90"/>
      <stop offset="0.38" stop-color="#5b65f0" stop-opacity="0.82"/>
      <stop offset="0.70" stop-color="#df83ba" stop-opacity="0.82"/>
