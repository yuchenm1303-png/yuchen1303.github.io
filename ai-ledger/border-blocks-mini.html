<!doctype html><html lang=zh-CN><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Border mini</title><style>:root{--blur:34px;--a:.46;--ring:8px;--strip:.32;--sb:12px;--line:.24;--top:.15;--inner:.08;--glint:.06;--shadow:.13;--mist:.13;--r:36px;--sat:1.22;--con:1.1;--bri:1.06}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#07111f;color:white;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;display:grid;grid-template-columns:minmax(330px,430px) minmax(300px,460px);gap:20px;padding:20px;justify-content:center}.phone{position:sticky;top:16px;width:min(100%,430px);aspect-ratio:9/19.5;border-radius:38px;overflow:hidden;background:#061426;border:1px solid #fff2;box-shadow:0 24px 60px #0008}.bg{position:absolute;inset:0;background:linear-gradient(#061426,#0a2848 45%,#16436b 75%,#07111f)}.bg:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 18% 14%,#18afff 0 7%,transparent 13%),radial-gradient(circle at 46% 14%,#ffbd2c 0 7%,transparent 13%),radial-gradient(circle at 74% 14%,#303141 0 7%,transparent 13%),radial-gradient(circle at 90% 14%,#fff 0 7%,transparent 13%),radial-gradient(circle at 20% 43%,#dce8f3 0 8%,transparent 14%),radial-gradient(circle at 43% 43%,#1684ff 0 8%,transparent 14%),radial-gradient(circle at 68% 43%,#24bfff 0 8%,transparent 14%),radial-gradient(circle at 88% 43%,#ffc12f 0 8%,transparent 14%),radial-gradient(circle at 20% 65%,#1d2030 0 8%,transparent 14%),radial-gradient(circle at 46% 65%,#fff 0 8%,transparent 14%),radial-gradient(circle at 70% 65%,#ff4d58 0 8%,transparent 14%),radial-gradient(circle at 90% 65%,#ff941d 0 8%,transparent 14%)}.bg:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,#ffffff22 16%,transparent 30%,#ffffff1c 48%,transparent 62%,#ffffff1c 80%,transparent),linear-gradient(#0006,transparent 24%,transparent 72%,#0005)}.content{position:relative;z-index:2;padding:34px 16px 90px}h1{font-size:48px;line-height:.92;margin:0 0 8px;font-weight:950}.sub{color:#ffffffa5;font-size:18px;font-weight:750;margin-bottom:20px}.card{position:relative;height:118px;margin:18px 0;border-radius:var(--r);overflow:hidden;isolation:isolate;box-shadow:0 14px 28px #0004}.tall{height:204px}.card:before{content:'';position:absolute;inset:0;background:rgba(135,160,194,var(--a));backdrop-filter:blur(var(--blur)) saturate(1.16);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.16)}.edge{position:absolute;inset:0;filter:contrast(var(--con)) saturate(var(--sat)) brightness(var(--bri));z-index:1}.edge span{position:absolute;background:#fff1;backdrop-filter:blur(var(--sb)) saturate(1.3) contrast(1.16);-webkit-backdrop-filter:blur(var(--sb)) saturate(1.3) contrast(1.16);opacity:var(--strip)}.t{top:0;left:0;right:0;height:var(--ring)}.bb{bottom:0;left:0;right:0;height:var(--ring)}.l{left:0;top:var(--ring);bottom:var(--ring);width:var(--ring)}.rr{right:0;top:var(--ring);bottom:var(--ring);width:var(--ring)}.card:after{content:'';position:absolute;inset:0;z-index:3;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,var(--line)),inset 0 2px 1px rgba(255,255,255,var(--top)),inset 0 0 0 calc(var(--ring)*.38) rgba(255,255,255,var(--inner)),inset 0 -2px 5px rgba(2,8,20,var(--shadow));background:radial-gradient(circle at 12% 10%,rgba(255,255,255,var(--glint)),transparent 26%),linear-gradient(rgba(255,255,255,var(--mist)),transparent 35%,#050a160d);mix-blend-mode:screen}.cc{position:relative;z-index:4;height:100%;display:flex;align-items:center;gap:18px;padding:0 28px;text-shadow:0 1px 2px #0004}.icon{width:60px;height:60px;border-radius:20px;display:grid;place-items:center;background:#fff3;font-size:26px;font-weight:950}.title{font-size:30px;font-weight:950}.desc{margin-top:5px;color:#ffffffad;font-size:17px;font-weight:720}.arr{margin-left:auto;font-size:38px}.chips{display:flex;gap:14px;width:100%;margin-top:18px}.chip{flex:1;height:68px;border-radius:30px;display:grid;place-items:center;font-size:26px;font-weight:950;background:#16285052;backdrop-filter:blur(18px);box-shadow:inset 0 0 0 1px #fff4}.panel{background:#151d2de0;border:1px solid #fff2;border-radius:28px;padding:20px}.hint{color:#ffffffa0;line-height:1.55;font-size:14px}.ctl{margin:12px 0}.lab{display:flex;justify-content:space-between;color:#ffffffc0;font-size:14px;margin-bottom:6px}.val{color:#d9e8ff}input{width:100%;accent-color:#bad7ff}button{border:1px solid #fff3;background:#fff2;color:white;padding:10px 12px;border-radius:12px;font-weight:850;margin:6px 6px 6px 0}pre{background:#050912c2;border-radius:14px;padding:12px;color:#d9e6ff;white-space:pre-wrap;font-size:13px}@media(max-width:850px){body{grid-template-columns:1fr;padding:12px}.phone{position:relative;top:0;margin:auto;max-height:76vh}}</style><body><main class=phone><div class=bg></div><section class=content><h1>功能</h1><div class=sub>色块背景 · 看边框折射</div><article class='card tall'><div class=edge><span class=t></span><span class=bb></span><span class=l></span><span class=rr></span></div><div class=cc style='align-items:flex-start;flex-direction:column;padding-top:24px'><div class=title>先保留入口，再逐步接入旧版功能</div><div class=desc>这里集中放手机任务、账本工具和 Web 迁移能力。</div><div class=chips><div class=chip>¥47</div><div class=chip>6</div><div class=chip>预览</div></div></div></article><article class=card><div class=edge><span class=t></span><span class=bb></span><span class=l></span><span class=rr></span></div><div class=cc><div class=icon>账</div><div><div class=title>账单中心</div><div class=desc>查看和管理收入支出</div></div><div class=arr>›</div></div></article><article class=card><div class=edge><span class=t></span><span class=bb></span><span class=l></span><span class=rr></span></div><div class=cc><div class=icon>图</div><div><div class=title>数据统计</div><div class=desc>按周、月、年查看趋势</div></div><div class=arr>›</div></div></article><article class=card><div class=edge><span class=t></span><span class=bb></span><span class=l></span><span class=rr></span></div><div class=cc><div class=icon>铃</div><div><div class=title>提醒闹钟</div><div class=desc>创建提醒和闹钟</div></div><div class=arr>›</div></div></article></section></main><aside class=panel><h2>色块边框调参</h2><p class=hint>用锐利色块观察：白线是否太多、折射带是否明显、底部暗边是否脏。</p><div id=c></div><p><button data-p=clean>干净</button><button data-p=strong>折射强</button><button data-p=soft>柔和</button><button id=copy>复制参数</button></p><pre id=o></pre></aside><script>const D=[['blur','主体模糊',12,70,1,34,'px'],['a','主体透明度',.2,.85,.01,.46,''],['ring','折射带宽',2,20,1,8,'px'],['strip','折射透明度',0,1,.01,.32,''],['sb','折射带模糊',0,30,1,12,'px'],['con','边缘对比',.8,1.6,.01,1.1,''],['sat','边缘饱和',.8,1.8,.01,1.22,''],['bri','边缘亮度',.8,1.4,.01,1.06,''],['line','极细外高光',0,.7,.01,.24,''],['top','顶部高光',0,.6,.01,.15,''],['inner','内侧二次边',0,.4,.01,.08,''],['glint','圆角glint',0,.35,.01,.06,''],['shadow','底部暗边',0,.5,.01,.13,''],['mist','顶部雾面',0,.4,.01,.13,''],['r','圆角',20,52,1,36,'px']];const P={clean:{blur:34,a:.46,ring:8,strip:.32,sb:12,con:1.1,sat:1.22,bri:1.06,line:.24,top:.15,inner:.08,glint:.06,shadow:.13,mist:.13,r:36},strong:{blur:38,a:.48,ring:12,strip:.48,sb:16,con:1.26,sat:1.42,bri:1.1,line:.2,top:.13,inner:.05,glint:.04,shadow:.15,mist:.1,r:36},soft:{blur:34,a:.42,ring:6,strip:.22,sb:10,con:1.04,sat:1.1,bri:1.02,line:.18,top:.1,inner:.04,glint:.03,shadow:.09,mist:.1,r:36}};let V={},root=document.documentElement,c=document.getElementById('c'),o=document.getElementById('o');function f(v){v=+v;return Number.isInteger(v)?''+v:v.toFixed(2)}function set(k,v){let d=D.find(x=>x[0]==k);V[k]=+v;root.style.setProperty('--'+k,f(v)+d[6]);let s=document.querySelector('[data-v='+k+']');if(s)s.textContent=f(v)+d[6];rend()}function rend(){o.textContent=`Border block params\nringWidth=${f(V.ring)}\nstripAlpha=${f(V.strip)}\nstripBlur=${f(V.sb)}\nedgeContrast=${f(V.con)}\nedgeSaturation=${f(V.sat)}\nedgeBrightness=${f(V.bri)}\nouterLineAlpha=${f(V.line)}\ntopHighlightAlpha=${f(V.top)}\ninnerLineAlpha=${f(V.inner)}\ncornerGlintAlpha=${f(V.glint)}\nbottomShadowAlpha=${f(V.shadow)}\nmistAlpha=${f(V.mist)}\nradius=${f(V.r)}\nbodyAlpha=${f(V.a)}\nblur=${f(V.blur)}`}D.forEach(([k,l,min,max,st,def,u])=>{c.insertAdjacentHTML('beforeend',`<div class=ctl><div class=lab><span>${l}</span><span class=val data-v=${k}>${def}${u}</span></div><input data-k=${k} type=range min=${min} max=${max} step=${st} value=${def}></div>`);set(k,def)});c.oninput=e=>{if(e.target.dataset.k)set(e.target.dataset.k,e.target.value)};document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>Object.entries(P[b.dataset.p]).forEach(([k,v])=>{document.querySelector('[data-k='+k+']').value=v;set(k,v)}));copy.onclick=async()=>{await navigator.clipboard.writeText(o.textContent);copy.textContent='已复制';setTimeout(()=>copy.textContent='复制参数',800)}</script>
