<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>AI Ledger · 记忆快捷面板实验台 V4</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050815}
    iframe{display:block;width:100%;height:100%;border:0;background:#050815}
  </style>
</head>
<body>
  <iframe id="preview" src="./memory-quick-panel-web-preview-v1.html" title="记忆快捷面板实验台 V4"></iframe>
  <script>
    const frame = document.getElementById('preview');

    frame.addEventListener('load', () => {
      const d = frame.contentDocument;
      const w = frame.contentWindow;
      if (!d || !w) return;

      d.title = 'AI Ledger · 记忆快捷面板实验台 V4';
      const stageNote = d.querySelector('.stage-note');
      if (stageNote) {
        stageNote.innerHTML = '<b>记忆快捷面板 · V4</b><span>标准一体气泡 / 正向右移 / 精修锚点与胶囊光效</span>';
      }
      const lead = d.querySelector('.lab .lead');
      if (lead) {
        lead.textContent = '向右偏移现在为正向：数值越大，面板越往右。气泡轮廓由单一 SVG 路径生成，尾部与主体不再拼接。';
      }

      const style = d.createElement('style');
      style.textContent = `
        :root {
          --panel-x: 46px;
          --tail-center: 189px;
        }

        .memory-trigger {
          width: 42px !important;
          height: 24px !important;
          padding: 0 !important;
          border: 0 !important;
          border-radius: 999px !important;
          position: relative !important;
          display: inline-flex !important;
          align-items: center !important;
          justify-content: center !important;
          isolation: isolate !important;
          overflow: visible !important;
          background:
            radial-gradient(circle at 26% 18%, rgba(255,255,255,.22), transparent 34%),
            linear-gradient(145deg, rgba(255,255,255,.13), rgba(255,255,255,.052) 44%, rgba(255,255,255,.022)) !important;
          box-shadow:
            inset 0 1px 0 rgba(255,255,255,.16),
            inset 0 -1px 0 rgba(88,128,255,.06),
            0 6px 18px rgba(3,8,28,.20) !important;
          transition: transform .22s cubic-bezier(.2,.8,.2,1), filter .25s ease !important;
        }
        .memory-trigger::before,.memory-trigger::after{display:none!important}
        .v4-trigger-aurora,.v4-trigger-halo,.v4-trigger-sheen,.v4-trigger-rings,.v4-trigger-particles{position:absolute;pointer-events:none}
        .v4-trigger-aurora{
          inset:-1px;border-radius:inherit;padding:1px;
          background:conic-gradient(from 0deg,rgba(var(--accent-a),.72),rgba(var(--accent-b),.55),rgba(var(--accent-c),.50),rgba(255,255,255,.16),rgba(var(--accent-a),.72));
          -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
          -webkit-mask-composite:xor;mask-composite:exclude;
          opacity:.50;animation:v4TriggerAurora 7.5s linear infinite
        }
        .v4-trigger-halo{
          inset:-7px;z-index:-1;border-radius:999px;
          background:radial-gradient(circle at 26% 50%,rgba(var(--accent-a),.44),transparent 34%),radial-gradient(circle at 66% 40%,rgba(var(--accent-b),.42),transparent 42%),radial-gradient(circle at 88% 70%,rgba(var(--accent-c),.25),transparent 36%);
          filter:blur(8px);opacity:.54;transform:scale(.90);animation:v4TriggerHalo 3.2s ease-in-out infinite alternate
        }
        .v4-trigger-sheen{inset:1px;border-radius:inherit;overflow:hidden;opacity:.66}
        .v4-trigger-sheen::after{
          content:"";position:absolute;width:18px;height:160%;left:-26px;top:-30%;transform:rotate(17deg);
          background:linear-gradient(90deg,transparent,rgba(255,255,255,.42),transparent);
          animation:v4TriggerSweep 4.2s ease-in-out infinite
        }
        .v4-trigger-rings{inset:0;border-radius:inherit}
        .v4-trigger-rings i{position:absolute;inset:-1px;border:1px solid rgba(202,218,255,.18);border-radius:inherit;opacity:0;transform:scale(.96)}
        .v4-trigger-particles{inset:-6px}
        .v4-trigger-particles i{position:absolute;width:3px;height:3px;border-radius:50%;opacity:.54;box-shadow:0 0 7px currentColor}
        .v4-trigger-particles i:nth-child(1){left:2px;top:5px;color:rgb(var(--accent-a));animation:v4ParticleA 3.6s ease-in-out infinite}
        .v4-trigger-particles i:nth-child(2){right:3px;top:2px;color:rgb(var(--accent-b));animation:v4ParticleB 4.1s .6s ease-in-out infinite}
        .v4-trigger-particles i:nth-child(3){right:8px;bottom:1px;color:rgb(var(--accent-c));animation:v4ParticleA 4.5s 1.1s ease-in-out infinite reverse}
        .v4-folder-icon{width:16px;height:16px;position:relative;z-index:2;overflow:visible;filter:drop-shadow(0 0 8px rgba(var(--accent-b),.26));transition:transform .24s cubic-bezier(.2,.8,.2,1),filter .24s ease}
        .v4-folder-tab,.v4-folder-body,.v4-folder-line{transform-box:fill-box;transform-origin:center;transition:transform .24s cubic-bezier(.2,.8,.2,1)}
        .v4-folder-spark{transform-origin:center;opacity:.36;animation:v4FolderSpark 2.8s ease-in-out infinite}
        .memory-trigger:hover{transform:translateY(-1px) scale(1.025)!important}
        .memory-trigger:active{transform:scale(.95)!important}
        .memory-trigger.is-open{transform:translateY(-1px) scale(1.055)!important;filter:saturate(1.12) brightness(1.06)}
        .memory-trigger.is-open .v4-folder-icon{transform:translateY(-.5px) scale(1.05);filter:drop-shadow(0 0 10px rgba(var(--accent-b),.42))}
        .memory-trigger.is-open .v4-folder-tab{transform:translateY(-1.2px) rotate(-2deg)}
        .memory-trigger.is-open .v4-folder-line{transform:scaleX(.88)}
        .memory-trigger.is-open .v4-trigger-rings i:nth-child(1){animation:v4RingFloat 1.85s ease-out infinite}
        .memory-trigger.is-open .v4-trigger-rings i:nth-child(2){animation:v4RingFloat 1.85s .34s ease-out infinite}

        .memory-panel{
          right:0!important;
          transform-origin:var(--tail-center) calc(100% - 1px)!important;
          transform:translateX(var(--panel-x)) translateY(8px) scale(calc(var(--panel-scale) * .94))!important;
        }
        .memory-panel.is-open{
          transform:translateX(var(--panel-x)) translateY(0) scale(var(--panel-scale))!important;
        }
        .panel-pointer,.panel-surface{display:none!important}

        .v4-bubble-wrap{position:relative;isolation:isolate;padding-bottom:18px}
        .v4-bubble-defs{position:absolute;width:0;height:0;overflow:hidden}
        .v4-bubble-glass,.v4-bubble-outline{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
        .v4-bubble-glass{
          z-index:1;clip-path:url(#v4MemoryBubbleClip);-webkit-clip-path:url(#v4MemoryBubbleClip);
          background:radial-gradient(circle at 10% 4%,rgba(var(--accent-a),calc(var(--panel-glow) * .34)),transparent 35%),radial-gradient(circle at 95% 92%,rgba(var(--accent-c),calc(var(--panel-glow) * .25)),rgba(var(--accent-b),calc(var(--panel-glow) * .10)) 42%,transparent 72%),linear-gradient(155deg,rgba(255,255,255,.15),rgba(11,19,45,.86) 20%,rgba(29,22,60,.89) 58%,rgba(18,31,66,.90));
          backdrop-filter:blur(var(--panel-blur)) saturate(1.24);-webkit-backdrop-filter:blur(var(--panel-blur)) saturate(1.24)
        }
        .v4-bubble-outline{z-index:2;overflow:visible}
        .v4-bubble-outline path{vector-effect:non-scaling-stroke}
        .v4-bubble-content{position:relative;z-index:5;padding:12px 12px 0}
        .v4-bubble-sheen{position:absolute;inset:0;z-index:4;clip-path:url(#v4MemoryBubbleClip);-webkit-clip-path:url(#v4MemoryBubbleClip);overflow:hidden;pointer-events:none}
        .v4-bubble-sheen::before{content:"";position:absolute;left:-72px;top:-52%;width:86px;height:220%;transform:rotate(16deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);opacity:.74}
        .memory-panel.is-open .v4-bubble-sheen::before{animation:v4SheenMove 1.12s .10s ease-out 1}
        .v4-anchor-glow{position:absolute;left:var(--tail-center);bottom:-4px;width:74px;height:34px;z-index:0;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse at center,rgba(var(--accent-b),.30),rgba(var(--accent-c),.10) 46%,transparent 72%);filter:blur(13px);opacity:calc(var(--panel-glow) * .70);pointer-events:none}

        @keyframes v4TriggerAurora{to{transform:rotate(360deg)}}
        @keyframes v4TriggerHalo{from{transform:scale(.90);opacity:.38}to{transform:scale(1.12);opacity:.72}}
        @keyframes v4TriggerSweep{0%,20%{left:-26px}62%,100%{left:56px}}
        @keyframes v4RingFloat{0%{opacity:.42;transform:scale(.96)}100%{opacity:0;transform:scale(1.38)}}
        @keyframes v4ParticleA{50%{transform:translate(2px,-2px) scale(1.2);opacity:.92}}
        @keyframes v4ParticleB{50%{transform:translate(-2px,2px) scale(.84);opacity:.82}}
        @keyframes v4FolderSpark{50%{opacity:.92;transform:translateY(-.7px) scale(1.16)}}
        @keyframes v4SheenMove{to{left:310px}}
      `;
      d.head.appendChild(style);

      const trigger = d.getElementById('memoryTrigger');
      const panel = d.getElementById('memoryPanel');
      const oldSurface = d.querySelector('.panel-surface');
      if (!trigger || !panel || !oldSurface) return;

      trigger.innerHTML = `
        <span class="v4-trigger-halo"></span>
        <span class="v4-trigger-aurora"></span>
        <span class="v4-trigger-sheen"></span>
        <span class="v4-trigger-rings"><i></i><i></i></span>
        <span class="v4-trigger-particles"><i></i><i></i><i></i></span>
        <svg class="v4-folder-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <defs><linearGradient id="v4FolderGradient" x1="3" y1="5" x2="20" y2="20" gradientUnits="userSpaceOnUse"><stop stop-color="#DEFFFB"/><stop offset=".45" stop-color="#B990FF"/><stop offset="1" stop-color="#FFA1D1"/></linearGradient></defs>
          <path class="v4-folder-tab" d="M3.5 7.1c0-1.1.9-2 2-2h4.1l1.7 2h7.2c1.1 0 2 .9 2 2v1H3.5v-3Z" fill="url(#v4FolderGradient)" opacity=".72"/>
          <path class="v4-folder-body" d="M3.5 9.3h17v7.4c0 1.2-1 2.2-2.2 2.2H5.7c-1.2 0-2.2-1-2.2-2.2V9.3Z" fill="url(#v4FolderGradient)"/>
          <path class="v4-folder-line" d="M7 13h10" stroke="white" stroke-opacity=".64" stroke-width="1.2" stroke-linecap="round"/>
          <circle class="v4-folder-spark" cx="18.1" cy="6" r="1" fill="#F7FFFF"/>
        </svg>`;

      const contentNodes = [...oldSurface.children].filter(node => !node.classList.contains('panel-sheen'));
      const wrap = d.createElement('div');
      wrap.className = 'v4-bubble-wrap';
      wrap.innerHTML = `
        <svg class="v4-bubble-defs" aria-hidden="true"><defs><clipPath id="v4MemoryBubbleClip" clipPathUnits="userSpaceOnUse"><path id="v4BubbleClipPath"></path></clipPath></defs></svg>
        <div class="v4-anchor-glow"></div>
        <div class="v4-bubble-glass"></div>
        <svg class="v4-bubble-outline" id="v4BubbleOutline" aria-hidden="true">
          <defs>
            <linearGradient id="v4BubbleStroke" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9FFFF" stop-opacity=".32"/><stop offset=".34" stop-color="#8DFFF4" stop-opacity=".12"/><stop offset=".70" stop-color="#B58DFF" stop-opacity=".20"/><stop offset="1" stop-color="#FF9CCD" stop-opacity=".15"/></linearGradient>
            <linearGradient id="v4BubbleHighlight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".25"/><stop offset=".16" stop-color="#FFFFFF" stop-opacity=".04"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
          </defs>
          <path id="v4BubbleOutlinePath" fill="none" stroke="url(#v4BubbleStroke)" stroke-width="1.05"></path>
          <path id="v4BubbleHighlightPath" fill="none" stroke="url(#v4BubbleHighlight)" stroke-width=".72"></path>
        </svg>
        <div class="v4-bubble-sheen"></div>
        <div class="v4-bubble-content" id="v4BubbleContent"></div>`;

      const content = wrap.querySelector('#v4BubbleContent');
      contentNodes.forEach(node => content.appendChild(node));
      panel.innerHTML = '';
      panel.appendChild(wrap);

      const xInput = d.getElementById('panelX');
      if (xInput) {
        xInput.min = '-60';
        xInput.max = '180';
        xInput.value = '46';
        const label = d.querySelector('label[for="panelX"]');
        if (label) label.textContent = '向右偏移';
        xInput.dispatchEvent(new w.Event('input', { bubbles: true }));
      }

      const clipPath = wrap.querySelector('#v4BubbleClipPath');
      const outline = wrap.querySelector('#v4BubbleOutline');
      const outlinePath = wrap.querySelector('#v4BubbleOutlinePath');
      const highlightPath = wrap.querySelector('#v4BubbleHighlightPath');

      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
      const makePath = (width, height, radius, tailCenter, tailWidth = 34, tailHeight = 18) => {
        const bodyBottom = height - tailHeight;
        const r = Math.min(radius, width * .18, bodyBottom * .22);
        const tc = clamp(tailCenter, r + tailWidth * .58, width - r - tailWidth * .58);
        const half = tailWidth / 2;
        const tipY = height - 1;
        const innerY = bodyBottom + tailHeight * .42;
        const tipShoulderY = bodyBottom + tailHeight * .84;
        return [
          `M ${r} 0`,`H ${width-r}`,`Q ${width} 0 ${width} ${r}`,
          `V ${bodyBottom-r}`,`Q ${width} ${bodyBottom} ${width-r} ${bodyBottom}`,
          `H ${tc+half}`,
          `C ${tc+half*.70} ${bodyBottom} ${tc+half*.48} ${innerY} ${tc+half*.16} ${tipShoulderY}`,
          `C ${tc+half*.08} ${tipY} ${tc-half*.08} ${tipY} ${tc-half*.16} ${tipShoulderY}`,
          `C ${tc-half*.48} ${innerY} ${tc-half*.70} ${bodyBottom} ${tc-half} ${bodyBottom}`,
          `H ${r}`,`Q 0 ${bodyBottom} 0 ${bodyBottom-r}`,`V ${r}`,`Q 0 0 ${r} 0`,'Z'
        ].join(' ');
      };

      const updateGeometry = () => {
        w.requestAnimationFrame(() => {
          const rootStyle = w.getComputedStyle(d.documentElement);
          const panelX = parseFloat(rootStyle.getPropertyValue('--panel-x')) || 0;
          const radius = parseFloat(rootStyle.getPropertyValue('--panel-radius')) || 25;
          const width = wrap.clientWidth || 256;
          const contentHeight = content.offsetHeight;
          const tailHeight = 18;
          const height = contentHeight + tailHeight;
          wrap.style.height = `${height}px`;
          const tailCenter = width - 21 - panelX;
          const path = makePath(width, height, radius, tailCenter, 34, tailHeight);
          panel.style.setProperty('--tail-center', `${clamp(tailCenter, 42, width-42)}px`);
          panel.style.transformOrigin = `${clamp(tailCenter, 42, width-42)}px calc(100% - 1px)`;
          clipPath.setAttribute('d', path);
          outline.setAttribute('viewBox', `0 0 ${width} ${height}`);
          outlinePath.setAttribute('d', path);
          highlightPath.setAttribute('d', path);
        });
      };

      ['panelX','panelWidth','panelRadius','panelScale'].forEach(id => {
        const input = d.getElementById(id);
        input?.addEventListener('input', updateGeometry);
      });
      new w.ResizeObserver(updateGeometry).observe(content);
      w.addEventListener('resize', updateGeometry);
      updateGeometry();
      setTimeout(updateGeometry, 500);
    });
  </script>
</body>
</html>
