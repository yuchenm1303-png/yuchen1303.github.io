<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Current New OpenGL Glass Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#061225;color:white;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{display:grid;grid-template-columns:1fr 380px;gap:16px;padding:16px;min-height:100vh}.stage{position:relative;height:calc(100vh - 32px);min-height:620px;border-radius:30px;overflow:hidden;border:1px solid rgba(255,255,255,.14);background:#071226}#bg,#gl{position:absolute;inset:0;width:100%;height:100%;display:block}.glass{position:absolute;left:7%;right:7%;top:50%;transform:translateY(-50%);height:250px;border-radius:46px;overflow:hidden;filter:drop-shadow(0 24px 42px rgba(0,0,0,.38))}.ui{position:absolute;inset:0;padding:28px 36px;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}.ui h1{margin:0;font-size:54px;letter-spacing:-.055em;text-shadow:0 1px 20px rgba(0,0,0,.28)}.ui p{margin:5px 0 0;color:rgba(255,255,255,.62);font-weight:900;font-size:12px}.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.86)}.badge{position:absolute;left:16px;top:16px;padding:8px 11px;border-radius:999px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.12);font-size:12px;font-weight:900;color:rgba(255,255,255,.78)}.panel{border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:14px;background:rgba(14,22,50,.82);height:calc(100vh - 32px);overflow:auto;backdrop-filter:blur(18px)}h2{margin:4px 0 4px;font-size:20px}.tip{font-size:12px;color:rgba(255,255,255,.58);line-height:1.5;margin:0 0 10px}.btn{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:white;border-radius:99px;padding:8px 11px;font-weight:900;margin:0 6px 8px 0;cursor:pointer}.group{margin:12px 0;padding:10px;border-radius:18px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07)}.groupTitle{margin:0 0 8px;color:rgba(255,255,255,.78);font-size:12px;font-weight:950;letter-spacing:.05em}.c{padding:8px 0;border-top:1px solid rgba(255,255,255,.07)}.c:first-of-type{border-top:0}.h{display:flex;justify-content:space-between;gap:10px;color:rgba(255,255,255,.82);font-size:12px;font-weight:850}.h span:last-child{color:rgba(255,255,255,.58);font-variant-numeric:tabular-nums}input{width:100%;accent-color:#9b7cff}textarea{width:100%;height:150px;border-radius:16px;background:rgba(0,0,0,.25);color:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.12);padding:10px;font-size:11px}@media(max-width:980px){.app{grid-template-columns:1fr}.stage{height:68vh}.panel{height:auto}.ui h1{font-size:42px}}
</style>
</head>
<body>
<div class="app"><div class="stage" id="stage"><canvas id="bg"></canvas><div class="badge">Current New OpenGL · blurred backdrop texture + legacy rim-only</div><div class="glass" id="glass"><canvas id="gl"></canvas><div class="ui"><div><h1>Display</h1><p>背景先模糊成纹理；玻璃只折射这张模糊层；旧版厚边 rim-only 默认开启</p></div><div class="bar"></div></div></div></div><aside class="panel"><h2>新版 OpenGL 网页参数实验室</h2><p class="tip">当前预览对应 App 最新结构：不叠完整旧版 OpenGL；新版坏边缘默认关闭；旧版边缘厚折射作为 rim-only 并入新版 shader。背景模糊半径控制背景纹理生成，不控制玻璃本身。</p><button class="btn" onclick="preset('current')">当前 App 默认</button><button class="btn" onclick="preset('legacyStrong')">旧边更强</button><button class="btn" onclick="preset('soft')">柔和厚边</button><button class="btn" onclick="copyParams()">复制参数</button><div id="controls"></div><textarea id="out" spellcheck="false"></textarea></aside></div>
<script>
const stage=document.getElementById('stage'),bg=document.getElementById('bg'),glass=document.getElementById('glass'),glc=document.getElementById('gl'),out=document.getElementById('out');
const bctx=bg.getContext('2d');const off=document.createElement('canvas'),octx=off.getContext('2d');const blur=document.createElement('canvas'),blctx=blur.getContext('2d');let gl,prog,tex,buf;
const P={bgBlur:24,bgBrightness:1,bgContrast:1.08,bgSaturation:1.08,bgCloud:1.18,bgMode:0,openGlMaxAlpha:1,clarity:1,glassIntensity:.92,brightness:1,bodyWidth:1.31,bodyCurve:2.23,bodyGain:509,bodyBandPos:.77,bodyBandWidth:.24,bodyBandGain:0,outerRimWidthPx:2.2,outerRimCompression:3,outerRimReachPx:0,outerRimGain:0,innerWallOffsetPx:18,innerWallWidthPx:2,innerWallGain:0,innerWallFalloff:2.38,innerWallReachPx:0,darkExtract:0,edgeShoulderWidthPx:18,edgeTangentSmear:0,ringWidthDp:18,edgePullDp:-360,openGlPullScale:110,edgeBrightness:1.70,openGlDarkScale:2.20};
const groups=[['背景模糊层 Backdrop Texture',[['bgBlur','背景模糊半径',0,128,1],['bgBrightness','背景亮度',.4,2.2,.01],['bgContrast','背景对比',.5,1.8,.01],['bgSaturation','背景饱和',.3,1.8,.01],['bgCloud','云雾强度',.25,2.2,.01],['bgMode','背景测试图',0,2,1]]],['OpenGL 可见性',[['openGlMaxAlpha','OpenGL最大透明',0,1,.01],['clarity','折射清晰度',0,1.6,.01],['glassIntensity','玻璃强度',.35,1.35,.01],['brightness','玻璃输出亮度',.4,2.2,.01]]],['旧版 rim-only 厚边 Legacy Rim',[['ringWidthDp','旧边框宽度',0,96,1],['edgePullDp','旧边框拉力',-600,600,1],['openGlPullScale','旧主体折射',-300,300,1],['edgeBrightness','旧边框亮度',-5,5,.01],['openGlDarkScale','旧暗边强度',-10,10,.01]]],['主体折射 Body Field',[['bodyWidth','主体宽度',.18,1.5,.01],['bodyCurve','主体陡度',.2,3.2,.01],['bodyGain','主体强度',0,900,1]]],['主体折射带 Body Band',[['bodyBandPos','折射带位置',.55,.98,.01],['bodyBandWidth','折射带宽度',.015,.24,.005],['bodyBandGain','折射带强度',0,1500,1]]],['新版坏边缘 Outer / Inner Debug',[['outerRimWidthPx','外压缩区厚度',.6,14,.1],['outerRimCompression','外压缩强度',.25,3,.01],['outerRimReachPx','外压缩采样',0,32,.5],['outerRimGain','外压缩显现',0,2.5,.01],['innerWallOffsetPx','内墙起点',1,18,.2],['innerWallWidthPx','内墙宽度',2,34,.2],['innerWallGain','内墙强度',0,420,1],['innerWallReachPx','内墙采样',0,42,.5],['darkExtract','黑色抽取',0,1.6,.01],['edgeTangentSmear','切向拖色',0,160,1]]]];
function buildControls(){const root=document.getElementById('controls');root.innerHTML='';for(const [title,items] of groups){const g=document.createElement('div');g.className='group';g.innerHTML='<div class="groupTitle">'+title+'</div>';for(const [key,label,min,max,step] of items){const c=document.createElement('div');c.className='c';c.innerHTML='<div class="h"><span>'+label+'</span><span id="v_'+key+'"></span></div><input id="'+key+'" type="range" min="'+min+'" max="'+max+'" step="'+step+'" value="'+P[key]+'">';g.appendChild(c)}root.appendChild(g)}for(const [_,items] of groups)for(const [key] of items){const el=document.getElementById(key);el.oninput=()=>{P[key]=parseFloat(el.value);renderAll()}}syncValues()}
function syncValues(){for(const [_,items] of groups)for(const [key] of items){const v=document.getElementById('v_'+key);if(v)v.textContent=Number(P[key]).toFixed(Math.abs(P[key])>=100?0:2)}out.value=JSON.stringify(P,null,2)}
function preset(name){if(name==='current')Object.assign(P,{bgBlur:24,bgBrightness:1,bgContrast:1.08,bgSaturation:1.08,bgCloud:1.18,openGlMaxAlpha:1,clarity:1,glassIntensity:.92,brightness:1,bodyWidth:1.31,bodyCurve:2.23,bodyGain:509,bodyBandPos:.77,bodyBandWidth:.24,bodyBandGain:0,outerRimReachPx:0,outerRimGain:0,innerWallGain:0,innerWallReachPx:0,darkExtract:0,edgeTangentSmear:0,ringWidthDp:18,edgePullDp:-360,openGlPullScale:110,edgeBrightness:1.70,openGlDarkScale:2.20});if(name==='legacyStrong')Object.assign(P,{ringWidthDp:30,edgePullDp:-540,openGlPullScale:170,edgeBrightness:2.35,openGlDarkScale:3.8,bodyGain:460,clarity:1.05});if(name==='soft')Object.assign(P,{ringWidthDp:15,edgePullDp:-245,openGlPullScale:70,edgeBrightness:1.35,openGlDarkScale:1.4,bodyGain:380,clarity:.86});for(const [_,items] of groups)for(const [key] of items){const el=document.getElementById(key);if(el)el.value=P[key]}renderAll()}
function copyParams(){navigator.clipboard&&navigator.clipboard.writeText(out.value)}
function drawBase(ctx,w,h){ctx.clearRect(0,0,w,h);const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#061426');g.addColorStop(.32,'#27395f');g.addColorStop(.62,'#64769a');g.addColorStop(.82,'#9b7d82');g.addColorStop(1,'#c38b62');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);function glow(x,y,r,c,a){const gr=ctx.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,c.replace('A',a));gr.addColorStop(.45,c.replace('A',a*.36));gr.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}glow(w*.8,h*.12,w*.48,'rgba(170,140,255,A)',.38);glow(w*.32,h*.78,w*.58,'rgba(255,165,96,A)',.30);glow(w*.22,h*.44,w*.38,'rgba(90,175,235,A)',.20);ctx.save();ctx.globalAlpha=.75;ctx.fillStyle='rgba(255,240,205,.92)';ctx.beginPath();ctx.arc(w*.73,h*.23,Math.min(w,h)*.055,0,7);ctx.fill();ctx.globalAlpha=.28;ctx.beginPath();ctx.arc(w*.73,h*.23,Math.min(w,h)*.12,0,7);ctx.fill();ctx.restore();ctx.save();ctx.globalAlpha=.16*P.bgCloud;ctx.fillStyle='white';for(let i=0;i<12;i++){const y=h*(.16+i*.065),x=w*((i*97%360)/360);ctx.beginPath();ctx.ellipse(x,y,w*(.16+.03*(i%3)),h*.025,0,0,7);ctx.fill()}ctx.restore();if(P.bgMode===1){ctx.fillStyle='rgba(255,255,255,.12)';for(let x=0;x<w;x+=38)ctx.fillRect(x,0,1,h);for(let y=0;y<h;y+=38)ctx.fillRect(0,y,w,1)}if(P.bgMode===2){for(let x=-w;x<w*2;x+=80){ctx.fillStyle=(x/80)%2?'rgba(255,255,255,.14)':'rgba(0,0,0,.14)';ctx.save();ctx.translate(x,0);ctx.rotate(-.35);ctx.fillRect(0,-h,36,h*3);ctx.restore()}}ctx.fillStyle='rgba(255,255,255,.22)';ctx.font='900 '+Math.max(24,w*.04)+'px system-ui';ctx.fillText('BACKGROUND LAYER',w*.08,h*.42);ctx.fillText('MOON / GRID / CLOUDS',w*.08,h*.50)}
function makeBlurred(){const w=off.width,h=off.height;drawBase(octx,w,h);blctx.save();blctx.clearRect(0,0,w,h);blctx.filter='blur('+P.bgBlur+'px) brightness('+P.bgBrightness+') contrast('+P.bgContrast+') saturate('+P.bgSaturation+')';blctx.drawImage(off,0,0);blctx.restore();bctx.clearRect(0,0,bg.width,bg.height);bctx.drawImage(blur,0,0,bg.width,bg.height)}
function resize(){const d=Math.min(devicePixelRatio||1,2);for(const c of [bg,off,blur]){c.width=Math.round(stage.clientWidth*d);c.height=Math.round(stage.clientHeight*d)}makeBlurred();const r=glass.getBoundingClientRect();glc.width=Math.round(r.width*d);glc.height=Math.round(r.height*d);initGL();renderAll()}
const vs='attribute vec2 a;varying vec2 v;void main(){v=a*.5+.5;gl_Position=vec4(a,0.,1.);}';
const fs='precision highp float;varying vec2 v;uniform sampler2D t;uniform vec2 res,root,origin;uniform vec4 mat,body,band,outerR,innerW,edgeP,legacy,legacy2;uniform float radius;float sat(float x){return clamp(x,0.,1.);}float me(vec2 u){return min(min(u.x,1.-u.x),min(u.y,1.-u.y));}float gauss(float x,float m,float w){float q=(x-m)/max(w,.0001);return exp(-q*q);}float boxSdf(vec2 c,vec2 z,float r){vec2 p=c-z*.5;vec2 q=abs(p)-max(z*.5-vec2(r),vec2(0.));return length(max(q,0.))+min(max(q.x,q.y),0.)-r;}float rhoAt(vec2 c,vec2 z){vec2 u=clamp(c/z,0.,1.);vec2 q=abs(u*2.-1.);float n=5.8;return pow(pow(q.x,n)+pow(q.y,n),1./n);}vec3 src(vec2 u){return texture2D(t,clamp(u,0.,1.)).rgb;}vec2 guv(vec2 c){return clamp((origin+c)/root,0.,1.);}float hAt(vec2 c,vec2 z){float sd=boxSdf(c,z,radius);float shape=1.-smoothstep(0.,4.,sd);float rho=rhoAt(c,z);float b=pow(sat(1.-rho),max(body.y,.2));b=pow(b,max(.28,2.-body.y*.55));b*=mix(1.,1.9,sat(body.x*.75));float sh=gauss(rho,band.x,band.y);return (pow(sat(b),.72)+sh*1.55)*shape;}vec2 limit(vec2 f,float l){float n=length(f);return f*(n/(1.+n/max(l,1.))/max(n,.0001));}void main(){vec2 z=res;vec2 c=vec2(gl_FragCoord.x,res.y-gl_FragCoord.y);float sd=boxSdf(c,z,radius);float mask=1.-smoothstep(0.,1.4,sd);if(mask<=.001)discard;vec2 u=c/z;float rho=rhoAt(c,z);float st=2.;float hL=hAt(c-vec2(st,0.),z),hR=hAt(c+vec2(st,0.),z),hU=hAt(c-vec2(0.,st),z),hD=hAt(c+vec2(0.,st),z),hC=hAt(c,z);vec2 grad=vec2(hR-hL,hD-hU)*.5;float slope=length(grad);float fade=smoothstep(.01,.085,me(u));float bodyP=sat(pow(sat(1.-rho),.42)*(.48+body.x*.62));float shell=gauss(rho,band.x,band.y)+gauss(rho,band.x-.028,band.y*1.9)*.55;float side=abs(u.x*2.-1.);float sideV=smoothstep(.055,.30,u.y)*smoothstep(.055,.30,1.-u.y);float sideBand=(gauss(side,band.x,max(band.y*.72,.014))+gauss(side,band.x-.06,max(band.y*1.65,.026))*.52)*sideV*sat(.42+bodyP*.38+shell*.40);float shellP=max(shell,sideBand*.96);float energy=pow(sat((slope*11.+hC*.22)*max(band.z,1.)),max(.32,max(band.z,1.)*.55));float bodyPx=body.z*bodyP*(.35+hC*.55+energy*.35);float shellPx=band.z*shellP*(.36+energy*.70+slope*2.4);vec2 flow=grad*(bodyPx+shellPx);flow.x*=mix(1.,1.72,sideBand);flow+=(vec2(.5)-u)*vec2(1.,.72)*bodyP*body.z*.08;flow+=vec2(sign(.5-u.x),0.)*(band.z*.185+body.z*.105)*sideBand*(.72+hC*.42+bodyP*.25);float inset=max(-sd,0.);float sdl=boxSdf(c-vec2(st,0.),z,radius),sdr=boxSdf(c+vec2(st,0.),z,radius),sdu=boxSdf(c-vec2(0.,st),z,radius),sdd=boxSdf(c+vec2(0.,st),z,radius);vec2 sg=vec2(sdr-sdl,sdd-sdu)*.5;vec2 n=sg/max(length(sg),.0001);vec2 ep=n/root;float ow=max(outerR.x,.35),outer=sat(1.-inset/ow)*smoothstep(ow+1.2,0.,inset);outer=pow(outer,max(.32,1./max(outerR.y,.25)));float oc=gauss(inset,ow*.42,max(ow*.32,.55));float outerRim=sat(outer*.82+oc*.88);float wall=smoothstep(innerW.x-.9,innerW.x+.45,inset)*(1.-smoothstep(innerW.x+innerW.y,innerW.x+innerW.y+2.4,inset))*pow(1.-sat((inset-innerW.x)/max(innerW.y,.001)),max(innerW.w,.25));float shoulder=pow(sat(1.-inset/max(edgeP.z,1.)),2.)*(1.-sat(wall*.55));float edgeProf=sat(outerRim+wall+shoulder*.16);float lw=max(legacy.x,0.),lp=legacy.y,lb=legacy.z,ld=legacy.w,lbp=legacy2.x;float lr=lw>.1?smoothstep(lw+1.6,0.,inset):0.;float lc=lw>.1?pow(sat(1.-inset/max(lw*.32,1.)),2.2):0.;float li=lw>.1?gauss(inset,lw*.76,max(lw*.38,1.5)):0.;float bottom=smoothstep(.5,1.,u.y);flow+=n*outerRim*outerR.w*(34.+outerR.z*2.6+ow*4.5);flow+=n*innerW.z*(wall*(1.+slope*.22)+shoulder*.12);flow+=n*(lr*lp*.22+lc*lp*.34);flow+=grad*(lbp*.018*lr);flow=limit(flow,min(1120.,max(me(u)*min(z.x,z.y)*.92,12.)+bodyP*150.+shellP*175.+sideBand*420.+edgeProf*620.+lr*520.))*fade;vec2 ru=guv(c)+flow/root;vec3 col=src(ru);vec3 near=src(ru+ep*(.8+lw*.04)),deep=src(ru-ep*(lw*1.85+abs(lp)*.03)),far=src(ru-ep*(lw*3.2+abs(lp)*.045));vec3 legacySample=mix(mix(near,deep,.58),far,sat(lc+.24));float lm=sat((lr*.42+lc*.72+li*.34)*(.55+abs(lp)/360.));col=mix(col,legacySample,lm);float dark=(li*abs(ld)*.095+bottom*lr*max(ld,0.)*.035);col=mix(col,min(near,deep),sat(dark)*.58);col*=1.-sat(dark)*.13;float lift=(lc*.46+lr*.12)*(.22+abs(dot(near-far,vec3(.299,.587,.114)))*1.1)*max(lb,0.);col+=vec3(.02,.03,.04)*lift;col*=1.+lift*.18;col*=mat.w;gl_FragColor=vec4(clamp(col,0.,1.),mask*mat.x*mat.y);}';
function compile(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(s);return s}
function initGL(){gl=glc.getContext('webgl',{alpha:true,premultipliedAlpha:false});if(!gl)return;prog=gl.createProgram();gl.attachShader(prog,compile(gl.VERTEX_SHADER,vs));gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,fs));gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw gl.getProgramInfoLog(prog);buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE)}
function renderGL(){if(!gl)return;const d=Math.min(devicePixelRatio||1,2);gl.viewport(0,0,glc.width,glc.height);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);gl.useProgram(prog);const loc=n=>gl.getUniformLocation(prog,n);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,blur);gl.uniform1i(loc('t'),0);const st=stage.getBoundingClientRect(),gr=glass.getBoundingClientRect();gl.uniform2f(loc('res'),glc.width,glc.height);gl.uniform2f(loc('root'),bg.width,bg.height);gl.uniform2f(loc('origin'),(gr.left-st.left)*d,(gr.top-st.top)*d);gl.uniform1f(loc('radius'),46*d);gl.uniform4f(loc('mat'),P.openGlMaxAlpha,P.glassIntensity,P.clarity,P.brightness);gl.uniform4f(loc('body'),P.bodyWidth,P.bodyCurve,P.bodyGain,0);gl.uniform4f(loc('band'),P.bodyBandPos,P.bodyBandWidth,P.bodyBandGain,0);gl.uniform4f(loc('outerR'),P.outerRimWidthPx*d,P.outerRimCompression,P.outerRimReachPx*d,P.outerRimGain);gl.uniform4f(loc('innerW'),P.innerWallOffsetPx*d,P.innerWallWidthPx*d,P.innerWallGain,P.innerWallFalloff);gl.uniform4f(loc('edgeP'),P.innerWallReachPx*d,P.darkExtract,P.edgeShoulderWidthPx*d,P.edgeTangentSmear);gl.uniform4f(loc('legacy'),P.ringWidthDp*d,P.edgePullDp*d,P.edgeBrightness,P.openGlDarkScale);gl.uniform4f(loc('legacy2'),P.openGlPullScale*d,0,0,0);const a=gl.getAttribLocation(prog,'a');gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}
function renderAll(){makeBlurred();renderGL();syncValues()}window.addEventListener('resize',resize);buildControls();resize();
</script>
</body>
</html>
