function allItems(){return groups.flatMap(g=>g.items)}function build(){let root=document.getElementById('controls');root.innerHTML='';groups.forEach(group=>{let title=document.createElement('div');title.className='groupTitle';title.textContent=group.title;root.appendChild(title);group.items.forEach(([k,n,min,max])=>{let d=document.createElement('div');d.className='c';d.innerHTML=`<div class="h"><strong>${n}</strong><small id="v-${k}"></small></div><input id="i-${k}" type="range" min="${min}" max="${max}" step="any" value="${p[k]}">`;root.appendChild(d);d.querySelector('input').oninput=e=>{p[k]=parseFloat(e.target.value);drawBg();update();render()}})});update()}function preset(name){p={...APP_RAW};if(name==='strong'){p.ringWidthDp=30;p.edgePullDp=-540;p.openGlPullScale=170;p.edgeBrightness=2.35;p.openGlDarkScale=3.8;p.openGlCompressionScale=4;p.openGlSampleRadiusScale=18}update();drawBg();render()}function toggleBlurMoon(){blurMoonVisible=!blurMoonVisible;moonBtn.textContent=blurMoonVisible?'隐藏模糊层月亮':'显示模糊层月亮';moonBtn.classList.toggle('on',blurMoonVisible);drawBg();render();update()}function fmt(v){return(Math.round(v*1000)/1000).toString()}function update(){allItems().forEach(([k])=>{let v=document.getElementById('v-'+k),i=document.getElementById('i-'+k);if(v)v.textContent=fmt(p[k]);if(i&&Math.abs(parseFloat(i.value)-p[k])>1e-9)i.value=p[k]});out.textContent=JSON.stringify(Object.assign({blurMoonVisible},p),null,2)}window.onresize=resize;scroll.onscroll=render;build();setTimeout(()=>{resize();scroll.scrollTop=500;render()},0);
</script>
