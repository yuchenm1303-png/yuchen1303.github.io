ness));d[i+2]=Math.max(0,Math.min(255,((b-128)*p.contrast+128)*p.brightness))}return img}function boxBlurInt(img,rad,iters){rad=Math.max(0,Math.round(rad));iters=Math.max(1,Math.round(iters));let w=img.width,h=img.height,src=new Uint8ClampedArray(img.data);if(rad<=0)return new ImageData(src,w,h);let tmp=new Uint8ClampedArray(src.length),dst=new Uint8ClampedArray(src.length),win=rad*2+1;for(let it=0;it<iters;it++){for(let y=0;y<h;y++){let a=0,r=0,g=0,b=0,row=y*w*4;for(let k=-rad;k<=rad;k++){let o=row+Math.max(0,Math.min(w-1,k))*4;a+=src[o+3];r+=src[o];g+=src[o+1];b+=src[o+2]}for(let x=0;x<w;x++){let o=row+x*4;tmp[o]=r/win;tmp[o+1]=g/win;tmp[o+2]=b/win;tmp[o+3]=a/win;let rm=row+Math.max(0,Math.min(w-1,x-rad))*4,ad=row+Math.max(0,Math.min(w-1,x+rad+1))*4;r+=src[ad]-src[rm];g+=src[ad+1]-src[rm+1];b+=src[ad+2]-src[rm+2];a+=src[ad+3]-src[rm+3]}}for(let x=0;x<w;x++){let a=0,r=0,g=0,b=0;for(let k=-rad;k<=rad;k++){let o=(Math.max(0,Math.min(h-1,k))*w+x)*4;a+=tmp[o+3];r+=tmp[o];g+=tmp[o+1];b+=tmp[o+2]}for(let y=0;y<h;y++){let o=(y*w+x)*4;dst[o]=r/win;dst[o+1]=g/win;dst[o+2]=b/win;dst[o+3]=a/win;let rm=(Math.max(0,Math.min(h-1,y-rad))*w+x)*4,ad=(Math.max(0,Math.min(h-1,y+rad+1))*w+x)*4;r+=tmp[ad]-tmp[rm];g+=tmp[ad+1]-tmp[rm+1];b+=tmp[ad+2]-tmp[rm+2];a+=tmp[ad+3]-tmp[rm+3]}}src.set(dst)}return new ImageData(src,w,h)}function blend(a,b,t){let ad=a.data,bd=b.data;for(let i=0;i<ad.length;i++)ad[i]=ad[i]*(1-t)+bd[i]*t;return a}function blurRadius(img,rad,it){let r=Math.max(0,rad),r0=Math.floor(r),r1=Math.ceil(r),t=r-r0,a=boxBlurInt(img,r0,it);return t<=.0001?a:blend(a,boxBlurInt(img,r1,it),t)}function boxBlur(img,rad,iters){let it=Math.max(1,iters),i0=Math.floor(it),i1=Math.ceil(it),t=it-i0,a=blurRadius(img,rad,i0);return t<=.0001?a:blend(a,blurRadius(img,rad,i1),t)}function drawGlassBackdrop(){let d=Math.min(devicePixelRatio||1,2),a=stage.getBoundingClientRect(),b=glassEl.getBoundingClientRect(),x=(b.left-a.left)*d,y=(b.top-a.top)*d,w=b.width*d,h=b.height*d;gb.width=Math.round(w);
