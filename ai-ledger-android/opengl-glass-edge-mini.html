<style>

,178,255,.54)}button:disabled{opacity:.42;cursor:not-allowed}.modeRow{display:flex;flex-wrap:wrap;margin-top:8px}.bgStatus{display:block;margin:0 0 10px;color:rgba(255,255,255,.56);font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}pre{white-space:pre-wrap;font-size:11px;color:rgba(255,255,255,.72)}.error{color:#ffb3b3;white-space:pre-wrap;font-size:12px}@media(max-width:900px){.app{grid-template-columns:1fr}.stage{height:70vh}.panel{height:auto}.ui h1{font-size:42px}}

  <div class="stage" id="stage"><canvas id="bg"></canvas><div class="scroll" id="scroll"><div class="world"><div class="glass" id="glass"><canvas id="gb"></canvas><canvas id="gl"></canvas><div class="ui"><div><h1>Display</h1><p>v25.3 body · deep interior colors compressed into the rim</p></div><div class="bar"></div></div></div></div></div></div>
