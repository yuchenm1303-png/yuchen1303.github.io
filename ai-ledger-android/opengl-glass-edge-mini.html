<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>OpenGL Glass Edge Mini</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07122b;color:white;font-family:system-ui}.app{display:grid;grid-template-columns:1fr 330px;gap:16px;padding:16px;min-height:100vh}.stage{position:relative;height:calc(100vh - 32px);min-height:560px;border-radius:28px;overflow:hidden;border:1px solid rgba(255,255,255,.16)}#bg{position:absolute;inset:0;width:100%;height:100%;display:block}.scroll{position:absolute;inset:0;overflow-y:auto}.world{height:1500px;position:relative}.glass{position:absolute;left:7%;right:7%;top:610px;height:250px;border-radius:46px;overflow:hidden;filter:drop-shadow(0 22px 34px rgba(0,0,0,.32))}#gl{position:absolute;inset:0;width:100%;height:100%}.rim{position:absolute;inset:0;border-radius:inherit;border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 1px 1px rgba(255,255,255,.36),inset 0 -28px 42px rgba(255,160,205,.15),inset 0 24px 36px rgba(120,215,255,.12);pointer-events:none}.ui{position:absolute;inset:0;padding:28px 36px;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}.ui h1{margin:0;font-size:54px;letter-spacing:-.05em}.ui p{margin:6px 0 0;color:rgba(255,255,255,.68);font-weight:800}.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.82)}.panel{border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:14px;background:rgba(18,28,64,.76)}button{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:white;border-radius:99px;padding:8px 11px;font-weight:800;margin:0 6px 8px 0}.c{padding:10px 0;border-top:1px solid rgba(255,255,255,.08)}.c:first-child{border-top:0}.h{display:flex;justify-content:space-between;color:rgba(255,255,255,.82);font-size:13px;font-weight:800}input{width:100%;accent-color:#9b7cff}pre{white-space:pre-wrap;font-size:11px;color:rgba(255,255,255,.72)}@media(max-width:900px){.app{grid-template-columns:1fr}.stage{height:70vh}.ui h1{font-size:42px}}
</style>
</head>
<body>
<div class="app"><div class="stage" id="stage"><canvas id="bg"></canvas><div class="scroll" id="scroll"><div class="world"><div class="glass" id="glass"><canvas id="gl"></canvas><div class="rim"></div><div class="ui"><div><h1>Display</h1><p>edge refraction · no center pinhole</p></div><div class="bar"></div></div></div></div></div></div><aside class="panel"><h2>参数</h2><button onclick="preset('safe')">干净</button><button onclick="preset('strong')">强边缘</button><button onclick="preset('apple')">参考图</button><div id="controls"></div><pre id="out"></pre></aside></div>
<script>
const meta=[['surfaceWidth','曲面宽度',.05,.65,.01],['surfaceSteepness','曲面陡度',.45,2.8,.01],['refractionGainPx','折射增益',0,260,1],['slopeResponse','坡面响应',.3,1.3,.01],['lensClarity','清晰采样',0,1.6,.01],['tangentSmear','切向拖色',0,1.8,.01],['centerLensPx','中心透镜',0,90,1],['edgeDarkness','暗边厚度',0,1.8,.01],['highlightStrength','高光/光场',0,1.6,.01],['brightness','样本亮度',.55,1.8,.01]];
const presets={safe:{surfaceWidth:.18,surfaceSteepness:1.18,refractionGainPx:112,slopeResponse:.76,lensClarity:.7,tangentSmear:.22,centerLensPx:8,edgeDarkness:.34,highlightStrength:.36,brightness:1},strong:{surfaceWidth:.29,surfaceSteepness:1.0,refractionGainPx:190,slopeResponse:.58,lensClarity:1.04,tangentSmear:.48,centerLensPx:14,edgeDarkness:.52,highlightStrength:.58,brightness:1.04},apple:{surfaceWidth:.25,surfaceSteepness:1.06,refractionGainPx:166,slopeResponse:.63,lensClarity:.94,tangentSmear:.38,centerLensPx:10,edgeDarkness:.44,highlightStrength:.56,brightness:1.03}};
let p={...presets.apple};
const stage=document.getElementById('stage'),scroll=document.getElementById('scroll'),glassEl=document.getElementById('glass'),bg=document.getElementById('bg'),cv=document.getElementById('gl'),out=document.getElementById('out');
const g=cv.getContext('webgl',{alpha:true,premultipliedAlpha:false});
const vs='attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
const fs='precision highp float;uniform vec2 r;uniform vec4 A,B,C,R;uniform sampler2D T;float s(float x){return clamp(x,0.,1.);}float me(vec2 u){return min(min(u.x,1.-u.x),min(u.y,1.-u.y));}float bf(vec2 u){return smoothstep(.01,.095,me(u));}vec2 su(vec2 u){vec2 q=clamp(u,vec2(.018),vec2(.982));return mix(u,q,s(length(u-q)*18.));}vec2 bu(vec2 u){return R.xy+su(u)*R.zw;}float box(vec2 c,vec2 z,float ra){vec2 q=abs(c-z*.5)-max(z*.5-vec2(ra),vec2(0));return length(max(q,0.))+min(max(q.x,q.y),0.)-ra;}vec3 tx(vec2 u){return texture2D(T,clamp(bu(u),vec2(0),vec2(1))).rgb;}vec3 bl(vec2 u){vec2 px=vec2(1)/max(r,vec2(1));return tx(u)*.4+(tx(u+vec2(px.x*1.6,0))+tx(u-vec2(px.x*1.6,0))+tx(u+vec2(0,px.y*1.6))+tx(u-vec2(0,px.y*1.6)))*.11+(tx(u+vec2(px.x*2.3,px.y*2.3))+tx(u-vec2(px.x*2.3,px.y*2.3)))*.08;}float ep(float d,float w,float k){float i=max(-d,0.);return exp(-pow(i/max(w,1.),max(k,.35))*1.28)*(1.-smoothstep(0.,4.,d));}float h(vec2 c,vec2 z,float ra){float d=box(c,z,ra);float w=max(min(z.x,z.y),1.)*(.07+A.x*.34);float e=ep(d,w,A.y);float sh=1.-smoothstep(0.,4.,d);vec2 q=clamp(c/z,vec2(0),vec2(1))*2.-1.;q.x*=min(z.x/max(z.y,1.),2.35)*.4;float dome=pow(s(1.-length(q)*.72),1.78);return (e*.66+pow(s(e*dome),.72)*.2+dome*.1)*sh;}vec3 mat(vec2 u,float e,float b,float k){float a=sin(u.x*2.+u.y*.72)*.5+.5;float c=sin((u.x+u.y)*2.65+1.2)*.5+.5;float w=smoothstep(.14,.94,mix(a,c,.36));return (vec3(.05,.38,.92)*pow(w,2.15)+vec3(.36,.86,1.)*pow(1.-abs(w-.54)*1.85,2.)*.38+vec3(1.,.52,.72)*pow(s(u.y*.92+.06),2.1)*pow(c,1.65)*.24)*s(.12+e*.26+b*.12)*k;}vec2 lim(vec2 v,float l){float n=length(v);float m=n/(1.+n/max(l,1.));return v*(m/max(n,.0001));}void main(){vec2 c=vec2(gl_FragCoord.x,r.y-gl_FragCoord.y);vec2 z=max(r,vec2(1));float ra=min(54.,min(z.x,z.y)*.5);float d=box(c,z,ra);float m=1.-smoothstep(0.,1.4,d);if(m<=.001)discard;vec2 u=c/z;vec2 cd=u-vec2(.5);cd.x*=min(z.x/max(z.y,1.),2.35);float body=pow(s(1.-length(cd)*.74),1.68);float w=max(min(z.x,z.y),1.)*(.07+A.x*.34);float edge=ep(d,w,A.y);float inside=max(-d,0.);float eSafe=smoothstep(2.,15.,inside);float q=2.;vec2 gr=vec2(h(c+vec2(q,0),z,ra)-h(c-vec2(q,0),z,ra),h(c+vec2(0,q),z,ra)-h(c-vec2(0,q),z,ra))*.5;float sl=length(gr);vec2 gd=gr/max(sl,.0001);float se=pow(s(sl*8.8+edge*.06),max(A.w,.25));float sh=s(edge*.34+se*.72);vec2 edgeFlow=gd*(se*.66+edge*.16)*A.z*(.26+sh*.58);vec2 wideLens=-cd*body*B.z*.38;float bd=bf(u);vec2 flow=lim(edgeFlow+wideLens,min(mix(28.,82.,sh),max(me(u)*max(min(z.x,z.y),1.)*.78,4.)))*bd;vec2 ru=u+flow/max(z,vec2(1));vec3 col=mix(bl(ru),tx(ru),s((.12+sh*.58+body*.035)*B.x*.82));float mk=s(C.x*.54+B.x*.14);col=mix(col,max(col,mat(ru+gd*sh*.005,sh,body,mk)),s(mk*(.08+sh*.15+body*.05)));float sm=s((se*.44+edge*.2)*B.y*.3*eSafe*bd);if(sm>.002){vec2 t=vec2(-gd.y,gd.x);vec2 tp=t*(2.5+15.*sm)/max(z,vec2(1));vec2 np=gd*(2.+5.5*sm)/max(z,vec2(1));vec3 drag=tx(ru+tp)*.34+tx(ru-tp)*.34+bl(ru+np)*.16+bl(ru-np)*.16;col=mix(col,drag,s(sm*.17));}float rc=(1.-smoothstep(0.,7.5,abs(d)))*m;float ri=smoothstep(2.,14.,inside)*(1.-smoothstep(14.,48.,inside))*m;float tb=s(1.-u.y*1.72);float bb=s((u.y-.3)*1.72);float rim=s(C.x*.56+B.w*.32);col+=vec3(.8,.96,1.)*(rc*.24+ri*.16)*tb*rim+vec3(1.,.62,.82)*(rc*.15+ri*.1)*bb*rim+vec3(.28,.68,1.)*ri*.1*rim;col-=vec3(.04,.052,.064)*ri*B.w*.15;col*=C.y;col=clamp(col,0.,1.);gl_FragColor=vec4(col,.9*m);}';
function sh(t,src){let x=g.createShader(t);g.shaderSource(x,src);g.compileShader(x);if(!g.getShaderParameter(x,g.COMPILE_STATUS))throw g.getShaderInfoLog(x);return x}let pr=g.createProgram();g.attachShader(pr,sh(g.VERTEX_SHADER,vs));g.attachShader(pr,sh(g.FRAGMENT_SHADER,fs));g.linkProgram(pr);let L={a:g.getAttribLocation(pr,'a'),r:g.getUniformLocation(pr,'r'),A:g.getUniformLocation(pr,'A'),B:g.getUniformLocation(pr,'B'),C:g.getUniformLocation(pr,'C'),R:g.getUniformLocation(pr,'R'),T:g.getUniformLocation(pr,'T')};let buf=g.createBuffer();g.bindBuffer(g.ARRAY_BUFFER,buf);g.bufferData(g.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),g.STATIC_DRAW);let tex=g.createTexture();g.bindTexture(g.TEXTURE_2D,tex);g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MIN_FILTER,g.LINEAR);g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MAG_FILTER,g.LINEAR);g.texParameteri(g.TEXTURE_2D,g.TEXTURE_WRAP_S,g.CLAMP_TO_EDGE);g.texParameteri(g.TEXTURE_2D,g.TEXTURE_WRAP_T,g.CLAMP_TO_EDGE);
function drawBg(){let d=Math.min(devicePixelRatio||1,2),sr=stage.getBoundingClientRect(),w=Math.round(sr.width*d),h=Math.round(sr.height*d);bg.width=w;bg.height=h;let x=bg.getContext('2d'),gr=x.createLinearGradient(0,0,w,h);gr.addColorStop(0,'#0a3a80');gr.addColorStop(.42,'#4fd5ff');gr.addColorStop(.72,'#173066');gr.addColorStop(1,'#d06c9e');x.fillStyle=gr;x.fillRect(0,0,w,h);x.globalAlpha=.55;for(let i=0;i<11;i++){x.strokeStyle=i%2?'#fff':'#68e7ff';x.lineWidth=(3+i*.45)*d;x.beginPath();x.moveTo(-80*d,(130+i*60)*d);x.bezierCurveTo(260*d,(20+i*10)*d,520*d,(330-i*20)*d,1280*d,(130+i*30)*d);x.stroke()}x.globalAlpha=.25;for(let y=70*d;y<h;y+=160*d)for(let xx=70*d;xx<w;xx+=140*d){x.fillStyle='#fff';x.fillRect(xx,y,80*d,14*d)}g.bindTexture(g.TEXTURE_2D,tex);g.pixelStorei(g.UNPACK_FLIP_Y_WEBGL,false);g.texImage2D(g.TEXTURE_2D,0,g.RGBA,g.RGBA,g.UNSIGNED_BYTE,bg)}
function rect(){let a=stage.getBoundingClientRect(),b=glassEl.getBoundingClientRect();return[(b.left-a.left)/a.width,(b.top-a.top)/a.height,b.width/a.width,b.height/a.height]}function resize(){let d=Math.min(devicePixelRatio||1,2),r=glassEl.getBoundingClientRect();cv.width=Math.max(1,Math.round(r.width*d));cv.height=Math.max(1,Math.round(r.height*d));g.viewport(0,0,cv.width,cv.height);drawBg();render()}function render(){g.clearColor(0,0,0,0);g.clear(g.COLOR_BUFFER_BIT);g.useProgram(pr);g.bindBuffer(g.ARRAY_BUFFER,buf);g.enableVertexAttribArray(L.a);g.vertexAttribPointer(L.a,2,g.FLOAT,false,0,0);g.uniform2f(L.r,cv.width,cv.height);g.uniform4f(L.A,p.surfaceWidth,p.surfaceSteepness,p.refractionGainPx,p.slopeResponse);g.uniform4f(L.B,p.lensClarity,p.tangentSmear,p.centerLensPx,p.edgeDarkness);g.uniform4f(L.C,p.highlightStrength,p.brightness,0,0);let R=rect();g.uniform4f(L.R,R[0],R[1],R[2],R[3]);g.activeTexture(g.TEXTURE0);g.bindTexture(g.TEXTURE_2D,tex);g.uniform1i(L.T,0);g.drawArrays(g.TRIANGLE_STRIP,0,4)}
function build(){let root=document.getElementById('controls');root.innerHTML='';meta.forEach(([k,n,min,max,step])=>{let d=document.createElement('div');d.className='c';d.innerHTML=`<div class="h"><strong>${n}</strong><small id="v-${k}"></small></div><input id="i-${k}" type="range" min="${min}" max="${max}" step="${step}" value="${p[k]}">`;root.appendChild(d);d.querySelector('input').oninput=e=>{p[k]=parseFloat(e.target.value);update();render()}});update()}function kotlin(){return `OpenGLLiquidPotentialLabOptics(\n    surfaceWidth = ${p.surfaceWidth.toFixed(2)}f,\n    surfaceSteepness = ${p.surfaceSteepness.toFixed(2)}f,\n    refractionGainPx = ${p.refractionGainPx.toFixed(0)}f,\n    slopeResponse = ${p.slopeResponse.toFixed(2)}f,\n    lensClarity = ${p.lensClarity.toFixed(2)}f,\n    tangentSmear = ${p.tangentSmear.toFixed(2)}f,\n    centerLensPx = ${p.centerLensPx.toFixed(0)}f,\n    edgeDarkness = ${p.edgeDarkness.toFixed(2)}f,\n    highlightStrength = ${p.highlightStrength.toFixed(2)}f,\n    brightness = ${p.brightness.toFixed(2)}f\n)`}function update(){meta.forEach(([k])=>{let v=document.getElementById('v-'+k),i=document.getElementById('i-'+k);if(v)v.textContent=Math.round(p[k]*100)/100;if(i&&parseFloat(i.value)!==p[k])i.value=p[k]});out.textContent=JSON.stringify(p,null,2)+'\n\n'+kotlin()}function preset(n){p={...presets[n]};update();render()}window.onresize=resize;scroll.onscroll=render;build();setTimeout(()=>{resize();scroll.scrollTop=500;render()},0);
</script>
</body>
</html>
