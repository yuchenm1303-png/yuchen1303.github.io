<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>OpenGL V23 Thickness Rim Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07122b;color:white;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{display:grid;grid-template-columns:1fr 350px;gap:16px;padding:16px;min-height:100vh}.stage{position:relative;height:calc(100vh - 32px);min-height:560px;border-radius:28px;overflow:hidden;border:1px solid rgba(255,255,255,.16)}#bg{position:absolute;inset:0;width:100%;height:100%;display:block}.scroll{position:absolute;inset:0;overflow-y:auto}.world{height:1500px;position:relative}.glass{position:absolute;left:7%;right:7%;top:610px;height:250px;border-radius:46px;overflow:hidden;filter:drop-shadow(0 22px 34px rgba(0,0,0,.32))}#gl{position:absolute;inset:0;width:100%;height:100%}.rim{position:absolute;inset:0;border-radius:inherit;border:1px solid rgba(255,255,255,.10);box-shadow:inset 0 1px 1px rgba(255,255,255,.08);pointer-events:none}.ui{position:absolute;inset:0;padding:28px 36px;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}.ui h1{margin:0;font-size:54px;letter-spacing:-.05em;text-shadow:0 1px 18px rgba(0,0,0,.22)}.ui p{margin:6px 0 0;color:rgba(255,255,255,.70);font-weight:800}.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.86)}.panel{border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:14px;background:rgba(18,28,64,.76);height:calc(100vh - 32px);overflow:auto}button{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:white;border-radius:99px;padding:8px 11px;font-weight:800;margin:0 6px 8px 0}.groupTitle{margin:16px 0 2px;color:rgba(255,255,255,.56);font-size:12px;font-weight:900;letter-spacing:.08em}.c{padding:10px 0;border-top:1px solid rgba(255,255,255,.08)}.h{display:flex;justify-content:space-between;color:rgba(255,255,255,.82);font-size:13px;font-weight:800}input{width:100%;accent-color:#9b7cff}pre{white-space:pre-wrap;font-size:11px;color:rgba(255,255,255,.72)}@media(max-width:900px){.app{grid-template-columns:1fr}.stage{height:70vh}.panel{height:auto}.ui h1{font-size:42px}}
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <canvas id="bg"></canvas>
    <div class="scroll" id="scroll"><div class="world"><div class="glass" id="glass"><canvas id="gl"></canvas><div class="rim"></div><div class="ui"><div><h1>Display</h1><p>v23 · thickness-gradient rim / outer hairline + dark ridge + inner wall</p></div><div class="bar"></div></div></div></div></div>
  </div>
  <aside class="panel">
    <h2>v23 厚度场边缘</h2>
    <button onclick="preset('apple')">参考方向</button><button onclick="preset('soft')">柔和</button><button onclick="preset('hard')">硬边</button>
    <button onclick="bgMode='flow';resize()">流线背景</button><button onclick="bgMode='stripes';resize()">黑白条纹</button><button onclick="bgMode='grid';resize()">细网格</button>
    <div id="controls"></div><pre id="out"></pre>
  </aside>
</div>
<script>
const groups=[
{title:'主体折射 Body Field',items:[['bodyWidth','主体宽度',.18,1.5,.01],['bodyCurve','主体陡度',.20,3.2,.01],['bodyGain','主体强度',0,900,1],['bodyBandPos','主体折射带位置',.55,.98,.01],['bodyBandWidth','主体折射带宽度',.015,.24,.005],['bodyBandGain','主体折射带强度',0,1500,1]]},
{title:'外侧极薄压缩脊 Outer Hairline Lens',items:[['outerHairlineWidthPx','外侧细脊厚度 px',.5,8,.1],['outerHairlineGain','外侧细脊折射',0,4,.01],['outerHairlineReachPx','外侧细脊采样 px',0,42,.2],['outerGlowGain','外侧空气感',0,1.2,.01]]},
{title:'暗脊分隔 Dark Ridge',items:[['darkRidgeOffsetPx','暗脊位置 px',0,14,.2],['darkRidgeWidthPx','暗脊宽度 px',.6,18,.1],['darkRidgeGain','暗脊强度',0,1.6,.01]]},
{title:'内侧折射墙 Inner Wall',items:[['innerWallOffsetPx','内墙起点 px',1,32,.2],['innerWallWidthPx','内墙宽度 px',2,60,.2],['innerWallGain','内墙折射',0,520,1],['innerWallFalloff','内墙衰减',.25,5,.01],['innerWallReachPx','内墙采样 px',0,60,.2],['tangentSmear','切向拖色',0,180,1]]},
{title:'角落与高光 Corner Clamp',items:[['cornerClamp','角落能量压制',0,1,.01],['highlightGain','白色辅助高光',0,.65,.01],['brightness','整体亮度',.55,1.8,.01],['clarity','折射清晰度',0,1.4,.01]]}
];
const presets={
apple:{bodyWidth:1.31,bodyCurve:2.23,bodyGain:509,bodyBandPos:.77,bodyBandWidth:.24,bodyBandGain:0,outerHairlineWidthPx:1.6,outerHairlineGain:2.2,outerHairlineReachPx:34,outerGlowGain:.18,darkRidgeOffsetPx:3.4,darkRidgeWidthPx:5.8,darkRidgeGain:.72,innerWallOffsetPx:7.6,innerWallWidthPx:32,innerWallGain:78,innerWallFalloff:2.4,innerWallReachPx:12,tangentSmear:38,cornerClamp:.72,highlightGain:.14,brightness:1.02,clarity:1.0},
soft:{bodyWidth:1.05,bodyCurve:1.55,bodyGain:360,bodyBandPos:.80,bodyBandWidth:.18,bodyBandGain:0,outerHairlineWidthPx:2.4,outerHairlineGain:1.15,outerHairlineReachPx:20,outerGlowGain:.22,darkRidgeOffsetPx:4.8,darkRidgeWidthPx:9.2,darkRidgeGain:.42,innerWallOffsetPx:9.6,innerWallWidthPx:38,innerWallGain:52,innerWallFalloff:2.1,innerWallReachPx:9,tangentSmear:24,cornerClamp:.82,highlightGain:.10,brightness:1.0,clarity:.86},
hard:{bodyWidth:1.31,bodyCurve:2.23,bodyGain:509,bodyBandPos:.77,bodyBandWidth:.24,bodyBandGain:0,outerHairlineWidthPx:1.1,outerHairlineGain:3.0,outerHairlineReachPx:40,outerGlowGain:.08,darkRidgeOffsetPx:2.4,darkRidgeWidthPx:4.2,darkRidgeGain:.95,innerWallOffsetPx:6.2,innerWallWidthPx:26,innerWallGain:96,innerWallFalloff:3.0,innerWallReachPx:16,tangentSmear:50,cornerClamp:.88,highlightGain:.09,brightness:1.0,clarity:1.1}}
let p={...presets.apple};let bgMode='flow';
const stage=document.getElementById('stage'),scroll=document.getElementById('scroll'),glassEl=document.getElementById('glass'),bg=document.getElementById('bg'),cv=document.getElementById('gl'),out=document.getElementById('out');
const g=cv.getContext('webgl',{alpha:true,premultipliedAlpha:false});
const vs='attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
const fs=`precision highp float;uniform vec2 r;uniform vec4 R;uniform sampler2D T;uniform vec4 A,B,D,E,F,G,H;float sat(float x){return clamp(x,0.,1.);}float luma(vec3 c){return dot(c,vec3(.299,.587,.114));}float me(vec2 u){return min(min(u.x,1.-u.x),min(u.y,1.-u.y));}vec2 uvSafe(vec2 u){return clamp(u,vec2(.004),vec2(.996));}vec2 bgUv(vec2 u){return uvSafe(R.xy+uvSafe(u)*R.zw);}vec3 src(vec2 u){return texture2D(T,bgUv(u)).rgb;}float box(vec2 c,vec2 z,float ra){vec2 p=c-z*.5;vec2 q=abs(p)-max(z*.5-vec2(ra),vec2(0));return length(max(q,0.))+min(max(q.x,q.y),0.)-ra;}float rhoAt(vec2 c,vec2 z){vec2 uv=clamp(c/z,0.,1.);vec2 q=abs(uv*2.-1.);float n=5.8;return pow(pow(q.x,n)+pow(q.y,n),1./n);}float gauss(float x,float m,float w){float q=(x-m)/max(w,.001);return exp(-q*q);}float bodyAt(vec2 c,vec2 z,float ra){float sd=box(c,z,ra);float mask=1.-smoothstep(0.,4.,sd);float rho=rhoAt(c,z);float body=pow(sat(1.-rho),max(A.y,.2));body=pow(body,max(.28,2.-A.y*.55));body*=mix(1.,1.9,sat(A.x*.75));float band=gauss(rho,B.x,B.y)*B.z/600.;float shoulder=gauss(rho,B.x-.025,B.y*1.8)*.52;return (pow(sat(body),.72)+band+shoulder)*mask;}float edgeInset(vec2 c,vec2 z,float ra){return max(-box(c,z,ra),0.);}float cornerness(vec2 u){vec2 q=abs(u*2.-1.);return smoothstep(.62,1.,max(q.x,q.y))*smoothstep(.58,1.,min(q.x,q.y));}float thickAt(vec2 c,vec2 z,float ra){vec2 u=clamp(c/z,0.,1.);float e=edgeInset(c,z,ra);float body=bodyAt(c,z,ra)*.24;float outerBase=sat(1.-e/max(D.x,.2));float outer=pow(outerBase,1.8)*smoothstep(D.x+1.4,0.,e)*D.y*.34;float ridge=gauss(e,E.x,max(E.y,.4))*E.z;float ws=smoothstep(F.x-.7,F.x+.6,e);float we=1.-smoothstep(F.x+F.y,F.x+F.y+2.6,e);float wt=sat((e-F.x)/max(F.y,.1));float wall=ws*we*pow(1.-wt,F.w)*F.z/260.;float ccl=mix(1.,.45,cornerness(u)*H.x);return (body+outer+wall-ridge*.20)*ccl;}vec2 lim(vec2 v,float l){float n=length(v);float m=n/(1.+n/max(l,1.));return v*(m/max(n,.001));}void main(){vec2 c=vec2(gl_FragCoord.x,r.y-gl_FragCoord.y);vec2 z=max(r,vec2(1.));float ra=min(54.,min(z.x,z.y)*.5);float sd=box(c,z,ra);float mask=1.-smoothstep(0.,1.4,sd);if(mask<=.001)discard;vec2 u=c/z;float e=edgeInset(c,z,ra);float stepPx=2.;float hL=thickAt(c-vec2(stepPx,0),z,ra),hR=thickAt(c+vec2(stepPx,0),z,ra),hU=thickAt(c-vec2(0,stepPx),z,ra),hD=thickAt(c+vec2(0,stepPx),z,ra);vec2 grad=vec2(hR-hL,hD-hU)*.5;float sl=length(grad);vec2 edgeN=normalize(vec2(box(c+vec2(stepPx,0),z,ra)-box(c-vec2(stepPx,0),z,ra),box(c+vec2(0,stepPx),z,ra)-box(c-vec2(0,stepPx),z,ra))+vec2(.0001));vec2 edgeT=vec2(-edgeN.y,edgeN.x);float ccl=cornerness(u);float cornerClamp=mix(1.,1.-H.x*.72,ccl);float outerBase=sat(1.-e/max(D.x,.2));float outer=pow(outerBase,1.6)*smoothstep(D.x+1.4,0.,e);float crest=gauss(e,D.x*.42,max(D.x*.32,.45))*outer;float ridge=gauss(e,E.x,max(E.y,.45))*E.z;float ws=smoothstep(F.x-.7,F.x+.6,e);float we=1.-smoothstep(F.x+F.y,F.x+F.y+2.6,e);float wt=sat((e-F.x)/max(F.y,.1));float wall=ws*we*pow(1.-wt,F.w);float soft=pow(sat(1.-e/(F.x+F.y+10.)),2.2);vec2 flow=grad*(A.z*.22+B.z*.08+420.)*cornerClamp;flow+=edgeN*(outer*D.y*(32.+D.z*2.7)+crest*D.y*(36.+D.z*2.0))*cornerClamp;flow+=edgeN*wall*F.z;flow=lim(flow,820.)*smoothstep(.01,.08,me(u));vec2 ru=u+flow/max(z,vec2(1.));vec3 clear=src(ru);vec3 blur=(src(ru)+src(ru+vec2(4.)/z)+src(ru-vec2(4.)/z)+src(ru+vec2(-6.,5.)/z)+src(ru+vec2(6.,-5.)/z))/5.;vec3 col=mix(blur,clear,sat(H.w+.25*outer+.18*wall));vec3 o1=src(ru+edgeN*(.2+D.x*.12)/z);vec3 o2=src(ru-edgeN*(D.z*1.55+D.x*2.)/z);vec3 o3=src(ru-edgeN*(D.z*2.4+D.x*4.)/z);vec3 oS=mix(mix(o1,o2,.65),o3,sat(D.y*.18+crest*.38));col=mix(col,oS,sat((outer*.75+crest*.9)*D.y*.62));vec3 w1=src(ru+edgeN*(F.x*.2+D.x*.3)/z);vec3 w2=src(ru-edgeN*(G.x+F.y*.42)/z);vec3 wS=mix(w2,w1,.54+wall*.24);col=mix(col,wS,sat(wall*(.60+F.z/850.)));vec3 dark=mix(wS,min(w1,w2),.82);float darkMix=sat(ridge*(.35+(1.-min(luma(w1),luma(w2)))*.7));col=mix(col,dark,darkMix*.55);col*=1.-darkMix*.12;float smear=sat((G.w/180.)*(wall*.85+outer*.22));if(smear>.001){vec2 ep=edgeT*sign(dot(flow,edgeT)+.001)*(4.+G.w*.15+wall*8.)/z;col=mix(col,src(ru+ep)*.44+src(ru-ep)*.44+w1*.12,smear*.34);}float contrast=abs(luma(o1)-luma(o3));float white=(outer+crest*.8)*(contrast*.85+.14)*H.y*cornerClamp;col+=vec3(white);col*=H.z;gl_FragColor=vec4(clamp(col,0.,1.),.91*mask);}`;
function sh(t,s){let x=g.createShader(t);g.shaderSource(x,s);g.compileShader(x);if(!g.getShaderParameter(x,g.COMPILE_STATUS)){throw g.getShaderInfoLog(x)}return x}let pr=g.createProgram();g.attachShader(pr,sh(g.VERTEX_SHADER,vs));g.attachShader(pr,sh(g.FRAGMENT_SHADER,fs));g.linkProgram(pr);if(!g.getProgramParameter(pr,g.LINK_STATUS))throw g.getProgramInfoLog(pr);let L={a:g.getAttribLocation(pr,'a'),r:g.getUniformLocation(pr,'r'),R:g.getUniformLocation(pr,'R'),T:g.getUniformLocation(pr,'T'),A:g.getUniformLocation(pr,'A'),B:g.getUniformLocation(pr,'B'),D:g.getUniformLocation(pr,'D'),E:g.getUniformLocation(pr,'E'),F:g.getUniformLocation(pr,'F'),G:g.getUniformLocation(pr,'G'),H:g.getUniformLocation(pr,'H')};let buf=g.createBuffer();g.bindBuffer(g.ARRAY_BUFFER,buf);g.bufferData(g.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),g.STATIC_DRAW);let tex=g.createTexture();g.bindTexture(g.TEXTURE_2D,tex);g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MIN_FILTER,g.LINEAR);g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MAG_FILTER,g.LINEAR);g.texParameteri(g.TEXTURE_2D,g.TEXTURE_WRAP_S,g.CLAMP_TO_EDGE);g.texParameteri(g.TEXTURE_2D,g.TEXTURE_WRAP_T,g.CLAMP_TO_EDGE);
function drawBg(){let d=Math.min(devicePixelRatio||1,2),sr=stage.getBoundingClientRect(),w=Math.round(sr.width*d),h=Math.round(sr.height*d);bg.width=w;bg.height=h;let x=bg.getContext('2d');x.clearRect(0,0,w,h);if(bgMode==='stripes'){for(let i=-w;i<w*2;i+=42*d){x.fillStyle=(Math.floor(i/(42*d))%2)?'#07142f':'#eef6ff';x.fillRect(i,0,22*d,h);}}else if(bgMode==='grid'){let gr=x.createLinearGradient(0,0,w,h);gr.addColorStop(0,'#06133a');gr.addColorStop(.5,'#178bff');gr.addColorStop(1,'#ff8c6d');x.fillStyle=gr;x.fillRect(0,0,w,h);x.strokeStyle='rgba(255,255,255,.65)';x.lineWidth=1*d;for(let i=0;i<w;i+=30*d){x.beginPath();x.moveTo(i,0);x.lineTo(i,h);x.stroke()}for(let j=0;j<h;j+=30*d){x.beginPath();x.moveTo(0,j);x.lineTo(w,j);x.stroke()}}else{let gr=x.createLinearGradient(0,0,w,h);gr.addColorStop(0,'#0a3a80');gr.addColorStop(.42,'#4fd5ff');gr.addColorStop(.72,'#173066');gr.addColorStop(1,'#d06c9e');x.fillStyle=gr;x.fillRect(0,0,w,h);x.globalAlpha=.55;for(let i=0;i<11;i++){x.strokeStyle=i%2?'#fff':'#68e7ff';x.lineWidth=(3+i*.45)*d;x.beginPath();x.moveTo(-80*d,(130+i*60)*d);x.bezierCurveTo(260*d,(20+i*10)*d,520*d,(330-i*20)*d,1280*d,(130+i*30)*d);x.stroke()}x.globalAlpha=.25;for(let y=70*d;y<h;y+=160*d){for(let xx=70*d;xx<w;xx+=140*d){x.fillStyle='#fff';x.fillRect(xx,y,80*d,14*d)}}}g.bindTexture(g.TEXTURE_2D,tex);g.pixelStorei(g.UNPACK_FLIP_Y_WEBGL,false);g.texImage2D(g.TEXTURE_2D,0,g.RGBA,g.RGBA,g.UNSIGNED_BYTE,bg)}
function rect(){let a=stage.getBoundingClientRect(),b=glassEl.getBoundingClientRect();return[(b.left-a.left)/a.width,(b.top-a.top)/a.height,b.width/a.width,b.height/a.height]}function resize(){let d=Math.min(devicePixelRatio||1,2),r=glassEl.getBoundingClientRect();cv.width=Math.max(1,Math.round(r.width*d));cv.height=Math.max(1,Math.round(r.height*d));g.viewport(0,0,cv.width,cv.height);drawBg();render()}function render(){g.clearColor(0,0,0,0);g.clear(g.COLOR_BUFFER_BIT);g.useProgram(pr);g.bindBuffer(g.ARRAY_BUFFER,buf);g.enableVertexAttribArray(L.a);g.vertexAttribPointer(L.a,2,g.FLOAT,false,0,0);g.uniform2f(L.r,cv.width,cv.height);let q=rect();g.uniform4f(L.R,q[0],q[1],q[2],q[3]);g.uniform4f(L.A,p.bodyWidth,p.bodyCurve,p.bodyGain,0);g.uniform4f(L.B,p.bodyBandPos,p.bodyBandWidth,p.bodyBandGain,0);g.uniform4f(L.D,p.outerHairlineWidthPx,p.outerHairlineGain,p.outerHairlineReachPx,p.outerGlowGain);g.uniform4f(L.E,p.darkRidgeOffsetPx,p.darkRidgeWidthPx,p.darkRidgeGain,0);g.uniform4f(L.F,p.innerWallOffsetPx,p.innerWallWidthPx,p.innerWallGain,p.innerWallFalloff);g.uniform4f(L.G,p.innerWallReachPx,p.darkRidgeGain,p.outerGlowGain,p.tangentSmear);g.uniform4f(L.H,p.cornerClamp,p.highlightGain,p.brightness,p.clarity);g.activeTexture(g.TEXTURE0);g.bindTexture(g.TEXTURE_2D,tex);g.uniform1i(L.T,0);g.drawArrays(g.TRIANGLE_STRIP,0,4)}
function allItems(){return groups.flatMap(g=>g.items)}function build(){let root=document.getElementById('controls');root.innerHTML='';groups.forEach(group=>{let title=document.createElement('div');title.className='groupTitle';title.textContent=group.title;root.appendChild(title);group.items.forEach(([k,n,min,max,step])=>{let d=document.createElement('div');d.className='c';d.innerHTML=`<div class="h"><strong>${n}</strong><small id="v-${k}"></small></div><input id="i-${k}" type="range" min="${min}" max="${max}" step="${step}" value="${p[k]}">`;root.appendChild(d);d.querySelector('input').oninput=e=>{p[k]=parseFloat(e.target.value);update();render()}})});update()}function preset(n){p={...presets[n]};update();render()}function update(){allItems().forEach(([k])=>{let v=document.getElementById('v-'+k),i=document.getElementById('i-'+k);if(v)v.textContent=Math.round(p[k]*1000)/1000;if(i&&parseFloat(i.value)!==p[k])i.value=p[k]});out.textContent=JSON.stringify(p,null,2)}window.onresize=resize;scroll.onscroll=render;build();setTimeout(()=>{resize();scroll.scrollTop=500;render()},0);
</script>
