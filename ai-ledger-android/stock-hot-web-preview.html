<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0">
<title>AI Ledger · 实时热点榜</title>
<link rel="stylesheet" href="./stock-hot-web-preview.css?v=20260627-1">
</head>
<body>
<button class="mobile-toggle" id="mobileToggle" aria-label="打开调试面板">⚙</button>
<main class="workspace">
  <section class="phone" aria-label="股票实时热点榜手机预览">
    <div class="screen">
      <header class="status-bar">
        <div class="status-left">
          <span class="carriers">中国移动<br>中国电信</span>
          <span class="clock" id="clock">--:--</span>
          <span class="status-chip">◩</span><span class="status-chip">▣</span><span class="status-icon">⌁</span><span class="status-icon">◉</span>
        </div>
        <div class="status-right"><span>Ⓝ ⏰ ⌁ 4G▮▮▮ 4G▮▮▮</span><span class="battery">70</span></div>
      </header>

      <div class="hot-scroll" id="hotScroll">
        <div class="hot-top-row">
          <button class="glass-button back-button" id="backButton" aria-label="返回市场首页">‹</button>
          <span class="page-label">实时热点 · A股</span>
          <button class="glass-button refresh-button" id="refreshButton" aria-label="刷新热点榜">⟳</button>
        </div>

        <section class="glass hot-hero">
          <div class="hot-kicker">MARKET HEAT</div>
          <div class="hot-heading-row">
            <div class="hot-heading-copy">
              <h1 id="hotTitle">个股人气榜</h1>
              <p id="hotSubtitle">东方财富站内真实行为形成的市场关注度排行</p>
            </div>
            <button class="source-button" id="sourceButton">查看原榜 ↗</button>
          </div>
          <div class="hot-source" id="hotSource">等待真实热点数据</div>
          <div class="hot-summary" id="hotSummary"></div>
        </section>

        <section class="hot-tabs" id="hotTabs" aria-label="热点榜切换">
          <button class="hot-tab active" data-type="popularity">人气榜</button>
          <button class="hot-tab" data-type="surge">飙升榜</button>
        </section>

        <section class="glass hot-list-panel">
          <div class="hot-list-heading">
            <div>
              <h2 id="listTitle">人气榜 TOP 100</h2>
              <p id="listDescription">排名与行情独立来源，行情批量合并展示</p>
            </div>
            <span id="listUpdated">--</span>
          </div>
          <div class="hot-column-head">
            <span>排名</span><span>股票</span><span>最新价</span><span id="hotMetricHeader">热度</span>
          </div>
          <div class="hot-list" id="hotList"></div>
          <div class="hot-empty" id="hotEmpty">等待真实热点榜数据</div>
        </section>

        <div class="hot-data-status" id="dataStatus"><strong>初始化中</strong>：正在连接东方财富个股人气榜。</div>
      </div>
    </div>

    <nav class="bottom-nav" aria-label="主导航">
      <button class="nav-item"><span>AI</span><small>AI助手</small></button>
      <button class="nav-item active"><span class="nav-star">✦</span><small>功能</small></button>
      <button class="nav-item"><span>⚙</span><small>设置</small></button>
    </nav>
  </section>

  <aside class="controls" id="controls">
    <h1>实时热点榜网页调试</h1>
    <div class="version">网页版本 2026-06-27.1 · 东方财富真实热点版</div>
    <p>页面不嵌入外部股票网站，只通过后端读取真实人气榜与飙升榜，再使用本项目自己的榜单 UI 和个股详情跳转。</p>
    <div class="control-group">
      <h2>热点榜切换</h2>
      <div class="control-buttons">
        <button class="primary" data-control-type="popularity">人气榜</button>
        <button data-control-type="surge">飙升榜</button>
      </div>
      <label class="switch-row"><span>2 分钟自动刷新</span><input id="autoRefresh" type="checkbox" checked></label>
      <button class="wide-control-button" id="manualRefresh">立即刷新</button>
    </div>
    <div class="control-group">
      <h2>页面参数</h2>
      <label class="range-row"><span>手机宽度 <b id="phoneWidthText">430px</b></span><input id="phoneWidth" type="range" min="360" max="500" value="430"></label>
      <label class="range-row"><span>榜单行高 <b id="rowHeightText">60px</b></span><input id="rowHeight" type="range" min="50" max="76" value="60"></label>
    </div>
  </aside>
</main>
<script src="./stock-hot-web-preview.js?v=20260627-1"></script>
</body>
</html>
