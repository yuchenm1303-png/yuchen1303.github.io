<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Backdrop Bitmap Blur Lab</title>
  <style>
    :root {
      color-scheme: dark;
      --panel: rgba(255,255,255,.08);
      --line: rgba(255,255,255,.16);
      --text: rgba(245,250,255,.94);
      --muted: rgba(245,250,255,.66);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 25% 0%, #182940, #07101e 52%, #020711);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Segoe UI", sans-serif;
      display: grid;
      grid-template-columns: minmax(330px, 430px) minmax(330px, 430px) minmax(320px, 430px);
      gap: 18px;
      align-items: start;
      justify-content: center;
      padding: 18px;
    }
    .stage, .controls {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 14px;
      box-shadow: 0 22px 60px rgba(0,0,0,.28);
      backdrop-filter: blur(16px);
    }
    .stage h2, .controls h2 { margin: 0 0 10px; font-size: 18px; }
    .stage p, .controls p { margin: 0 0 12px; color: var(--muted); line-height: 1.45; font-size: 13px; }
    canvas {
      width: 100%;
      height: auto;
      border-radius: 22px;
      background: #061426;
      border: 1px solid rgba(255,255,255,.13);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.05), 0 16px 36px rgba(0,0,0,.24);
      display: block;
    }
    .control { margin: 13px 0; }
    label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; color: var(--text); font-size: 14px; }
    label span { color: #b9d9ff; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    input[type="range"] { width: 100%; accent-color: #9ecbff; }
    .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    button {
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.10);
      color: white;
      border-radius: 12px;
      padding: 9px 11px;
      font-weight: 700;
      cursor: pointer;
    }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: rgba(0,0,0,.30);
      border-radius: 14px;
      padding: 12px;
      color: #dcecff;
      font-size: 12px;
      line-height: 1.55;
      max-height: 360px;
      overflow: auto;
    }
    .note { color: #aee0ff; }
    @media (max-width: 1040px) {
      body { grid-template-columns: 1fr; padding: 12px; }
      .stage, .controls { max-width: 520px; width: 100%; margin: 0 auto; }
    }
  </style>
</head>
<body>
  <section class="stage">
    <h2>① 原始背景层</h2>
    <p>这张对应 Compose 里的正常背景。它保留清晰色块，用来对比。</p>
    <canvas id="source" width="420" height="910"></canvas>
  </section>

  <section class="stage">
    <h2>② 只看模糊背景缓存层</h2>
    <p class="note">这里才是我们要调的东西：Compose 里的 <b>BlurredBackdropBitmap</b>。先把这张调对，再装回玻璃卡片。</p>
    <canvas id="blurred" width="420" height="910"></canvas>
  </section>

  <aside class="controls">
    <h2>背景模糊缓存参数</h2>
    <p>这些参数对应 <code>BlurredBackdrop.kt</code>，不是玻璃卡片参数。目标：色块边缘被明显揉开，但还能隐约知道色块位置。</p>

    <div class="control"><label>缓存分辨率 scale <span id="scaleText"></span></label><input id="scale" type="range" min="10" max="60" value="24"></div>
    <div class="control"><label>Box blur 半径 radius <span id="radiusText"></span></label><input id="radius" type="range" min="1" max="40" value="16"></div>
    <div class="control"><label>模糊迭代 iterations <span id="iterText"></span></label><input id="iter" type="range" min="1" max="5" value="3"></div>
    <div class="control"><label>色块扩散 spread <span id="spreadText"></span></label><input id="spread" type="range" min="70" max="220" value="120"></div>
    <div class="control"><label>色块强度 iconAlpha <span id="iconAlphaText"></span></label><input id="iconAlpha" type="range" min="30" max="110" value="82"></div>
    <div class="control"><label>背景亮度 brightness <span id="brightnessText"></span></label><input id="brightness" type="range" min="80" max="125" value="104"></div>
    <div class="control"><label>背景对比 contrast <span id="contrastText"></span></label><input id="contrast" type="range" min="70" max="120" value="92"></div>
    <div class="control"><label>饱和度 saturation <span id="satText"></span></label><input id="sat" type="range" min="60" max="130" value="96"></div>

    <div class="buttons">
      <button onclick="preset('ios')">iOS 中等模糊</button>
      <button onclick="preset('soft')">更雾化</button>
      <button onclick="preset('clear')">更清晰</button>
      <button onclick="copyParams()">复制参数</button>
    </div>

    <h2 style="margin-top:18px">当前参数</h2>
    <pre id="params"></pre>
  </aside>

<script>
const W = 420, H = 910;
const controls = {
  scale: document.getElementById('scale'),
  radius: document.getElementById('radius'),
  iter: document.getElementById('iter'),
  spread: document.getElementById('spread'),
  iconAlpha: document.getElementById('iconAlpha'),
  brightness: document.getElementById('brightness'),
  contrast: document.getElementById('contrast'),
  sat: document.getElementById('sat')
};
const labels = {
  scaleText: document.getElementById('scaleText'),
  radiusText: document.getElementById('radiusText'),
  iterText: document.getElementById('iterText'),
  spreadText: document.getElementById('spreadText'),
  iconAlphaText: document.getElementById('iconAlphaText'),
  brightnessText: document.getElementById('brightnessText'),
  contrastText: document.getElementById('contrastText'),
  satText: document.getElementById('satText')
};
const srcCanvas = document.getElementById('source');
const blurCanvas = document.getElementById('blurred');
const srcCtx = srcCanvas.getContext('2d');
const blurCtx = blurCanvas.getContext('2d');

function hexToRgb(hex) {
  hex = hex.replace('#','');
  return [parseInt(hex.slice(0,2),16), parseInt(hex.slice(2,4),16), parseInt(hex.slice(4,6),16)];
}
function rgba(hex, a) {
  const [r,g,b] = hexToRgb(hex);
  return `rgba(${r},${g},${b},${a})`;
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

const palette = {
  deep:'#061426', mid:'#0B2947', glow:'#164166', bottom:'#07111F',
  aura:'#2F72AD', aura2:'#236AA8', widget:'#B9C3CD',
  icons:['#18AFFF','#FFB51B','#565765','#F5F7FB','#FF5058','#FF941D','#B9C3CD','#1078F8','#28BFFA','#FFBE32','#181A28','#F7FBFF']
};
const xs = [0.15,0.38,0.62,0.85];
const ys = [0.11,0.24,0.37,0.50,0.63,0.76];

function drawBackground(ctx, w, h, opts, sharp=false) {
  ctx.clearRect(0,0,w,h);
  let g = ctx.createLinearGradient(w*.08,0,w*.92,h);
  g.addColorStop(0,palette.deep); g.addColorStop(.38,palette.mid); g.addColorStop(.68,palette.glow); g.addColorStop(1,palette.bottom);
  ctx.fillStyle = g; ctx.fillRect(0,0,w,h);

  let r1 = ctx.createRadialGradient(w*.74,h*.34,0,w*.74,h*.34,w*.58);
  r1.addColorStop(0,rgba(palette.aura,.34)); r1.addColorStop(1,'rgba(47,114,173,0)');
  ctx.fillStyle = r1; ctx.fillRect(0,0,w,h);
  let r2 = ctx.createRadialGradient(w*.20,h*.62,0,w*.20,h*.62,w*.44);
  r2.addColorStop(0,rgba(palette.aura2,.22)); r2.addColorStop(1,'rgba(35,106,168,0)');
  ctx.fillStyle = r2; ctx.fillRect(0,0,w,h);

  const icon = Math.min(w*.145, h*.068);
  let k = 0;
  for (const y of ys) for (const x of xs) {
    if ((y === .24 && x > .50) || (y === .76 && x === .62)) continue;
    drawBlock(ctx, w*x, h*y, icon, palette.icons[k % palette.icons.length], opts, sharp);
    k++;
  }
  drawBlock(ctx, w*.73, h*.295, Math.min(w*.40,h*.17), palette.widget, {...opts, aspect:2.35, alpha:(opts.alpha||1)*.78}, sharp);
  for (let i=0;i<5;i++) drawBlock(ctx, w*(.14+i*.18), h*.932, icon*.80, palette.icons[(i+2)%palette.icons.length], {...opts, alpha:(opts.alpha||1)*.80}, sharp);
}

function drawBlock(ctx, cx, cy, base, color, opts, sharp) {
  const alpha = opts.alpha ?? 1;
  const spread = opts.spread ?? 1.2;
  const aspect = opts.aspect ?? 1;
  const layers = sharp ? [[1,1]] : [[spread*2.2,.08],[spread*1.55,.14],[spread*1.15,.24],[spread*.86,.34],[spread*.62,.50]];
  for (const [s, weight] of layers) {
    const bw = base * s * aspect, bh = base * s;
    ctx.fillStyle = rgba(color, alpha * weight);
    roundRect(ctx, cx-bw/2, cy-bh/2, bw, bh, bh*.30);
    ctx.fill();
    if (sharp) {
      const hi = ctx.createLinearGradient(0, cy-bh/2, 0, cy+bh/2);
      hi.addColorStop(0, 'rgba(255,255,255,.22)'); hi.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = hi; ctx.fill();
    }
  }
}

function boxBlurImageData(imageData, radius, iterations) {
  let {width, height, data} = imageData;
  let src = new Uint8ClampedArray(data);
  let tmp = new Uint8ClampedArray(src.length);
  let out = new Uint8ClampedArray(src.length);
  const win = radius * 2 + 1;
  for (let it=0; it<iterations; it++) {
    for (let y=0; y<height; y++) {
      let a=0,r=0,g=0,b=0;
      for (let i=-radius; i<=radius; i++) {
        const x = Math.max(0, Math.min(width-1, i));
        const p = (y*width + x)*4; r+=src[p]; g+=src[p+1]; b+=src[p+2]; a+=src[p+3];
      }
      for (let x=0; x<width; x++) {
        const p = (y*width+x)*4;
        tmp[p]=r/win; tmp[p+1]=g/win; tmp[p+2]=b/win; tmp[p+3]=a/win;
        const rx = Math.max(0, Math.min(width-1, x-radius));
        const ax = Math.max(0, Math.min(width-1, x+radius+1));
        const rp = (y*width+rx)*4, ap=(y*width+ax)*4;
        r += src[ap] - src[rp]; g += src[ap+1] - src[rp+1]; b += src[ap+2] - src[rp+2]; a += src[ap+3] - src[rp+3];
      }
    }
    for (let x=0; x<width; x++) {
      let a=0,r=0,g=0,b=0;
      for (let i=-radius; i<=radius; i++) {
        const y = Math.max(0, Math.min(height-1, i));
        const p = (y*width+x)*4; r+=tmp[p]; g+=tmp[p+1]; b+=tmp[p+2]; a+=tmp[p+3];
      }
      for (let y=0; y<height; y++) {
        const p = (y*width+x)*4;
        out[p]=r/win; out[p+1]=g/win; out[p+2]=b/win; out[p+3]=a/win;
        const ry = Math.max(0, Math.min(height-1, y-radius));
        const ay = Math.max(0, Math.min(height-1, y+radius+1));
        const rp = (ry*width+x)*4, ap=(ay*width+x)*4;
        r += tmp[ap] - tmp[rp]; g += tmp[ap+1] - tmp[rp+1]; b += tmp[ap+2] - tmp[rp+2]; a += tmp[ap+3] - tmp[rp+3];
      }
    }
    src = new Uint8ClampedArray(out);
  }
  return new ImageData(out, width, height);
}

function adjustImageData(imageData, brightness, contrast, saturation) {
  const d = imageData.data;
  const c = contrast, br = brightness, s = saturation;
  for (let i=0;i<d.length;i+=4) {
    let r=d[i], g=d[i+1], b=d[i+2];
    const gray = r*.2126 + g*.7152 + b*.0722;
    r = gray + (r-gray)*s; g = gray + (g-gray)*s; b = gray + (b-gray)*s;
    r = ((r-128)*c + 128) * br; g = ((g-128)*c + 128) * br; b = ((b-128)*c + 128) * br;
    d[i]=Math.max(0,Math.min(255,r)); d[i+1]=Math.max(0,Math.min(255,g)); d[i+2]=Math.max(0,Math.min(255,b));
  }
  return imageData;
}

function render() {
  const scale = Number(controls.scale.value)/100;
  const radius = Number(controls.radius.value);
  const iter = Number(controls.iter.value);
  const spread = Number(controls.spread.value)/100;
  const alpha = Number(controls.iconAlpha.value)/100;
  const brightness = Number(controls.brightness.value)/100;
  const contrast = Number(controls.contrast.value)/100;
  const sat = Number(controls.sat.value)/100;

  drawBackground(srcCtx, W, H, {spread:1, alpha:1}, true);

  const sw = Math.round(W*scale), sh = Math.round(H*scale);
  const small = document.createElement('canvas'); small.width = sw; small.height = sh;
  const sctx = small.getContext('2d');
  drawBackground(sctx, sw, sh, {spread, alpha}, false);
  let img = sctx.getImageData(0,0,sw,sh);
  img = boxBlurImageData(img, radius, iter);
  img = adjustImageData(img, brightness, contrast, sat);
  sctx.putImageData(img,0,0);
  blurCtx.clearRect(0,0,W,H);
  blurCtx.imageSmoothingEnabled = true;
  blurCtx.imageSmoothingQuality = 'high';
  blurCtx.drawImage(small, 0,0,W,H);

  labels.scaleText.textContent = scale.toFixed(2);
  labels.radiusText.textContent = radius;
  labels.iterText.textContent = iter;
  labels.spreadText.textContent = spread.toFixed(2);
  labels.iconAlphaText.textContent = alpha.toFixed(2);
  labels.brightnessText.textContent = brightness.toFixed(2);
  labels.contrastText.textContent = contrast.toFixed(2);
  labels.satText.textContent = sat.toFixed(2);
  document.getElementById('params').textContent = `Backdrop bitmap params\nscale=${scale.toFixed(3)}\nradius=${radius}\niterations=${iter}\nspread=${spread.toFixed(2)}\niconAlpha=${alpha.toFixed(2)}\nbrightness=${brightness.toFixed(2)}\ncontrast=${contrast.toFixed(2)}\nsaturation=${sat.toFixed(2)}\n\nCompose mapping\nBlurredBackdrop.kt scale = ${scale.toFixed(3)}\nradius = ${radius}\niterations = ${iter}\ndrawSoftBlock spread base ≈ ${spread.toFixed(2)}\nicon alpha multiplier ≈ ${alpha.toFixed(2)}`;
}

Object.values(controls).forEach(el => el.addEventListener('input', render));
function preset(name) {
  const p = {
    ios:   {scale:24, radius:16, iter:3, spread:120, iconAlpha:82, brightness:104, contrast:92, sat:96},
    soft:  {scale:20, radius:22, iter:3, spread:150, iconAlpha:70, brightness:106, contrast:86, sat:90},
    clear: {scale:30, radius:10, iter:2, spread:95,  iconAlpha:90, brightness:102, contrast:96, sat:100}
  }[name];
  Object.entries(p).forEach(([k,v]) => controls[k].value = v);
  render();
}
async function copyParams() {
  const text = document.getElementById('params').textContent;
  try { await navigator.clipboard.writeText(text); alert('已复制参数'); }
  catch { alert(text); }
}
render();
</script>
</body>
</html>
