<style>

*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 15% 12%,rgba(0,132,255,.38),transparent 34%),radial-gradient(circle at 88% 84%,rgba(255,119,166,.35),transparent 30%),linear-gradient(145deg,#050817,#101b42 58%,#211632);overflow-x:hidden}.app{display:grid;grid-template-columns:minmax(360px,1fr)390px;gap:18px;width:min(1380px,calc(100vw - 28px));margin:0 auto;padding:22px 0}.hero,.sideCard{border:1px solid var(--line);border-radius:28px;background:linear-gradient(180deg,rgba(16,29,69,.72),rgba(7,13,34,.58));box-shadow:0 20px 60px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.12);backdrop-filter:blur(18px)}.hero{padding:18px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.title h1{margin:0;font-size:clamp(24px,3vw,40px);letter-spacing:-.05em}.title p{margin:8px 0 0;color:var(--muted);font-weight:800}.buttons{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}button,label.fileButton{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:rgba(255,255,255,.88);border-radius:999px;padding:10px 13px;font-weight:900;font-size:12px;cursor:pointer}button:hover,label.fileButton:hover{background:rgba(255,255,255,.15)}input[type=file]{display:none}.stage{position:relative;height:calc(100vh - 160px);min-height:560px;overflow-y:auto;overflow-x:hidden;border-radius:30px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);scrollbar-color:rgba(255,255,255,.35) transparent}.background{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center;filter:saturate(1.08) contrast(1.04);transform:scale(1.015);pointer-events:none}.stageShade{position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 18% 15%,rgba(255,255,255,.18),transparent 26%),linear-gradient(110deg,transparent 12%,r t-size:18px}.sectionTitle span{color:var(--muted);font-size:11px;font-weight:800}.presetRow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.presetRow button{padding:8px 10px}.control{padding:10px 0;border-top:1px solid rgba(255,255,255,.08)}.control:first-of-type{border-top:0}.controlHead{display:flex;justify-content:space-between;margin-bottom:6px}.control strong{font-size:13px}.control small{color:rgba(255,255,255,.38);font-weight:800}input[type=range]{width:100%;accent-color:#9b7cff}textarea{width:100%;min-height:180px;resize:vertical;color:rgba(255,255,255,.86);background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;line-height:1.45}.hint{margin-top:10px;color:rgba(255,255,255,.48);font-size:12px;font-weight:750;line-height:1.6}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(18px);opacity:0;background:rgba(0,0,0,.58);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:10px 14px;font-weight:850;transition:.18s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:980px){.app{grid-template-columns:1fr;width:min(100vw - 18px,760px);padding-top:10px}.toolbar{flex-direction:column}.buttons{justify-content:flex-start}.stage{height:72vh;min-height:520px}.glassWrap{left:4%;right:4%;height:230px;top:620px}}

<body>
<main class="app">
<section class="hero"><div class="toolbar"><div class="title"><h1>Scrollable OpenGL Glass Lab</h1><p>固定背景 · 只滚动玻璃本体，观察玻璃滑过不同背景时的折射</p></div><div class="buttons"><label class="fileButton">上传背景<input id="file" type="file" accept="image/*"></label><button id="copyJson">复制 JSON</button><button id="copyKotlin">复制 Kotlin 默认值</button></div></div><div class="stage" id="stage"><div class="background" id="bg"></div><div class="stageShade"></div><div class="world" id="world"><div class="scrollHint">在这个预览框里上下滚动：背景固定，玻璃移动</div><div class="glassWrap" id="glassWrap"><canvas id="gl"></canvas><div class="glassOverlay"></div><div class="sampleUi"><div><h2>Display</h2><p>Liquid refractive material · fixed background scroll test</p></div><div class="sampleBottom"><span style="font-weight:950;font-size:28px">☀︎</span><div class="track"></div><div class="knob">☼</div></div></div></div><div class="spacerLabel">继续滚动，让玻璃从固定背景上滑过</div></div></div></section>
<aside class="side"><section class="sideCard"><div class="sectionTitle"><h3>OpenGL 参数</h3><span>对应 Kotlin optics</span></div><div class="presetRow"><button data-preset="safe">干净默认</button><button data-preset="strong">强折射</button><button data-preset="apple">参考图方向</button><button data-preset="reset">重置</button></div><div id="controls"></div></section><section class="sideCard"><div class="sectionTitle"><h3>当前参数</h3><span>可复制回 Android</span></div><textarea id="output" spellcheck="false"></textarea><div class="hint">这一版背景固定不动，只有玻璃本体滚动。WebGL 会按玻璃当前屏幕位置重新映射背景采样，更接近“玻璃盖在页面上移动”的观察方式。</div></section></aside>
</main><div class="toast" id="toast">已复制</div>
<script>
const DEFAULTS={surfaceWidth:.18,surfaceSteepness:1.20,refractionGainPx:118,slopeResponse:.72,lensClarity:.74,tangentSmear:.32,centerLensPx:16,edgeDarkness:.36,highlightStrength:.40,brightness:1.00};
const PRESETS={safe:{surfaceWidth:.18,surfaceSteepness:1.20,refractionGainPx:96,slopeResponse:.78,lensClarity:.64,tangentSmear:.28,centerLensPx:14,edgeDarkness:.34,highlightStrength:.34,brightness:1},strong:{surfaceWidth:.25,surfaceSteepness:1.08,refractionGainPx:165,slopeResponse:.58,lensClarity:.98,tangentSmear:.58,centerLensPx:22,edgeDarkness:.46,highlightStrength:.48,brightness:1.04},apple:{surfaceWidth:.22,surfaceSteepness:1.10,refractionGainPx:138,slopeResponse:.66,lensClarity:.88,tangentSmear:.40,centerLensPx:18,edgeDarkness:.38,highlightStrength:.52,brightness:1.03},reset:DEFAULTS};
const META=[['surfaceWidth','曲面宽度',.05,.65,.01],['surfaceSteepness','曲面陡度',.45,2.8,.01],['refractionGainPx','折射增益',0,260,1],['slopeResponse','坡面响应',.30,1.30,.01],['lensClarity','清晰采样',0,1.60,.01],['tangentSmear','切向拖色',0,1.80,.01],['centerLensPx','中心透镜',0,90,1],['edgeDarkness','暗边厚度',0,1.80,.01],['highlightStrength','高光/光场',0,1.60,.01],['brightness','样本亮度',.55,1.80,.01]];
let params={...DEFAULTS};
const canvas=document.getElementById('gl'),stage=document.getElementById('stage'),world=document.getElementById('world'),wrap=document.getElementById('glassWrap'),bg=document.getElementById('bg'),output=document.getElementById('output'),toast=document.getElementById('toast');
const gl=canvas.getContext('webgl',{premultipliedAlpha:false,alpha:true,antialias:true});if(!gl)alert('当前浏览器不支持 WebGL。');
const vs=`attribute vec2 aPosition;void main(){gl_Position=vec4(aPosition,0.0,1.0);}`;
const fs=`precision highp float;uniform vec2 uResolution;uniform vec4 uOpticsA;uniform vec4 uOpticsB;uniform vec4 uOpticsC;uniform vec4 uBackdropRect;uniform sampler2D uTexture;float sat(float x){return clamp(x,0.0,1.0);}vec2 clampUv(vec2 uv){return clamp(uv,vec2(0.0),vec2(1.0));}vec2 safeGlassUv(vec2 uv){return clamp(uv,vec2(0.018),vec2(0.982));}vec2 backdropUv(vec2 localUv){return uBackdropRect.xy+safeGlassUv(localUv)*uBackdropRect.zw;}float roundedBoxSdf(vec2 coord,vec2 rectSize,float radius){vec2 p=coord-rectSize*.5;vec2 h=rectSize*.5;vec2 q=abs(p)-max(h-vec2(radius),vec2(0.0));return length(max(q,0.0))+min(max(q.x,q.y),0.0)-radius;}vec3 sampleTex(vec2 uv){return texture2D(uTexture,clampUv(backdropUv(uv))).rgb;}vec3 sampleBlur(vec2 uv){vec2 px=vec2(1.0)/max(uResolution,vec2(1.0));vec3 c=sampleTex(uv)*.38;c+=sampleTex(uv+vec2(px.x*2.0,0.0))*.12;c+=sampleTex(uv-vec2(px.x*2.0,0.0))*.12;c+=sampleTex(uv+vec2(0.0,px.y*2.0))*.12;c+=sampleTex(uv-vec2(0.0,px.y*2.0))*.12;c+=sampleTex(uv+vec2(px.x*2.2,px.y*2.2))*.07;c+=sampleTex(uv-vec2(px.x*2.2,px.y*2.2))*.07;return c;}float edgeProfileAt(float sd,float fieldWidth,float steepness){float inside=max(-sd,0.0);float shape=1.0-smoothstep(0.0,3.0,sd);float t=inside/max(fieldWidth,1.0);float curve=pow(max(t,0.0),max(steepness,.35));return exp(-curve*1.42)*shape;}float surfaceHeightAt(vec2 coord,vec2 rectSize,float radius){float sd=roundedBoxSdf(coord,rectSize,radius);float minSide=max(min(rectSize.x,rectSize.y),1.0);float fieldWidth=minSide*(.06+uOpticsA.x*.28);float edge=edgeProfileAt(sd,fieldWidth,uOpticsA.y);float shape=1.0-smoothstep(0.0,3.0,sd);vec2 local=clampUv(coord/rectSize);vec2 p=local*2.0-1.0;p.x*=min(rectSize.x/max(rectSize.y,1.0),2.35)*.42;float d=length(p);float dome=pow(sat(1.0-d*.74),1.82);float bridge=pow(sat(edge*dome),.62);float corner=sat(length((local-vec2(.5))*vec2(rectSize.x/max(rectSize.y,1.0),1.0))*1.22-.20);return (edge*.58+bridge*.22+dome*.14+corner*edge*.11)*shape;}vec3 materialFlowAt(vec2 uv,float shoulder,float body,float strength){float wave=.48+.10*sin(uv.x*3.2+uv.y*1.1)+.045*sin((uv.x+uv.y)*7.0);float band=exp(-pow(abs(uv.y-wave)*5.8,2.0));float diag=exp(-pow(abs((uv.x*.62+uv.y*.58)-.78)*5.3,2.0));vec3 blue=vec3(.08,.48,1.0)*band;vec3 cyan=vec3(.42,.92,1.0)*diag;vec3 warm=vec3(1.0,.55,.78)*exp(-pow(abs(uv.y-.78)*4.7,2.0));return (blue+cyan*.50+warm*.32)*sat(.16+shoulder*.36+body*.16)*strength;}vec2 softLimitPx(vec2 v,float limitPx){float len=length(v);float softLen=len/(1.0+len/max(limitPx,1.0));return v*(softLen/max(len,.0001));}void main(){vec2 coord=vec2(gl_FragCoord.x,uResolution.y-gl_FragCoord.y);vec2 rect=max(uResolution,vec2(1.0));float radius=min(54.0,min(rect.x,rect.y)*.5);float sd=roundedBoxSdf(coord,rect,radius);float mask=1.0-smoothstep(0.0,1.4,sd);if(mask<=.001)discard;vec2 uv=coord/rect;vec2 cd=uv-vec2(.5);cd.x*=min(rect.x/max(rect.y,1.0),2.35);float centerD=length(cd);float body=pow(sat(1.0-centerD*.78),1.60);float minSide=max(min(rect.x,rect.y),1.0);float fieldWidth=minSide*(.06+uOpticsA.x*.28);float inside=max(-sd,0.0);float edge=edgeProfileAt(sd,fieldWidth,uOpticsA.y);float edgeSafe=smoothstep(1.5,12.0,inside);float s=2.0;float pL=surfaceHeightAt(coord-vec2(s,0.0),rect,radius);float pR=surfaceHeightAt(coord+vec2(s,0.0),rect,radius);float pU=surfaceHeightAt(coord-vec2(0.0,s),rect,radius);float pD=surfaceHeightAt(coord+vec2(0.0,s),rect,radius);vec2 grad=vec2(pR-pL,pD-pU)*.5;float slope=length(grad);vec2 g=grad/max(slope,.0001);vec2 bodyDir=cd/max(centerD,.0001);float slopeEnergy=pow(sat(slope*8.2+edge*.055),max(uOpticsA.w,.25));float shoulder=sat(edge*.22+slopeEnergy*.70);vec2 refract=g*slopeEnergy*uOpticsA.z*.52*(.24+shoulder*.62);vec2 bodyLens=-bodyDir*body*uOpticsB.z*.18;vec2 flow=softLimitPx(refract+bodyLens,mix(26.0,72.0,shoulder));vec2 ruv=safeGlassUv(uv+flow/max(rect,vec2(1.0)));vec3 blur=sampleBlur(ruv);vec3 lens=sampleTex(ruv);float lensMix=sat((.12+shoulder*.54+body*.05)*uOpticsB.x*.78);vec3 color=mix(blur,lens,lensMix);float mat=sat(uOpticsC.x*.62+uOpticsB.x*.18);vec3 flowColor=materialFlowAt(safeGlassUv(ruv+g*shoulder*.010),shoulder,body,mat);color=mix(color,max(color,flowColor),sat(mat*(.14+shoulder*.24+body*.08)));float smear=sat((slopeEnergy*.55+edge*.20)*uOpticsB.y*.36*edgeSafe);if(smear>.002){vec2 t=vec2(-g.y,g.x);vec2 tp=t*(3.0+18.0*smear)/max(rect,vec2(1.0));vec2 np=g*(2.0+7.0*smear)/max(rect,vec2(1.0));vec3 drag=sampleTex(ruv+tp)*.34+sampleTex(ruv-tp)*.34+sampleBlur(ruv+np)*.16+sampleBlur(ruv-np)*.16;color=mix(color,drag,sat(smear*.20));}float rimCore=(1.0-smoothstep(0.0,6.5,abs(sd)))*mask;float rimInner=smoothstep(2.0,11.0,inside)*(1.0-smoothstep(11.0,40.0,inside))*mask;float topBias=sat(1.0-uv.y*1.72);float bottomBias=sat((uv.y-.30)*1.72);float rim=sat(uOpticsC.x*.56+uOpticsB.w*.32);color+=vec3(.80,.96,1.0)*(rimCore*.22+rimInner*.13)*topBias*rim;color+=vec3(1.0,.62,.82)*(rimCore*.15+rimInner*.10)*bottomBias*rim;color+=vec3(.28,.68,1.0)*rimInner*.09*rim;color-=vec3(.040,.052,.064)*rimInner*uOpticsB.w*.16;float light=sat(.54-g.y*.36+g.x*.05);float hi=sat((slopeEnergy*.30+edge*.08+body*.018)*light*uOpticsC.x);color*=uOpticsC.y*(1.0+hi*.20);color+=vec3(.028,.046,.058)*hi;color-=vec3(.040,.052,.064)*uOpticsB.w*shoulder*.82;color+=vec3(.014,.026,.034)*body*.055;color=clamp(color,0.0,1.0);gl_FragColor=vec4(color,.90*mask);}`;
function compile(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s}function program(){const p=gl.createProgram();gl.attachShader(p,compile(gl.VERTEX_SHADER,vs));gl.attachShader(p,compile(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));return p}const prog=program();const loc={a:gl.getAttribLocation(prog,'aPosition'),res:gl.getUniformLocation(prog,'uResolution'),aOpt:gl.getUniformLocation(prog,'uOpticsA'),bOpt:gl.getUniformLocation(prog,'uOpticsB'),cOpt:gl.getUniformLocation(prog,'uOpticsC'),rect:gl.getUniformLocation(prog,'uBackdropRect'),tex:gl.getUniformLocation(prog,'uTexture')};const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
function makeDefaultImage(){const c=document.createElement('canvas');c.width=1200;c.height=820;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,c.width,c.height);g.addColorStop(0,'#061f5a');g.addColorStop(.42,'#58caff');g.addColorStop(.70,'#17255d');g.addColorStop(1,'#ff8aa1');x.fillStyle=g;x.fillRect(0,0,c.width,c.height);x.globalAlpha=.58;for(let i=0;i<10;i++){x.strokeStyle=i%2?'#fff':'#78e9ff';x.lineWidth=4+i*.5;x.beginPath();x.moveTo(-80,130+i*62);x.bezierCurveTo(260,20+i*10,520,330-i*20,1280,130+i*30);x.stroke()}x.globalAlpha=.28;for(let y=80;y<760;y+=160){for(let xx=80;xx<1160;xx+=120){x.fillStyle='#fff';x.fillRect(xx,y,70,14)}}return c.toDataURL('image/png')}function setImage(src){bg.style.backgroundImage=`url(${src})`;const img=new Image();img.onload=()=>{uploadTexture(img);render()};img.src=src}function uploadTexture(img){const c=document.createElement('canvas');c.width=1024;c.height=1024;const x=c.getContext('2d');const ratio=Math.max(c.width/img.width,c.height/img.height);const w=img.width*ratio,h=img.height*ratio;x.drawImage(img,(c.width-w)/2,(c.height-h)/2,w,h);gl.bindTexture(gl.TEXTURE_2D,tex);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,c)}
function backdropRect(){const sr=stage.getBoundingClientRect(),wr=wrap.getBoundingClientRect();return [(wr.left-sr.left)/Math.max(sr.width,1),(wr.top-sr.top)/Math.max(sr.height,1),wr.width/Math.max(sr.width,1),wr.height/Math.max(sr.height,1)]}function resize(){const r=wrap.getBoundingClientRect();const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.max(1,Math.floor(r.width*dpr));canvas.height=Math.max(1,Math.floor(r.height*dpr));gl.viewport(0,0,canvas.width,canvas.height);render()}function render(){if(!gl)return;gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);gl.useProgram(prog);gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.enableVertexAttribArray(loc.a);gl.vertexAttribPointer(loc.a,2,gl.FLOAT,false,0,0);gl.uniform2f(loc.res,canvas.width,canvas.height);gl.uniform4f(loc.aOpt,params.surfaceWidth,params.surfaceSteepness,params.refractionGainPx,params.slopeResponse);gl.uniform4f(loc.bOpt,params.lensClarity,params.tangentSmear,params.centerLensPx,params.edgeDarkness);gl.uniform4f(loc.cOpt,params.highlightStrength,params.brightness,0,0);const r=backdropRect();gl.uniform4f(loc.rect,r[0],r[1],r[2],r[3]);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);gl.uniform1i(loc.tex,0);gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}function buildControls(){const root=document.getElementById('controls');root.innerHTML='';META.forEach(([key,label,min,max,step])=>{const box=document.createElement('div');box.className='control';box.innerHTML=`<div class="controlHead"><strong>${label}</strong><small id="v-${key}"></small></div><input id="i-${key}" type="range" min="${min}" max="${max}" step="${step}" value="${params[key]}">`;root.appendChild(box);box.querySelector('input').addEventListener('input',e=>{params[key]=parseFloat(e.target.value);updateOutput();render()})});updateOutput()}function kotlinText(){return `OpenGLLiquidPotentialLabOptics(\n    surfaceWidth = ${params.surfaceWidth.toFixed(2)}f,\n    surfaceSteepness = ${params.surfaceSteepness.toFixed(2)}f,\n    refractionGainPx = ${params.refractionGainPx.toFixed(0)}f,\n    slopeResponse = ${params.slopeResponse.toFixed(2)}f,\n    lensClarity = ${params.lensClarity.toFixed(2)}f,\n    tangentSmear = ${params.tangentSmear.toFixed(2)}f,\n    centerLensPx = ${params.centerLensPx.toFixed(0)}f,\n    edgeDarkness = ${params.edgeDarkness.toFixed(2)}f,\n    highlightStrength = ${params.highlightStrength.toFixed(2)}f,\n    brightness = ${params.brightness.toFixed(2)}f\n)`}function updateOutput(){META.forEach(([key])=>{const v=document.getElementById(`v-${key}`);if(v)v.textContent=String(Math.round(params[key]*100)/100);const input=document.getElementById(`i-${key}`);if(input&&parseFloat(input.value)!==params[key])input.value=params[key]});output.value=JSON.stringify(params,null,2)+'\n\n'+kotlinText()}function applyPreset(name){params={...PRESETS[name]};updateOutput();render()}async function copy(text){await navigator.clipboard.writeText(text);toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1100)}document.querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click',()=>applyPreset(b.dataset.preset)));document.getElementById('copyJson').addEventListener('click',()=>copy(JSON.stringify(params,null,2)));document.getElementById('copyKotlin').addEventListener('click',()=>copy(kotlinText()));document.getElementById('file').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>setImage(reader.result);reader.readAsDataURL(f)});window.addEventListener('resize',resize);stage.addEventListener('scroll',()=>{resize();render()},{passive:true});setImage(makeDefaultImage());buildControls();setTimeout(()=>{resize();stage.scrollTop=500;render()},0);
</script>
