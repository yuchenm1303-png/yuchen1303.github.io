@Composable
private fun StockIntradayChartV2(state: AssistantUiState) {
    GlassPanel(state.quality, state.glassIntensity * 0.96f, state.motionIntensity, 26, Modifier.fillMaxWidth(), GlassRole.Card) {
        Column(Modifier.padding(14.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
            SectionTitleV2("今日分时", "后续接入 REST / WebSocket 实时数据源")
            Canvas(modifier = Modifier.fillMaxWidth().height(128.dp)) {
                val values = listOf(188.1f, 188.6f, 187.9f, 188.8f, 189.4f, 188.9f, 189.7f, 190.5f, 189.8f, 190.9f, 191.2f, 190.4f, 189.84f)
                val minValue = values.minOrNull() ?: 0f
                val maxValue = values.maxOrNull() ?: 1f
                val range = (maxValue - minValue).coerceAtLeast(0.01f)
                val left = 4.dp.toPx()
                val right = size.width - 4.dp.toPx()
                val top = 8.dp.toPx()
                val bottom = size.height - 10.dp.toPx()
                val gridColor = Color.White.copy(alpha = 0.12f)
                repeat(4) { index ->
                    val y = top + (bottom - top) * index / 3f
                    drawLine(gridColor, Offset(left, y), Offset(right, y), 1.dp.toPx(), cap = StrokeCap.Round)
                }
                val path = Path()
                values.forEachIndexed { index, value ->
                    val x = left + (right - left) * index / (values.lastIndex.coerceAtLeast(1)).toFloat()
                    val y = bottom - (value - minValue) / range * (bottom - top)
                    if (index == 0) path.moveTo(x, y) else path.lineTo(x, y)
                }
                drawPath(path, Color(0xFF7CFFB2), style = Stroke(width = 2.6.dp.toPx(), cap = StrokeCap.Round))
                val lastX = right
                val lastY = bottom - (values.last() - minValue) / range * (bottom - top)
                drawCircle(Color(0xFF7CFFB2), radius = 4.5.dp.toPx(), center = Offset(lastX, lastY))
                drawCircle(Color.White.copy(alpha = 0.35f), radius = 9.dp.toPx(), center = Offset(lastX, lastY), style = Stroke(width = 1.dp.toPx()))
            }
            Row(horizontalArrangement = Arrangement.SpaceBetween, modifier = Modifier.fillMaxWidth()) {
                Text("09:30", color = Color.White.copy(alpha = 0.42f), fontSize = 10.sp, fontWeight = FontWeight.Bold)
                Text("11:30", color = Color.White.copy(alpha = 0.42f), fontSize = 10.sp, fontWeight = FontWeight.Bold)
                Text("15:00", color = Color.White.copy(alpha = 0.42f), fontSize = 10.sp, fontWeight = FontWeight.Bold)
            }
        }
    }
}

