tasks.register('patchModelSelectorFoldedStackDetails') {
    doLast {
        def selector = file('src/main/java/com/yuchen/ailedger/ui/UnifiedModelStackSelector.kt')
        if (!selector.exists()) {
            println('UnifiedModelStackSelector.kt not found; skipped folded stack detail patch.')
            return
        }
        def text = selector.getText('UTF-8')

        text = text.replaceAll(/val collapsedWidth = \(maxWidth - reservedGap\) \* 0\.[0-9]+f/, 'val collapsedWidth = (maxWidth - reservedGap) * 0.642f')

        if (!text.contains('private const val ModelStackTapMaxMillis')) {
            def easingAnchor = '''private val ModelStackVisual = CubicBezierEasing(0.18f, 0.00f, 0.14f, 1.00f)
'''
            def easingWithTapLimit = '''private val ModelStackVisual = CubicBezierEasing(0.18f, 0.00f, 0.14f, 1.00f)
private const val ModelStackTapMaxMillis = 450L
'''
            if (text.contains(easingAnchor)) {
                text = text.replace(easingAnchor, easingWithTapLimit)
                println('Inserted model stack tap duration threshold.')
            } else {
                println('Model stack easing anchor not found; skipped tap threshold insertion.')
            }
        }

        def oldBackPlateCall = '''                            .drawFoldedModelBackPlate(style, theme, stackRank, stackCompression)
                    )
                    return@forEachIndexed
'''
        def newBackPlateCall = '''                            .drawFoldedModelBackPlate(style, theme, stackRank, stackCompression)
                    ) {
                        FoldedModelBackPlateLabel(model = model, stackRank = stackRank, theme = theme)
                    }
                    return@forEachIndexed
'''
        if (text.contains(oldBackPlateCall)) {
            text = text.replace(oldBackPlateCall, newBackPlateCall)
            println('Restored folded stack rear model labels.')
        } else if (text.contains('FoldedModelBackPlateLabel(model = model')) {
            println('Folded stack rear model labels already restored.')
        } else {
            println('Folded stack Box target not found; skipped rear label insertion.')
        }

        if (!text.contains('private fun FoldedModelBackPlateLabel(')) {
            def contentAnchor = '''@Composable
private fun UnifiedModelCardContent(
'''
            def foldedLabelFunction = '''@Composable
private fun FoldedModelBackPlateLabel(model: ChatModel, stackRank: Int, theme: ModelCardPrismTheme) {
    val density = LocalDensity.current
    val labelShiftX = with(density) { (stackRank * 22).dp.toPx() }
    val labelShiftY = with(density) { ((stackRank - 1) * 4).dp.toPx() }
    val labelAlpha = (0.70f - stackRank * 0.065f).coerceIn(0.38f, 0.66f)
    Box(Modifier.fillMaxSize()) {
        Text(
            model.shortLabel,
            modifier = Modifier.align(Alignment.CenterEnd).graphicsLayer {
                alpha = labelAlpha
                translationX = -labelShiftX
                translationY = labelShiftY
            },
            color = theme.bright.copy(alpha = 0.90f),
            fontSize = 8.sp,
            fontWeight = FontWeight.Black,
            textAlign = TextAlign.End,
            maxLines = 1,
            overflow = TextOverflow.Clip
        )
    }
}

'''
            if (text.contains(contentAnchor)) {
                text = text.replace(contentAnchor, foldedLabelFunction + contentAnchor)
                println('Inserted folded rear model label composable.')
            } else {
                println('UnifiedModelCardContent anchor not found; skipped folded label composable insertion.')
            }
        }

        def backPlateStart = text.indexOf('private fun Modifier.drawFoldedModelBackPlate(')
        def backPlateEnd = text.indexOf('\n\nprivate fun Modifier.drawModelCardGlassSurface', backPlateStart)
        if (backPlateStart >= 0 && backPlateEnd > backPlateStart) {
            def newBackPlateFunction = '''private fun Modifier.drawFoldedModelBackPlate(style: ModelCardGlassStyle, theme: ModelCardPrismTheme, stackRank: Int, press: Float): Modifier = drawWithCache {
    val radius = minOf(size.height * 0.42f, 30.dp.toPx()) * style.radiusScale.coerceIn(0.20f, 3f)
    val corner = CornerRadius(radius, radius)
    val rankFade = (0.30f - stackRank * 0.032f).coerceIn(0.15f, 0.28f)
    val backDotCenter = Offset(24.dp.toPx(), size.height / 2f)
    val body = Brush.linearGradient(
        listOf(
            Color.White.copy(alpha = 0.012f + 0.006f * press),
            theme.main.copy(alpha = rankFade * 0.15f + 0.014f * press),
            theme.deep.copy(alpha = rankFade * 0.24f),
            Color(0xFF000713).copy(alpha = rankFade * 0.30f)
        ),
        Offset(size.width * 0.08f, 0f),
        Offset(size.width, size.height)
    )
    val rim = Brush.linearGradient(
        listOf(
            theme.bright.copy(alpha = 0.145f + 0.045f * press),
            theme.main.copy(alpha = 0.118f + 0.034f * press),
            Color.Transparent,
            theme.prismC.copy(alpha = 0.130f + 0.026f * press)
        ),
        Offset.Zero,
        Offset(size.width, size.height)
    )
    val rearEdgeRim = Brush.linearGradient(
        listOf(
            Color.Transparent,
            theme.prismC.copy(alpha = 0.150f + 0.028f * press),
            theme.main.copy(alpha = 0.120f + 0.028f * press),
            theme.bright.copy(alpha = 0.185f + 0.032f * press)
        ),
        Offset(size.width * 0.66f, size.height * 0.18f),
        Offset(size.width, size.height)
    )
    val backDotGlow = Brush.radialGradient(
        listOf(
            theme.bright.copy(alpha = 0.030f + 0.020f * press),
            theme.main.copy(alpha = 0.044f + 0.024f * press),
            theme.prismB.copy(alpha = 0.020f + 0.012f * press),
            Color.Transparent
        ),
        backDotCenter,
        6.8.dp.toPx()
    )
    onDrawBehind {
        drawRoundRect(body, size = size, cornerRadius = corner, blendMode = BlendMode.Screen)
        drawRoundRect(brush = rim, topLeft = Offset(0.58.dp.toPx(), 0.58.dp.toPx()), size = Size(size.width - 1.16.dp.toPx(), size.height - 1.16.dp.toPx()), cornerRadius = corner, style = Stroke(0.88.dp.toPx()), blendMode = BlendMode.Screen)
        drawRoundRect(brush = rearEdgeRim, topLeft = Offset(0.72.dp.toPx(), 0.72.dp.toPx()), size = Size(size.width - 1.44.dp.toPx(), size.height - 1.44.dp.toPx()), cornerRadius = corner, style = Stroke(1.04.dp.toPx()), blendMode = BlendMode.Plus)
        drawCircle(brush = backDotGlow, radius = 6.2.dp.toPx(), center = backDotCenter, blendMode = BlendMode.Screen)
        drawCircle(theme.bright.copy(alpha = 0.34f + 0.12f * press), radius = 1.55.dp.toPx(), center = backDotCenter, blendMode = BlendMode.Screen)
    }
}
'''
            text = text.substring(0, backPlateStart) + newBackPlateFunction + text.substring(backPlateEnd)
            println('Replaced folded rear back plate with smaller dots and stronger stacked rims.')
        } else {
            println('Folded back plate function not found; skipped back plate replacement.')
        }

        def downOld = '''                                val down = awaitFirstDown(requireUnconsumed = false)
                                updateCenter(down.position)
'''
        def downNew = '''                                val down = awaitFirstDown(requireUnconsumed = false)
                                val downUptime = down.uptimeMillis
                                var releaseUptime = downUptime
                                updateCenter(down.position)
'''
        if (text.contains(downOld) && !text.contains('val downUptime = down.uptimeMillis')) {
            text = text.replace(downOld, downNew)
            println('Started tracking model-card press duration.')
        }

        def releaseOld = '''                                    if (tracked != null) { updateCenter(tracked.position); if (!tracked.pressed) { released = true; break } }
                                    if (event.changes.none { it.pressed }) { released = true; break }
'''
        def releaseNew = '''                                    if (tracked != null) { updateCenter(tracked.position); if (!tracked.pressed) { releaseUptime = tracked.uptimeMillis; released = true; break } }
                                    if (event.changes.none { it.pressed }) { releaseUptime = event.changes.maxOfOrNull { it.uptimeMillis } ?: releaseUptime; released = true; break }
'''
        if (text.contains(releaseOld)) {
            text = text.replace(releaseOld, releaseNew)
            println('Captured model-card release timestamp.')
        }

        def triggerOld = '''                                if (released) { if (currentExpanded) currentOnSelected(model) else currentOnToggleExpanded() }
'''
        def triggerNew = '''                                val isTapRelease = released && releaseUptime - downUptime <= ModelStackTapMaxMillis
                                if (isTapRelease) { if (currentExpanded) currentOnSelected(model) else currentOnToggleExpanded() }
'''
        if (text.contains(triggerOld)) {
            text = text.replace(triggerOld, triggerNew)
            println('Limited model-card expand/collapse trigger to short taps only.')
        } else if (text.contains('val isTapRelease = released && releaseUptime - downUptime <= ModelStackTapMaxMillis')) {
            println('Model-card short-tap trigger logic already exists.')
        } else {
            println('Model-card release trigger target not found; skipped tap-only trigger patch.')
        }

        selector.setText(text, 'UTF-8')
        println('Patched folded model stack details: original-like small rear dots, layered rims and tap-only release trigger.')
    }
}

tasks.named('patchModelSelectorFoldedStackDetails') {
    def layoutTask = tasks.findByName('patchModelSelectorGeminiBelowMistral')
    if (layoutTask != null) dependsOn layoutTask
    def lightTask = tasks.findByName('patchModelSelectorLightLayerMerge')
    if (lightTask != null) dependsOn lightTask
    def shadowTask = tasks.findByName('patchModelSelectorRemoveShadowElevation')
    if (shadowTask != null) dependsOn shadowTask
}

tasks.named('preBuild') {
    dependsOn tasks.named('patchModelSelectorFoldedStackDetails')
}
