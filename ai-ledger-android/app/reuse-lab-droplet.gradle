tasks.register('patchReuseLabDroplet') {
    doLast {
        def lab = file('src/main/java/com/yuchen/ailedger/ui/FrostInfoGlassPanel.kt')
        def text = lab.getText('UTF-8')
        text = text.replace('@Composable\nprivate fun OpenGlLargeDropletPreview(', '@Composable\nfun OpenGlLargeDropletPreview(')
        text = text.replace('purpleWhiteLight: Float,\n    modifier: Modifier = Modifier\n) {', 'purpleWhiteLight: Float,\n    modifier: Modifier = Modifier,\n    forceLocked: Boolean? = null,\n    onTap: (() -> Unit)? = null,\n    leadingText: String = "●",\n    mainText: String = "语音输入",\n    statusText: String? = null\n) {')
        text = text.replace('var locked by rememberSaveable { mutableStateOf(false) }', 'var localLocked by rememberSaveable { mutableStateOf(false) }')
        text = text.replace('var interactionLightX by remember { mutableStateOf(style.activeLightX.coerceIn(0.04f, 0.96f)) }', 'var interactionLightX by remember { mutableStateOf(style.activeLightX.coerceIn(0.04f, 0.96f)) }\n    val locked = forceLocked ?: localLocked')
        text = text.replace('val statusLabel = if (locked) "锁定棱彩" else "按住点亮 · 轻点锁定"', 'val statusLabel = statusText ?: if (locked) "锁定棱彩" else "按住点亮 · 轻点锁定"')
        text = text.replace('.pointerInput(style) {', '.pointerInput(style, forceLocked, onTap) {')
        text = text.replace('if (wasTap) locked = !locked', 'if (wasTap) { if (forceLocked == null) localLocked = !localLocked else onTap?.invoke() }')
        text = text.replace('Text("🎙", color = Color.White.copy(alpha = contentAlpha), fontSize = 18.sp, fontWeight = FontWeight.Black)', 'Text(leadingText, color = Color.White.copy(alpha = contentAlpha), fontSize = 18.sp, fontWeight = FontWeight.Black)')
        text = text.replace('Text("语音输入", color = Color.White.copy(alpha = contentAlpha), fontSize = 16.sp, fontWeight = FontWeight.ExtraBold, maxLines = 1, overflow = TextOverflow.Ellipsis)', 'Text(mainText, color = Color.White.copy(alpha = contentAlpha), fontSize = 16.sp, fontWeight = FontWeight.ExtraBold, maxLines = 1, overflow = TextOverflow.Ellipsis)')
        if (!text.contains('val locked = forceLocked ?: localLocked')) throw new GradleException('Lab droplet reuse patch did not apply.')
        lab.setText(text, 'UTF-8')
        println('Reused exact lab droplet implementation for home entry points.')
    }
}

tasks.register('patchDropletContinuousRefractionField') {
    doLast {
        def gl = file('src/main/java/com/yuchen/ailedger/ui/gl/OpenGLDropletGlassLayer.kt')
        def text = gl.getText('UTF-8')

        if (!text.contains('vec2 capsuleGradient(vec2 coord, vec2 size, float radius)')) {
            text = text.replace('''            vec2 globalUv(vec2 coord) { return clamp((uCardOrigin + coord) / max(uRootResolution, vec2(1.0)), 0.0, 1.0);''', '''            vec2 capsuleGradient(vec2 coord, vec2 size, float radius) {
                float e = 1.0;
                vec2 dx = vec2(e, 0.0);
                vec2 dy = vec2(0.0, e);
                float gx = capsuleSdf(coord + dx, size, radius) - capsuleSdf(coord - dx, size, radius);
                float gy = capsuleSdf(coord + dy, size, radius) - capsuleSdf(coord - dy, size, radius);
                vec2 g = vec2(gx, gy);
                float l = length(g);
                vec2 fallbackNormal = normalize(coord - size * 0.5 + vec2(0.0, 0.0001));
                return mix(fallbackNormal, g / max(l, 0.0001), step(0.0001, l));
            }

            vec2 globalUv(vec2 coord) { return clamp((uCardOrigin + coord) / max(uRootResolution, vec2(1.0)), 0.0, 1.0);''')
        }

        def oldField = '''                vec2 center = size * 0.5;
                float halfLine = max(size.x * 0.5 - radius, 0.0);
                vec2 spine = vec2(clamp(coord.x, center.x - halfLine, center.x + halfLine), center.y);
                vec2 local = coord - spine;
                vec2 wholeLocal = coord - center;
                float distToSpine = length(local);
                float rNorm = sat(distToSpine / max(radius, 1.0));
                float inside = max(radius - distToSpine, 0.0);
                vec2 normal = local / max(distToSpine, 0.001);
                vec2 tangent = vec2(-normal.y, normal.x);
                vec2 softNormal = local / max(radius, 1.0);
                float softR = sat(length(softNormal));
                vec2 softTangent = vec2(-softNormal.y, softNormal.x);
                float thickness = sqrt(max(0.0, 1.0 - rNorm * rNorm));
                float rim = pow(rNorm, 1.85);
                float edgeWidth = clamp(uShape.z, 2.0, size.y * 0.48);
                float edge = 1.0 - smoothstep(0.0, edgeWidth, inside);
                float wideRim = 1.0 - smoothstep(0.0, max(edgeWidth * 2.4, 9.0), inside);
                float thinRim = 1.0 - smoothstep(0.0, 2.8, inside);
                float rimGroove = smoothstep(2.2, 5.8, inside) * (1.0 - smoothstep(7.0, 14.0, inside));
                float innerRimLine = smoothstep(7.0, 12.0, inside) * (1.0 - smoothstep(14.0, 24.0, inside));
                float lensStrength = sat(abs(uShape.x) / 72.0);

                vec2 centerField = -vec2(wholeLocal.x * 0.12, wholeLocal.y * 0.58) * lensStrength * thickness * (1.0 - edge * 0.15);
                vec2 magnifyOffset = -local * lensStrength * (0.38 + 0.22 * thickness) * (1.0 - edge * 0.20);'''
        def newField = '''                vec2 center = size * 0.5;
                vec2 wholeLocal = coord - center;
                float inside = max(-sd, 0.0);
                float rNorm = sat(1.0 - inside / max(radius, 1.0));
                vec2 normal = capsuleGradient(coord, size, radius);
                vec2 tangent = vec2(-normal.y, normal.x);
                vec2 fieldLocal = normal * (rNorm * radius);
                vec2 softNormal = fieldLocal / max(radius, 1.0);
                float softR = rNorm;
                vec2 softTangent = vec2(-softNormal.y, softNormal.x);
                float thickness = sqrt(max(0.0, 1.0 - rNorm * rNorm));
                float rim = pow(rNorm, 1.85);
                float edgeWidth = clamp(uShape.z, 2.0, size.y * 0.48);
                float edge = 1.0 - smoothstep(0.0, edgeWidth, inside);
                float wideRim = 1.0 - smoothstep(0.0, max(edgeWidth * 2.4, 9.0), inside);
                float thinRim = 1.0 - smoothstep(0.0, 2.8, inside);
                float rimGroove = smoothstep(2.2, 5.8, inside) * (1.0 - smoothstep(7.0, 14.0, inside));
                float innerRimLine = smoothstep(7.0, 12.0, inside) * (1.0 - smoothstep(14.0, 24.0, inside));
                float lensStrength = sat(abs(uShape.x) / 72.0);

                vec2 centerField = -vec2(wholeLocal.x * 0.12, wholeLocal.y * 0.58) * lensStrength * thickness * (1.0 - edge * 0.15);
                vec2 magnifyOffset = -fieldLocal * lensStrength * (0.38 + 0.22 * thickness) * (1.0 - edge * 0.20);'''
        text = text.replace(oldField, newField)

        def oldRimProbe = '''                vec2 rimProbe = p;
                float rimProbePull = activeRimRefraction * rimFlow;
                rimProbe.x += normal.x * rimProbePull * 0.12;
                rimProbe.x = mix(rimProbe.x, lightOrigin.x, sideFacing * wideRim * 0.42);
                rimProbe.x = clamp(rimProbe.x, 0.04, 0.96);
                rimProbe.y = mix(lightOrigin.y, lightOrigin.y + normal.y * 0.08, 0.30 + 0.70 * wideRim);
                rimProbe.y = clamp(rimProbe.y, 0.04, 0.98);'''
        def newRimProbe = '''                vec2 rimProbe = p + normal * activeRimRefraction * rimFlow * wideRim * 0.055;
                rimProbe += lightDir * activeRimRefraction * rimFlow * edgeOptics * 0.035;
                rimProbe = clamp(rimProbe, vec2(0.04, 0.04), vec2(0.96, 0.98));'''
        text = text.replace(oldRimProbe, newRimProbe)

        def oldShadow = '''                float rimShadow = (wideRim * 0.38 + rim * 0.14) * (0.42 + 0.58 * sat(dot(normal, normalize(vec2(0.36, 0.94)))));
                float bottomShadow = bottomOptic * smoothstep(0.36, 1.0, y) * (0.28 + 0.72 * wideRim);
                float shadowAvoid = 1.0 - sat(entryEdgeContact * 0.80 + entryEdgeWash * 0.45);
                color -= vec3(0.055, 0.065, 0.10) * (rimShadow + bottomShadow * 0.45) * uAlpha.x * shadowAvoid;'''
        def newShadow = '''                float rimShadow = (wideRim * 0.28 + rim * 0.08) * (0.42 + 0.58 * sat(dot(normal, normalize(vec2(0.36, 0.94)))));
                float bottomShadow = bottomOptic * smoothstep(0.36, 1.0, y) * (0.20 + 0.56 * wideRim);
                float shadowAvoid = 1.0 - sat(entryEdgeContact * 0.95 + entryEdgeWash * 0.70 + rimLight * 0.55);
                color -= vec3(0.040, 0.046, 0.068) * (rimShadow + bottomShadow * 0.32) * uAlpha.x * shadowAvoid;'''
        text = text.replace(oldShadow, newShadow)

        if (text.contains('vec2 spine = vec2(clamp(coord.x')) throw new GradleException('Droplet field still uses segmented spine projection.')
        if (text.contains('mix(rimProbe.x, lightOrigin.x')) throw new GradleException('Droplet edge capture still pulls rim probe into a hard side branch.')
        if (!text.contains('capsuleGradient(coord, size, radius)')) throw new GradleException('Droplet continuous field patch did not apply.')
        gl.setText(text, 'UTF-8')
        println('Rebuilt OpenGL droplet refraction and edge capture as one continuous capsule field.')
    }
}

tasks.named('preBuild') {
    dependsOn tasks.named('patchReuseLabDroplet')
    dependsOn tasks.named('patchDropletContinuousRefractionField')
}
tasks.matching { it.name == 'compileDebugKotlin' || it.name == 'compileReleaseKotlin' }.configureEach {
    dependsOn tasks.named('patchReuseLabDroplet')
    dependsOn tasks.named('patchDropletContinuousRefractionField')
}
