@Composable
private fun StockProIntradayBoardV2(state: AssistantUiState) {
    GlassPanel(state.quality, state.glassIntensity * 0.96f, state.motionIntensity, 28, Modifier.fillMaxWidth(), GlassRole.Card) {
        Column(Modifier.padding(14.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
            SectionTitleV2("分时走势", "白线价格 · 黄线均价 · 下方成交量")
            Canvas(modifier = Modifier.fillMaxWidth().height(210.dp)) {
                val prices = listOf(19.18f, 19.18f, 20.52f, 21.19f, 20.86f, 20.72f, 20.35f, 20.18f, 20.42f, 20.09f, 20.01f, 20.03f)
                val avgs = listOf(19.18f, 19.44f, 19.82f, 20.01f, 20.11f, 20.14f, 20.12f, 20.11f, 20.10f, 20.09f, 20.09f, 20.09f)
                val volumes = listOf(0.12f, 0.25f, 0.82f, 1.00f, 0.74f, 0.42f, 0.36f, 0.32f, 0.50f, 0.44f, 0.38f, 0.34f)
                val minValue = 17.33f
                val maxValue = 21.19f
                val baseValue = 19.26f
                val range = (maxValue - minValue).coerceAtLeast(0.01f)
                val left = 6.dp.toPx()
                val right = size.width - 6.dp.toPx()
                val chartTop = 10.dp.toPx()
                val chartBottom = size.height * 0.70f
                val volumeTop = chartBottom + 16.dp.toPx()
                val volumeBottom = size.height - 8.dp.toPx()
                val gridColor = Color.White.copy(alpha = 0.12f)
                val baseColor = Color.White.copy(alpha = 0.25f)
                repeat(4) { index ->
                    val y = chartTop + (chartBottom - chartTop) * index / 3f
                    drawLine(gridColor, Offset(left, y), Offset(right, y), 1.dp.toPx(), cap = StrokeCap.Round)
                }
                repeat(5) { index ->
                    val x = left + (right - left) * index / 4f
                    drawLine(gridColor, Offset(x, chartTop), Offset(x, volumeBottom), 1.dp.toPx(), cap = StrokeCap.Round)
                }
                val baseY = chartBottom - (baseValue - minValue) / range * (chartBottom - chartTop)
                drawLine(baseColor, Offset(left, baseY), Offset(right, baseY), 1.dp.toPx(), cap = StrokeCap.Round)
                fun mapPoint(index: Int, value: Float): Offset {
                    val x = left + (right - left) * index / (prices.lastIndex.coerceAtLeast(1)).toFloat()
                    val y = chartBottom - (value - minValue) / range * (chartBottom - chartTop)
                    return Offset(x, y)
                }
                val pricePath = Path()
                prices.forEachIndexed { index, value ->
                    val p = mapPoint(index, value)
                    if (index == 0) pricePath.moveTo(p.x, p.y) else pricePath.lineTo(p.x, p.y)
                }
                val avgPath = Path()
                avgs.forEachIndexed { index, value ->
                    val p = mapPoint(index, value)
                    if (index == 0) avgPath.moveTo(p.x, p.y) else avgPath.lineTo(p.x, p.y)
                }
                drawPath(pricePath, Color.White.copy(alpha = 0.92f), style = Stroke(width = 2.2.dp.toPx(), cap = StrokeCap.Round))
                drawPath(avgPath, Color(0xFFFFC857), style = Stroke(width = 1.7.dp.toPx(), cap = StrokeCap.Round))
                volumes.forEachIndexed { index, volume ->
                    val barWidth = (right - left) / prices.size * 0.52f
                    val x = left + (right - left) * index / (prices.lastIndex.coerceAtLeast(1)).toFloat()
                    val barHeight = (volumeBottom - volumeTop) * volume.coerceIn(0f, 1f)
                    val color = if (index > 0 && prices[index] >= prices[index - 1]) Color(0xFFFF4D5D) else Color(0xFF41D873)
                    drawRoundRect(color.copy(alpha = 0.62f), Offset(x - barWidth / 2f, volumeBottom - barHeight), Size(barWidth, barHeight), CornerRadius(2.dp.toPx(), 2.dp.toPx()))
                }
                val last = mapPoint(prices.lastIndex, prices.last())
                drawCircle(Color(0xFFFF4D5D), radius = 4.6.dp.toPx(), center = last)
                drawCircle(Color.White.copy(alpha = 0.28f), radius = 9.dp.toPx(), center = last, style = Stroke(width = 1.dp.toPx()))
            }
            Row(horizontalArrangement = Arrangement.SpaceBetween, modifier = Modifier.fillMaxWidth()) {
                Text("09:30", color = Color.White.copy(alpha = 0.42f), fontSize = 10.sp, fontWeight = FontWeight.Bold)
                Text("11:30 / 13:00", color = Color.White.copy(alpha = 0.42f), fontSize = 10.sp, fontWeight = FontWeight.Bold)
                Text("15:00", color = Color.White.copy(alpha = 0.42f), fontSize = 10.sp, fontWeight = FontWeight.Bold)
            }
        }
    }
}

