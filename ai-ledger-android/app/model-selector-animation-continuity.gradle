tasks.register('patchModelSelectorAnimationContinuity') {
    doLast {
        def selector = file('src/main/java/com/yuchen/ailedger/ui/UnifiedModelStackSelector.kt')
        if (!selector.exists()) {
            println('UnifiedModelStackSelector.kt not found; skipped animation continuity patch.')
            return
        }
        def text = selector.getText('UTF-8')

        def strengthLine = '''                var strength by remember(model.id) { mutableStateOf(1f) }
'''
        def strengthWithRenderLatch = '''                var strength by remember(model.id) { mutableStateOf(1f) }
                var renderAsFullCard by remember(model.id) { mutableStateOf(expanded) }
'''
        if (text.contains(strengthLine) && !text.contains('var renderAsFullCard by remember(model.id)')) {
            text = text.replace(strengthLine, strengthWithRenderLatch)
            println('Inserted full-card render latch for model selector animation continuity.')
        }

        def targetLine = '''                    val target = if (expanded) 1f else 0f
'''
        def targetWithLatch = '''                    val target = if (expanded) 1f else 0f
                    renderAsFullCard = true
'''
        if (text.contains(targetLine) && !text.contains('renderAsFullCard = true')) {
            text = text.replace(targetLine, targetWithLatch)
            println('Latched full-card rendering before model selector motion starts.')
        }

        def motionEndLine = '''                    motionAnim.animateTo(target, tween(durationMillis = motionDuration, easing = ModelStackTravel))
'''
        def motionEndWithRelease = '''                    motionAnim.animateTo(target, tween(durationMillis = motionDuration, easing = ModelStackTravel))
                    if (!expanded && !selected) renderAsFullCard = false
'''
        if (text.contains(motionEndLine) && !text.contains('if (!expanded && !selected) renderAsFullCard = false')) {
            text = text.replace(motionEndLine, motionEndWithRelease)
            println('Released full-card rendering only after collapse motion completes.')
        }

        def oldNeed = 'val fullCardNeeded = selected || expanded || visualAnim.value > 0.025f || motionAnim.value > 0.025f'
        def newNeed = 'val fullCardNeeded = selected || expanded || renderAsFullCard'
        if (text.contains(oldNeed)) {
            text = text.replace(oldNeed, newNeed)
            println('Removed frame-threshold based render branch switching from model selector.')
        } else if (text.contains(newNeed)) {
            println('Model selector full-card continuity condition already patched.')
        } else {
            println('Model selector fullCardNeeded target not found; skipped continuity condition patch.')
        }

        selector.setText(text, 'UTF-8')
        println('Patched model selector animation continuity: no lightweight/full-card branch switch during motion.')
    }
}

tasks.named('patchModelSelectorAnimationContinuity') {
    def foldedTask = tasks.findByName('patchModelSelectorFoldedStackDetails')
    if (foldedTask != null) dependsOn foldedTask
    def followTask = tasks.findByName('patchModelSelectorStackPressFollow')
    if (followTask != null) dependsOn followTask
}

tasks.named('preBuild') {
    dependsOn tasks.named('patchModelSelectorAnimationContinuity')
}

tasks.matching { it.name == 'compileDebugKotlin' || it.name == 'compileReleaseKotlin' }.configureEach {
    dependsOn tasks.named('patchModelSelectorAnimationContinuity')
}
