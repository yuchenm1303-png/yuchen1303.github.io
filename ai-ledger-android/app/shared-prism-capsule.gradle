tasks.register('patchSharedPrismCapsuleUsage') {
    doLast {
        def prism = file('src/main/java/com/yuchen/ailedger/ui/LightweightPrismCapsule.kt')
        if (prism.exists()) {
            def prismText = prism.getText('UTF-8')
            def prismDefaults = [
                radius: '32.4f', surfaceAlpha: '0.050f', rimAlpha: '0.78f', rimWidth: '0.52f',
                topHighlight: '0.075f', topHighlightHeight: '0.16f', innerRimAlpha: '0.45f',
                bottomDepth: '0.018f', cornerCatchlight: '0.42f', pressGlow: '0.55f',
                pressEdgeBoost: '0.70f', pressSweep: '0.70f', pressDarken: '0.22f',
                pressElasticity: '1.20f', rainbowRimAlpha: '0.70f', rainbowRimWidth: '1.40f',
                rainbowPressEdge: '0.80f', rainbowSweepAlpha: '0.80f', rainbowCornerAlpha: '0.38f',
                rainbowSaturation: '1.00f'
            ]
            prismDefaults.each { name, value ->
                prismText = prismText.replaceFirst(/val ${name}: Float = [0-9.]+f?,?/, "val ${name}: Float = ${value}${name == 'rainbowSaturation' ? '' : ','}")
            }
            prism.setText(prismText, 'UTF-8')
            println('Synced shared prism capsule defaults when matching targets exist.')
        } else {
            println('LightweightPrismCapsule.kt not found; skipped shared prism defaults sync.')
        }

        def lab = file('src/main/java/com/yuchen/ailedger/ui/GlassDebugFloatingPanel.kt')
        if (lab.exists()) {
            def labText = lab.getText('UTF-8')
            if (labText.contains('ModelCardGlassLab(')) {
                println('GlassDebugFloatingPanel now uses the model-card lab panel; skipped legacy lightweight preview patch.')
            } else if (labText.contains('LightweightPrismCapsuleLabPreview(')) {
                println('Lightweight glass lab already uses shared prism capsule preview.')
            } else {
                def previewStart = labText.indexOf('@Composable\nprivate fun LightweightGlassPreview(')
                def previewEnd = labText.indexOf('private fun Modifier.lightweightGlassLabSurface', previewStart)
                if (previewStart >= 0 && previewEnd > previewStart) {
                    def newPreviewBlock = '''@Composable
private fun LightweightGlassPreview(
    radius: Float,
    surfaceAlpha: Float,
    rimAlpha: Float,
    rimWidth: Float,
    topHighlight: Float,
    topHighlightHeight: Float,
    innerRimAlpha: Float,
    bottomDepth: Float,
    cornerCatchlight: Float,
    pressGlow: Float,
    pressEdgeBoost: Float,
    pressSweep: Float,
    pressDarken: Float,
    pressElasticity: Float,
    rainbowRimAlpha: Float,
    rainbowRimWidth: Float,
    rainbowPressEdge: Float,
    rainbowSweepAlpha: Float,
    rainbowCornerAlpha: Float,
    rainbowSaturation: Float
) {
    val spec = LightweightPrismCapsuleSpec(
        radius = radius,
        surfaceAlpha = surfaceAlpha,
        rimAlpha = rimAlpha,
        rimWidth = rimWidth,
        topHighlight = topHighlight,
        topHighlightHeight = topHighlightHeight,
        innerRimAlpha = innerRimAlpha,
        bottomDepth = bottomDepth,
        cornerCatchlight = cornerCatchlight,
        pressGlow = pressGlow,
        pressEdgeBoost = pressEdgeBoost,
        pressSweep = pressSweep,
        pressDarken = pressDarken,
        pressElasticity = pressElasticity,
        rainbowRimAlpha = rainbowRimAlpha,
        rainbowRimWidth = rainbowRimWidth,
        rainbowPressEdge = rainbowPressEdge,
        rainbowSweepAlpha = rainbowSweepAlpha,
        rainbowCornerAlpha = rainbowCornerAlpha,
        rainbowSaturation = rainbowSaturation
    )
    LightweightPrismCapsuleLabPreview(spec = spec)
}

'''
                    labText = labText.substring(0, previewStart) + newPreviewBlock + labText.substring(previewEnd)
                    lab.setText(labText, 'UTF-8')
                    println('Replaced legacy lightweight preview with shared prism capsule sample.')
                } else {
                    println('Legacy LightweightGlassPreview block not present; skipped safely.')
                }
            }
        } else {
            println('GlassDebugFloatingPanel.kt not found; skipped lab preview patch.')
        }

        def assistantHome = file('src/main/java/com/yuchen/ailedger/ui/AssistantHomePolished.kt')
        if (assistantHome.exists()) {
            def homeText = assistantHome.getText('UTF-8')
            def oldScroll = '''    val listState = rememberLazyListState()
    LaunchedEffect(state.messages.size, state.isSending) {
        if (state.messages.isNotEmpty()) listState.animateScrollToItem(state.messages.lastIndex)
    }
'''
            def newScroll = '''    val listState = rememberLazyListState()
    val lastMessageId = state.messages.lastOrNull()?.id
    LaunchedEffect(lastMessageId) {
        if (lastMessageId != null) {
            delay(60)
            listState.scrollToItem(state.messages.lastIndex)
        }
    }
'''
            if (homeText.contains(oldScroll)) {
                homeText = homeText.replace(oldScroll, newScroll)
                println('Patched AssistantHomePolished chat autoscroll to follow only new message ids.')
            } else if (homeText.contains(newScroll)) {
                println('AssistantHomePolished chat autoscroll already patched.')
            } else {
                println('AssistantHomePolished chat autoscroll target not found; skipped to avoid overriding concurrent UI changes.')
            }

            def oldFocusPop = '''    val focusPop by animateFloatAsState(
        targetValue = if (text.isNotBlank()) 1.012f else 1f,
        animationSpec = spring(dampingRatio = 0.72f, stiffness = Spring.StiffnessMediumLow),
        label = "composer-pop"
    )
    GlassPanel(state.quality, state.glassIntensity, state.motionIntensity, 999, modifier.height(48.dp).graphicsLayer { scaleX = focusPop; scaleY = focusPop }, GlassRole.Card) {
'''
            def newFocusPop = '''    GlassPanel(state.quality, state.glassIntensity, state.motionIntensity, 999, modifier.height(48.dp), GlassRole.Card) {
'''
            if (homeText.contains(oldFocusPop)) {
                homeText = homeText.replace(oldFocusPop, newFocusPop)
                println('Removed composer scale pop that caused send-time layout jitter.')
            } else if (homeText.contains(newFocusPop)) {
                println('AssistantHomePolished composer scale pop already removed.')
            } else {
                println('AssistantHomePolished composer focus-pop target not found; skipped to avoid overriding concurrent UI changes.')
            }

            def oldEnabled = '''                enabled = !state.isSending,
'''
            def newEnabled = '''                enabled = true,
                readOnly = state.isSending,
'''
            if (homeText.contains(oldEnabled)) {
                homeText = homeText.replace(oldEnabled, newEnabled)
                println('Kept composer focused during send by using readOnly instead of disabled.')
            } else if (homeText.contains(newEnabled)) {
                println('AssistantHomePolished composer focus behavior already patched.')
            } else {
                println('AssistantHomePolished composer enabled target not found; skipped to avoid overriding concurrent UI changes.')
            }
            assistantHome.setText(homeText, 'UTF-8')
        } else {
            println('AssistantHomePolished.kt not found; skipped send jitter patch.')
        }
    }
}

tasks.register('patchModelSelectorGeminiBelowMistral') {
    doLast {
        def selector = file('src/main/java/com/yuchen/ailedger/ui/UnifiedModelStackSelector.kt')
        if (!selector.exists()) {
            println('UnifiedModelStackSelector.kt not found; skipped model selector layout patch.')
            return
        }
        def text = selector.getText('UTF-8')

        def layoutSlotLine = '''                val layoutSlot = when (model) {
                    ChatModel.Auto -> 0
                    ChatModel.Kimi -> 2
                    ChatModel.Workers -> 4
                    ChatModel.Mistral -> 3
                    ChatModel.Gemini -> 5
                }
'''
        if (!text.contains('ChatModel.Gemini -> 5')) {
            def themeLine = '''                val theme = remember(model) { model.modelCardPrismTheme() }
'''
            if (text.contains(themeLine)) {
                text = text.replace(themeLine, themeLine + layoutSlotLine)
            } else {
                throw new GradleException('Model selector theme line not found for layout slot insertion.')
            }
        }

        def rememberOldA = 'val geometry = remember(density.density, collapsedWidth, halfWidth, selectedModel, index, stackRank) {'
        def rememberOldB = 'val geometry = remember(density.density, maxWidth, selectedModel, index, stackRank) {'
        def rememberNew = 'val geometry = remember(density.density, collapsedWidth, halfWidth, selectedModel, layoutSlot, stackRank) {'
        if (text.contains(rememberOldA)) {
            text = text.replace(rememberOldA, rememberNew)
        } else if (text.contains(rememberOldB)) {
            text = text.replace(rememberOldB, rememberNew)
        } else if (!text.contains(rememberNew)) {
            throw new GradleException('Model selector geometry remember target not found.')
        }

        def expandedXOld = 'val expandedX = if (index % 2 == 1) halfWidth + gap else 0.dp'
        def expandedYOld = 'val expandedY = rowStep * (index / 2).toFloat()'
        def expandedXNew = 'val expandedX = if (layoutSlot % 2 == 1) halfWidth + gap else 0.dp'
        def expandedYNew = 'val expandedY = rowStep * (layoutSlot / 2).toFloat()'
        if (text.contains(expandedXOld)) text = text.replace(expandedXOld, expandedXNew)
        if (text.contains(expandedYOld)) text = text.replace(expandedYOld, expandedYNew)

        selector.setText(text, 'UTF-8')
        println('Patched model selector layout: Gemini is placed below Mistral on the right column.')
    }
}

tasks.register('patchModelSelectorLightLayerMerge') {
    doLast {
        def selector = file('src/main/java/com/yuchen/ailedger/ui/UnifiedModelStackSelector.kt')
        if (!selector.exists()) {
            println('UnifiedModelStackSelector.kt not found; skipped model selector light-layer patch.')
            return
        }
        def text = selector.getText('UTF-8')

        if (!text.contains('val pressMaterial =') && text.contains('val pressureBend =') && text.contains('val prismField =')) {
            def pressureLine = '''    val pressureBend = Brush.radialGradient(listOf(Color.Transparent, theme.deep.copy(alpha = 0.092f * compression), Color(0xFF00040D).copy(alpha = 0.112f * compression), Color.Transparent), materialCenter, maxOf(size.width, size.height) * (0.66f + 0.08f * compression))
'''
            def prismLine = '''    val prismField = Brush.linearGradient(listOf(Color.Transparent, theme.prismA.copy(alpha = 0.038f * optics), theme.main.copy(alpha = (0.060f + 0.084f * themeBoost) * optics), theme.prismB.copy(alpha = 0.030f * optics), theme.gold.copy(alpha = 0.026f * optics), Color.Transparent), Offset(size.width * -0.16f, size.height * -0.12f), Offset(size.width * 1.14f, size.height * 1.10f))
'''
            def pressMaterialLine = '''    val pressMaterial = Brush.radialGradient(listOf(Color.Transparent, theme.deep.copy(alpha = 0.080f * compression), theme.main.copy(alpha = (0.050f + 0.060f * themeBoost) * optics), theme.prismA.copy(alpha = 0.032f * optics), theme.gold.copy(alpha = 0.020f * optics), Color.Transparent), materialCenter, maxOf(size.width, size.height) * (0.72f + 0.12f * compression))
'''
            if (text.contains(pressureLine) && text.contains(prismLine)) {
                text = text.replace(pressureLine + prismLine, pressMaterialLine)
            } else {
                println('Model selector press light exact definitions not found; skipped press light merge.')
            }
        }

        if (!text.contains('val combinedRim =') && text.contains('val outerRim =') && text.contains('val stackRim =')) {
            def outerLine = '''    val outerRim = Brush.linearGradient(listOf(theme.bright.copy(alpha = 0.260f * rimPower * s(style.outerRim)), Color(0xFFF1FFFF).copy(alpha = 0.082f * rimPower * s(style.outerRim)), theme.main.copy(alpha = (0.150f + 0.170f * themeBoost) * rimPower * s(style.outerRim)), Color.Transparent, theme.deep.copy(alpha = 0.225f * rimPower * s(style.bottomShadow)), theme.prismC.copy(alpha = 0.072f * rimPower * s(style.outerRim))), Offset.Zero, Offset(size.width, size.height))
'''
            def stackLine = '''    val stackRim = Brush.linearGradient(listOf(Color.Transparent, theme.prismC.copy(alpha = 0.040f * rimPower * stackBoost), theme.main.copy(alpha = (0.120f + 0.110f * themeBoost) * rimPower * stackBoost), theme.bright.copy(alpha = 0.330f * rimPower * stackBoost)), Offset(size.width * 0.64f, size.height * 0.24f), Offset(size.width, size.height))
'''
            def combinedLine = '''    val combinedRim = Brush.linearGradient(listOf(theme.bright.copy(alpha = 0.260f * rimPower * s(style.outerRim) + 0.070f * rimPower * stackBoost), Color(0xFFF1FFFF).copy(alpha = 0.082f * rimPower * s(style.outerRim)), theme.main.copy(alpha = (0.150f + 0.170f * themeBoost) * rimPower * s(style.outerRim) + (0.112f + 0.092f * themeBoost) * rimPower * stackBoost), Color.Transparent, theme.deep.copy(alpha = 0.225f * rimPower * s(style.bottomShadow)), theme.prismC.copy(alpha = 0.072f * rimPower * s(style.outerRim) + 0.090f * rimPower * stackBoost)), Offset.Zero, Offset(size.width, size.height))
'''
            if (text.contains(outerLine) && text.contains(stackLine)) {
                text = text.replace(outerLine, combinedLine)
                text = text.replace(stackLine, '')
            } else {
                println('Model selector rim exact definitions not found; skipped rim merge.')
            }
        }

        def oldPressDraw = '''        if (press > 0.001f) { drawRoundRect(pressureBend, size = size, cornerRadius = corner, blendMode = BlendMode.Multiply); drawRoundRect(prismField, size = size, cornerRadius = corner, blendMode = BlendMode.Screen) }
'''
        def newPressDraw = '''        if (press > 0.001f) drawRoundRect(pressMaterial, size = size, cornerRadius = corner, blendMode = BlendMode.Screen)
'''
        if (text.contains(oldPressDraw)) text = text.replace(oldPressDraw, newPressDraw)

        def oldRimDraw = '''        drawRoundRect(brush = outerRim, topLeft = Offset(0.62.dp.toPx(), 0.62.dp.toPx()), size = Size(size.width - 1.24.dp.toPx(), size.height - 1.24.dp.toPx()), cornerRadius = corner, style = Stroke(0.96.dp.toPx()), blendMode = BlendMode.Screen)
        if (collapsedReveal > 0.001f) drawRoundRect(brush = stackRim, topLeft = Offset(0.62.dp.toPx(), 0.62.dp.toPx()), size = Size(size.width - 1.24.dp.toPx(), size.height - 1.24.dp.toPx()), cornerRadius = corner, style = Stroke(1.18.dp.toPx()), blendMode = BlendMode.Screen)
'''
        def newRimDraw = '''        drawRoundRect(brush = combinedRim, topLeft = Offset(0.62.dp.toPx(), 0.62.dp.toPx()), size = Size(size.width - 1.24.dp.toPx(), size.height - 1.24.dp.toPx()), cornerRadius = corner, style = Stroke(0.96.dp.toPx() + 0.20.dp.toPx() * collapsedReveal), blendMode = BlendMode.Screen)
'''
        if (text.contains(oldRimDraw)) text = text.replace(oldRimDraw, newRimDraw)

        selector.setText(text, 'UTF-8')
        println('Patched model selector light layers: press material and rim layers are merged when source matches.')
    }
}

tasks.named('preBuild') {
    dependsOn tasks.named('patchSharedPrismCapsuleUsage')
    dependsOn tasks.named('patchModelSelectorGeminiBelowMistral')
    dependsOn tasks.named('patchModelSelectorLightLayerMerge')
}
