        }

        def home = file('src/main/java/com/yuchen/ailedger/ui/AssistantHomePolished.kt')
        def text = home.getText('UTF-8')

        if (!text.contains('val modelRowCount = ((ChatModel.entries.size + 1) / 2).coerceAtLeast(1)')) {
            text = text.replaceFirst(
                /val panelHeight by animateDpAsState\(\n\s*targetValue = if \(expanded\) 224\.dp else 58\.dp,/, 
                '''val modelRowCount = ((ChatModel.entries.size + 1) / 2).coerceAtLeast(1)
    val expandedPanelHeight = (64 + 74 * (modelRowCount - 1)).dp
    val panelHeight by animateDpAsState(
        targetValue = if (expanded) expandedPanelHeight else 58.dp,'''
            )
        }
        text = text.replace(
            '''        onSelected = { model ->
            if (!state.isSending) {
                onModelSelected(model)
                expanded = false
            }
        }
''',
            '''        onSelected = { model ->
            if (!state.isSending) {
                onModelSelected(model)
            }
        }
'''
        )

        def selectorStart = text.indexOf('@Composable\nprivate fun ModelStackSelector(')
        def selectorEnd = text.indexOf('@Composable\nprivate fun ModelStackCard(', selectorStart)
