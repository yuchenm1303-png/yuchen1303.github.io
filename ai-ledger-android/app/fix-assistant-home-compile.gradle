def fixAssistantHomeCompile = tasks.register('fixAssistantHomeCompile') {
    doLast {
        def home = file('src/main/java/com/yuchen/ailedger/ui/AssistantHomePolished.kt')
        def text = home.getText('UTF-8')

        def oldSignature = '''fun AssistantScreenV2(
    state: AssistantUiState,
    onComposerChange: (String) -> Unit,
    onSend: () -> Unit,
    onDraftCommand: (String) -> Unit,
    onModelSelected: (ChatModel) -> Unit,
    onPickImage: () -> Unit,
    onOpenTools: () -> Unit,
    onOpenSettings: () -> Unit,
    onToggleOnline: () -> Unit
) {
'''
        def newSignature = '''fun AssistantScreenV2(
    state: AssistantUiState,
    onComposerChange: (String) -> Unit,
    onSend: () -> Unit,
    onDraftCommand: (String) -> Unit,
    onModelSelected: (ChatModel) -> Unit,
    onPickImage: () -> Unit,
    onOpenTools: () -> Unit,
    onOpenSettings: () -> Unit,
    onToggleOnline: () -> Unit,
    onCopyMessage: (String) -> Unit,
    onRetryMessage: (String) -> Unit
) {
'''
        if (text.contains(oldSignature)) {
            text = text.replace(oldSignature, newSignature)
            println('Added onCopyMessage/onRetryMessage parameters to AssistantScreenV2.')
        } else if (text.contains('onCopyMessage: (String) -> Unit') && text.contains('onRetryMessage: (String) -> Unit')) {
            println('AssistantScreenV2 callback parameters already exist.')
        } else {
            throw new GradleException('AssistantScreenV2 signature target not found.')
        }

        def oldOpenSettingsUse = '''    onOpenTools.hashCode()
    onOpenSettings.hashCode()
}
'''
        def newOpenSettingsUse = '''    onOpenTools.hashCode()
    onOpenSettings.hashCode()
    onCopyMessage.hashCode()
    onRetryMessage.hashCode()
}
'''
        if (text.contains(oldOpenSettingsUse)) {
            text = text.replace(oldOpenSettingsUse, newOpenSettingsUse)
            println('Marked copy/retry callbacks as intentionally retained.')
        } else if (text.contains('onCopyMessage.hashCode()') && text.contains('onRetryMessage.hashCode()')) {
            println('Copy/retry callback placeholders already exist.')
        } else {
            throw new GradleException('AssistantScreenV2 callback placeholder block not found.')
        }

        text = text.replace('''                enabled = true,
                readOnly = state.isSending,
''', '''                enabled = !state.isSending,
''')
        text = text.replace('''                enabled = true,
                readOnly = state.isSending,
''', '''                enabled = !state.isSending,
''')
        text = text.replace('''                readOnly = state.isSending,
''', '')
        text = text.replace('''                readOnly = state.isSending,
''', '')
        text = text.replace('readOnly = state.isSending,', '')

        def oldComposerBarV2 = '''@Composable
private fun ComposerBarV2(state: AssistantUiState, onComposerChange: (String) -> Unit, onSend: () -> Unit, onPickImage: () -> Unit) {
    val sendAction = if (state.isSending) ({}) else onSend
'''
        def newComposerBarV2 = '''@Composable
private fun ComposerBarV2(state: AssistantUiState, onComposerChange: (String) -> Unit, onSend: () -> Unit, onPickImage: () -> Unit) {
    val view = androidx.compose.ui.platform.LocalView.current
    val inputMethodManager = remember(view) {
        view.context.getSystemService(android.content.Context.INPUT_METHOD_SERVICE) as? android.view.inputmethod.InputMethodManager
    }
    val sendAction = if (state.isSending) ({}) else {
        {
            if (state.composerText.isNotBlank()) {
                inputMethodManager?.hideSoftInputFromWindow(view.windowToken, 0)
            }
            onSend()
        }
    }
'''
        if (text.contains(oldComposerBarV2)) {
            text = text.replace(oldComposerBarV2, newComposerBarV2)
            println('ComposerBarV2 now hides IME directly without clearing focus.')
        } else if (text.contains('hideSoftInputFromWindow(view.windowToken, 0)')) {
            println('ComposerBarV2 IME hide behavior already exists.')
        } else {
            throw new GradleException('ComposerBarV2 sendAction target not found for IME hide patch.')
        }

        def oldComposerInputV2 = '''                onValueChange = onTextChange,
                singleLine = true,
                enabled = !state.isSending,
'''
        def newComposerInputV2 = '''                onValueChange = { if (!state.isSending) onTextChange(it) },
                singleLine = true,
                enabled = true,
'''
        if (text.contains(oldComposerInputV2)) {
            text = text.replace(oldComposerInputV2, newComposerInputV2)
            println('ComposerInputV2 stays enabled while sending, avoiding abrupt focus loss.')
        } else if (text.contains('onValueChange = { if (!state.isSending) onTextChange(it) }') && text.contains('enabled = true,')) {
            println('ComposerInputV2 stable focus behavior already exists.')
        } else {
            throw new GradleException('ComposerInputV2 focus-stability target not found.')
        }

        home.setText(text, 'UTF-8')

        def verified = home.getText('UTF-8')
        if (verified.contains('readOnly')) {
            throw new GradleException('AssistantHomePolished still contains readOnly after cleanup.')
        }
        if (!verified.contains('hideSoftInputFromWindow(view.windowToken, 0)')) {
            throw new GradleException('AssistantHomePolished IME hide behavior was not applied.')
        }
        if (!verified.contains('onValueChange = { if (!state.isSending) onTextChange(it) }')) {
            throw new GradleException('AssistantHomePolished input focus stability patch was not applied.')
        }
        println('AssistantHomePolished input IME behavior verified: direct hide, no disable-driven focus drop.')
    }
}

tasks.named('preBuild') {
    dependsOn fixAssistantHomeCompile
}

tasks.matching { it.name == 'compileDebugKotlin' || it.name == 'compileReleaseKotlin' }.configureEach {
    dependsOn fixAssistantHomeCompile
}
