def fixAssistantHomeCompile = tasks.register('fixAssistantHomeCompile') {
    doLast {
        def home = file('src/main/java/com/yuchen/ailedger/ui/AssistantHomePolished.kt')
        def text = home.getText('UTF-8')

        def oldSignature = '''fun AssistantScreenV2(
    state: AssistantUiState,
    onComposerChange: (String) -> Unit,
    onSend: () -> Unit,
    onDraftCommand: (String) -> Unit,
    onModelSelected: (ChatModel) -> Unit,
    onPickImage: () -> Unit,
    onOpenTools: () -> Unit,
    onOpenSettings: () -> Unit,
    onToggleOnline: () -> Unit
) {
'''
        def newSignature = '''fun AssistantScreenV2(
    state: AssistantUiState,
    onComposerChange: (String) -> Unit,
    onSend: () -> Unit,
    onDraftCommand: (String) -> Unit,
    onModelSelected: (ChatModel) -> Unit,
    onPickImage: () -> Unit,
    onOpenTools: () -> Unit,
    onOpenSettings: () -> Unit,
    onToggleOnline: () -> Unit,
    onCopyMessage: (String) -> Unit,
    onRetryMessage: (String) -> Unit
) {
'''
        if (text.contains(oldSignature)) {
            text = text.replace(oldSignature, newSignature)
            println('Added onCopyMessage/onRetryMessage parameters to AssistantScreenV2.')
        } else if (text.contains('onCopyMessage: (String) -> Unit') && text.contains('onRetryMessage: (String) -> Unit')) {
            println('AssistantScreenV2 callback parameters already exist.')
        } else {
            throw new GradleException('AssistantScreenV2 signature target not found.')
        }

        if (!text.contains('entranceKey: Int = 0')) {
            text = text.replace(
                'fun AssistantScreenV2(\n    state: AssistantUiState,\n',
                'fun AssistantScreenV2(\n    state: AssistantUiState,\n    entranceKey: Int = 0,\n'
            )
            println('Added entranceKey parameter to AssistantScreenV2.')
        } else {
            println('AssistantScreenV2 entranceKey parameter already exists.')
        }

        def entranceCalls = [
            'AssistantEntrance(delayMs = 0': 'AssistantEntrance(entranceKey = entranceKey, delayMs = 0',
            'AssistantEntrance(delayMs = 46': 'AssistantEntrance(entranceKey = entranceKey, delayMs = 46',
            'AssistantEntrance(delayMs = 92': 'AssistantEntrance(entranceKey = entranceKey, delayMs = 92',
            'AssistantEntrance(delayMs = 138': 'AssistantEntrance(entranceKey = entranceKey, delayMs = 138'
        ]
        entranceCalls.each { oldCall, newCall ->
            if (text.contains(oldCall)) text = text.replace(oldCall, newCall)
        }

        def oldEntranceSignature = '''private fun AssistantEntrance(
    delayMs: Long,
'''
        def newEntranceSignature = '''private fun AssistantEntrance(
    entranceKey: Int,
    delayMs: Long,
'''
        if (text.contains(oldEntranceSignature)) {
            text = text.replace(oldEntranceSignature, newEntranceSignature)
            println('Added entranceKey to AssistantEntrance.')
        } else if (text.contains('private fun AssistantEntrance(\n    entranceKey: Int,')) {
            println('AssistantEntrance entranceKey already exists.')
        } else {
            throw new GradleException('AssistantEntrance signature target not found.')
        }

        def oldEntranceEffect = '''    var visible by remember { mutableStateOf(false) }
    LaunchedEffect(Unit) {
        if (delayMs > 0L) delay(delayMs)
        visible = true
    }
'''
        def newEntranceEffect = '''    var visible by remember(entranceKey) { mutableStateOf(false) }
    LaunchedEffect(entranceKey) {
        visible = false
        delay(16)
        if (delayMs > 0L) delay(delayMs)
        visible = true
    }
'''
        if (text.contains(oldEntranceEffect)) {
            text = text.replace(oldEntranceEffect, newEntranceEffect)
            println('Forced AssistantEntrance to keep one frame hidden before playing enter animation.')
        } else if (text.contains('remember(entranceKey)') && text.contains('LaunchedEffect(entranceKey)')) {
            println('AssistantEntrance keyed enter animation already patched.')
        } else {
            throw new GradleException('AssistantEntrance effect target not found.')
        }

        def oldOpenSettingsUse = '''    onOpenTools.hashCode()
    onOpenSettings.hashCode()
}
'''
        def newOpenSettingsUse = '''    onOpenTools.hashCode()
    onOpenSettings.hashCode()
    onCopyMessage.hashCode()
    onRetryMessage.hashCode()
}
'''
        if (text.contains(oldOpenSettingsUse)) {
            text = text.replace(oldOpenSettingsUse, newOpenSettingsUse)
            println('Marked copy/retry callbacks as intentionally retained.')
        } else if (text.contains('onCopyMessage.hashCode()') && text.contains('onRetryMessage.hashCode()')) {
            println('Copy/retry callback placeholders already exist.')
        } else {
            throw new GradleException('AssistantScreenV2 callback placeholder block not found.')
        }

        // Keep BasicTextField enabled during send so it does not lose focus and collapse/re-open the IME.
        // Some Compose versions used by this workflow do not accept readOnly on BasicTextField,
        // so sending-state edits are blocked by guarding onValueChange instead of disabling the field.
        text = text.replace('''                enabled = true,
                readOnly = state.isSending,
''', '''                enabled = true,
''')
        text = text.replace('''                readOnly = state.isSending,
''', '')
        text = text.replace('readOnly = state.isSending,', '')
        text = text.replace('''                enabled = !state.isSending,
''', '''                enabled = true,
''')
        text = text.replace('''                onValueChange = onTextChange,
''', '''                onValueChange = { value -> if (!state.isSending) onTextChange(value) },
''')
        println('Kept composer enabled during send and guarded text changes to stabilize IME focus.')

        def oldModelNetworkRow = '''    Row(
        modifier = Modifier.fillMaxWidth().height(panelHeight),
        verticalAlignment = Alignment.CenterVertically,
        horizontalArrangement = Arrangement.spacedBy(10.dp)
    ) {
        UnifiedParentModelStackSelector(
            state = state,
            expanded = expanded,
            modifier = Modifier.weight(1f).height(panelHeight),
            onToggleExpanded = { if (!state.isSending) expanded = !expanded },
            onSelected = { model ->
                if (!state.isSending) {
                    onModelSelected(model)
                    expanded = false
                }
            }
        )
        Box(
            modifier = Modifier.weight(0.54f).height(panelHeight),
            contentAlignment = Alignment.Center
        ) {
            NetworkDropletCapsule(
                state = state,
                modifier = Modifier.fillMaxWidth(),
                enabled = !state.isSending,
                onClick = onToggleOnline
            )
        }
    }
'''
        def newModelNetworkOverlay = '''    Box(
        modifier = Modifier.fillMaxWidth().height(panelHeight)
    ) {
        UnifiedParentModelStackSelector(
            state = state,
            expanded = expanded,
            modifier = Modifier.fillMaxWidth().height(panelHeight),
            onToggleExpanded = { if (!state.isSending) expanded = !expanded },
            onSelected = { model ->
                if (!state.isSending) {
                    onModelSelected(model)
                    expanded = false
                }
            }
        )
        NetworkDropletCapsule(
            state = state,
            modifier = Modifier
                .align(Alignment.TopEnd)
                .fillMaxWidth(0.34f)
                .height(58.dp),
            enabled = !state.isSending,
            onClick = onToggleOnline
        )
    }
'''
        if (text.contains(oldModelNetworkRow)) {
            text = text.replace(oldModelNetworkRow, newModelNetworkOverlay)
            println('Restored full-width model selector strip and pinned network droplet in the reserved right gap.')
        } else if (text.contains('modifier = Modifier.fillMaxWidth().height(panelHeight)') && text.contains('.align(Alignment.TopEnd)') && text.contains('.fillMaxWidth(0.34f)')) {
            println('Model/network overlay layout already patched.')
        } else {
            println('Model/network row target not found; skipped layout patch to avoid overriding concurrent changes.')
        }

        home.setText(text, 'UTF-8')

        def verified = home.getText('UTF-8')
        if (!verified.contains('entranceKey: Int = 0') || !verified.contains('LaunchedEffect(entranceKey)')) {
            throw new GradleException('Assistant entrance animation key patch was not applied.')
        }
        if (verified.contains('readOnly')) {
            throw new GradleException('AssistantHomePolished still contains readOnly after cleanup.')
        }
        if (verified.contains('enabled = !state.isSending')) {
            throw new GradleException('AssistantHomePolished still disables the composer during send.')
        }
        if (!verified.contains('onValueChange = { value -> if (!state.isSending) onTextChange(value) }')) {
            throw new GradleException('AssistantHomePolished composer onValueChange guard was not applied.')
        }
        println('AssistantHomePolished compile compatibility verified: composer stays enabled and entrance animation is keyed.')
    }
}

tasks.named('fixAssistantHomeCompile') {
    def sharedTask = tasks.findByName('patchSharedPrismCapsuleUsage')
    if (sharedTask != null) dependsOn sharedTask
    def bubbleTask = tasks.findByName('patchAssistantChatBubblePolish')
    if (bubbleTask != null) dependsOn bubbleTask
}

tasks.named('preBuild') {
    dependsOn fixAssistantHomeCompile
}

tasks.matching { it.name == 'compileDebugKotlin' || it.name == 'compileReleaseKotlin' }.configureEach {
    dependsOn fixAssistantHomeCompile
}
