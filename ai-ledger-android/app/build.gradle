plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.yuchen.ailedger'
    compileSdk 36

    defaultConfig {
        applicationId 'com.yuchen.ailedger'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0-native-shell'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

apply from: 'chat-bubble-polish.gradle'
apply from: 'stop-generation-signature-fix.gradle'
apply from: 'shared-prism-capsule.gradle'
apply from: 'fix-assistant-home-compile.gradle'
apply from: 'model-selector-folded-stack.gradle'
apply from: 'model-selector-stack-press-follow.gradle'
apply from: 'model-selector-animation-continuity.gradle'
apply from: 'model-selector-animation-tempo.gradle'
apply from: 'model-network-original-layout.gradle'
apply from: 'reuse-lab-droplet.gradle'
apply from: 'network-droplet-surface-text.gradle'
apply from: 'droplet-continuous-motion-tuning.gradle'
apply from: 'stock-market-entry.gradle'
apply from: 'stock-market-icon-fix.gradle'
apply from: 'stock-market-a-share.gradle'
apply from: 'stock-market-pro-detail.gradle'
