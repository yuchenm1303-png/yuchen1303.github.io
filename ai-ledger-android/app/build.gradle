plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.yuchen.ailedger'
    compileSdk 36

    defaultConfig {
        applicationId 'com.yuchen.ailedger.compose'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0-compose-preview'
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    jvmToolchain(17)
}

apply from: 'chat-bubble-polish.gradle'

def patchPolishedOnlineDroplet = tasks.register('patchPolishedOnlineDroplet') {
    doLast {
        def home = file('src/main/java/com/yuchen/ailedger/ui/AssistantHomePolished.kt')
        def text = home.getText('UTF-8')
        def oldBlock = '''@Composable
private fun NetworkChipV2(state: AssistantUiState, modifier: Modifier, onClick: () -> Unit) {
    val accent = if (state.onlineEnabled) Color(0xFF8DF9EA) else Color(0xFF9EB7FF)
    PressableGlass(state.quality, state.glassIntensity * 0.95f, state.motionIntensity, 999, modifier.height(48.dp), GlassRole.Chip, onClick = onClick) {
        Row(
            Modifier.fillMaxSize().padding(horizontal = 12.dp),
            verticalAlignment = Alignment.CenterVertically,
            horizontalArrangement = Arrangement.spacedBy(8.dp)
        ) {
            PulseDotV2(active = state.onlineEnabled || state.isSending, color = accent)
            Column(Modifier.weight(1f), verticalArrangement = Arrangement.Center) {
                Text("联网", color = Color.White.copy(alpha = 0.48f), fontSize = 10.sp, fontWeight = FontWeight.Bold, maxLines = 1)
                Text(if (state.onlineEnabled) "已开启" else "已关闭", color = Color.White.copy(alpha = 0.94f), fontSize = 13.sp, fontWeight = FontWeight.ExtraBold, maxLines = 1)
            }
        }
    }
}
'''
        def newBlock = '''@Composable
private fun NetworkChipV2(state: AssistantUiState, modifier: Modifier, onClick: () -> Unit) {
    NetworkDropletCapsule(
        state = state,
        modifier = modifier,
        enabled = !state.isSending,
        onClick = onClick
    )
}
'''
        if (text.contains(newBlock)) {
            println('NetworkChipV2 already uses NetworkDropletCapsule.')
        } else if (text.contains(oldBlock)) {
            home.setText(text.replace(oldBlock, newBlock), 'UTF-8')
            println('Patched AssistantHomePolished NetworkChipV2 to use NetworkDropletCapsule.')
        } else if (text.contains('private fun ModelStackSelector(') || text.contains('private fun ModelStackCard(')) {
            println('AssistantHomePolished now uses stacked model cards; skipped legacy NetworkChipV2 droplet replacement.')
        } else {
            throw new GradleException('Target NetworkChipV2 block was not found; refusing to build stale online toggle.')
        }

        text = home.getText('UTF-8')
        def oldHeroActions = '''        Row(horizontalArrangement = Arrangement.spacedBy(7.dp)) {
            RoundIconButtonV2("▦", state, onClick = onOpenTools)
            RoundIconButtonV2("⚙", state, onClick = onOpenSettings)
        }
'''
        if (text.contains(oldHeroActions)) {
            home.setText(text.replace(oldHeroActions, ''), 'UTF-8')
            println('Removed top-right hero shortcut buttons from AssistantHomePolished.')
        } else if (text.contains('RoundIconButtonV2("▦", state, onClick = onOpenTools)') || text.contains('RoundIconButtonV2("⚙", state, onClick = onOpenSettings)')) {
            throw new GradleException('AssistantHeroV2 shortcut button block changed; refusing to leave partial top-right buttons.')
        } else {
            println('Top-right hero shortcut buttons already removed.')
        }

        def droplet = file('src/main/java/com/yuchen/ailedger/ui/NetworkDropletCapsule.kt')
        def dropletText = droplet.getText('UTF-8')
        def oldHeight = 'Box(modifier = modifier.height(68.dp), contentAlignment = Alignment.Center)'
        def newHeight = 'Box(modifier = modifier.height(54.dp), contentAlignment = Alignment.Center)'
        if (dropletText.contains(oldHeight)) {
            dropletText = dropletText.replace(oldHeight, newHeight)
            println('Shrunk online sample droplet from 68dp to 54dp.')
        } else if (dropletText.contains(newHeight)) {
            println('Online sample droplet already uses 54dp height.')
        } else {
            throw new GradleException('Target NetworkDropletCapsule height block was not found.')
        }

        def oldBreath = 'breathAnim.animateTo(Random.nextFloat(), tween(950 + Random.nextInt(850), easing = FastOutSlowInEasing))'
        def newBreath = 'breathAnim.animateTo(0.36f + Random.nextFloat() * 0.38f, tween(1600 + Random.nextInt(1400), easing = FastOutSlowInEasing))'
        def oldDrift = 'driftAnim.animateTo(Random.nextFloat() * 0.34f - 0.17f, tween(1200 + Random.nextInt(1300), easing = FastOutSlowInEasing))'
        def newDrift = 'driftAnim.animateTo(Random.nextFloat() * 0.14f - 0.07f, tween(2200 + Random.nextInt(1600), easing = FastOutSlowInEasing))'
        def oldShimmer = 'shimmerAnim.animateTo(0.22f + Random.nextFloat() * 0.78f, tween(520 + Random.nextInt(980), easing = FastOutSlowInEasing))'
        def newShimmer = 'shimmerAnim.animateTo(0.36f + Random.nextFloat() * 0.32f, tween(1800 + Random.nextInt(1200), easing = FastOutSlowInEasing))'
        if (dropletText.contains(oldBreath)) dropletText = dropletText.replace(oldBreath, newBreath)
        if (dropletText.contains(oldDrift)) dropletText = dropletText.replace(oldDrift, newDrift)
        if (dropletText.contains(oldShimmer)) dropletText = dropletText.replace(oldShimmer, newShimmer)

        def oldSweep = 'val sweep = (phase - phase.toInt()) * size.width * 0.66f'
        def newSweep = 'val smoothPhase = 0.5f + 0.5f * sin((phase * 1.35f + shimmer * 0.25f) * NetworkInlineDropletTau)\n        val sweep = smoothPhase * size.width * 0.46f'
        if (dropletText.contains(oldSweep)) {
            dropletText = dropletText.replace(oldSweep, newSweep)
            println('Replaced prism wrap reset with continuous sinusoidal drift.')
        } else if (dropletText.contains('val smoothPhase = 0.5f + 0.5f * sin((phase * 1.35f + shimmer * 0.25f) * NetworkInlineDropletTau)')) {
            println('Prism drift already uses continuous phase.')
        } else {
            throw new GradleException('Target prism sweep line was not found.')
        }
        droplet.setText(dropletText, 'UTF-8')

        def gl = file('src/main/java/com/yuchen/ailedger/ui/gl/OpenGLDropletGlassLayer.kt')
        def glText = gl.getText('UTF-8')
        def oldRim = '''                float rimDirection = bottomOptic * 1.00 + sideFacing * 0.62 + topFacing * 0.20;
                float rimLight = rimSource * wideRim * (0.25 + 0.75 * thickness) * rimDirection * activeRimRefraction * rimGather;
'''
        def newRim = '''                float rimDirection = bottomOptic * 1.00 + sideFacing * 0.62 + topFacing * 0.20;
                float joinDistance = abs(abs(coord.x - center.x) - halfLine);
                float joinFade = mix(0.70, 1.0, smoothstep(0.0, max(radius * 0.30, 10.0), joinDistance));
                float sideJoinFade = mix(1.0, joinFade, sideFacing * wideRim);
                float rimLight = rimSource * wideRim * (0.25 + 0.75 * thickness) * rimDirection * activeRimRefraction * rimGather * sideJoinFade;
'''
        if (glText.contains(oldRim)) {
            glText = glText.replace(oldRim, newRim)
            println('Softened OpenGL droplet rim light at cap joins.')
        } else if (glText.contains('float sideJoinFade = mix(1.0, joinFade, sideFacing * wideRim);')) {
            println('OpenGL droplet rim join fade already patched.')
        } else {
            throw new GradleException('Target OpenGL rim light block was not found.')
        }

        def oldEntry = '''                float entryPin = exp(-dot(pinDelta, pinDelta) * 5.5) * sourceSideMask * sat(thinRim + innerRimLine * 0.55) * active * hotspotStrength * entryPearl;
                float lowerArc = smoothstep(0.22, 0.96, softNormal.y);
'''
        def newEntry = '''                float entryPin = exp(-dot(pinDelta, pinDelta) * 5.5) * sourceSideMask * sat(thinRim + innerRimLine * 0.55) * active * hotspotStrength * entryPearl;
                entryEdgeContact *= sideJoinFade;
                entryEdgeWash *= sideJoinFade;
                entryHalo *= sideJoinFade;
                entryCrescent *= sideJoinFade;
                entryPin *= sideJoinFade;
                float lowerArc = smoothstep(0.22, 0.96, softNormal.y);
'''
        if (glText.contains(oldEntry)) {
            glText = glText.replace(oldEntry, newEntry)
            println('Softened entry pearl masks at cap joins.')
        } else if (glText.contains('entryEdgeContact *= sideJoinFade;')) {
            println('Entry pearl join fade already patched.')
        } else {
            throw new GradleException('Target OpenGL entry pearl block was not found.')
        }
        gl.setText(glText, 'UTF-8')
    }
}

tasks.named('preBuild') {
    dependsOn patchPolishedOnlineDroplet
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
