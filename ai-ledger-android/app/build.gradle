            radius = 22,
            modifier = Modifier.fillMaxWidth().height(54.dp),
            role = GlassRole.Chip,
            onClick = { dropletLabExpanded = !dropletLabExpanded }
        ) {
            Row(Modifier.fillMaxSize().padding(horizontal = 13.dp), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                Column(Modifier.weight(1f), verticalArrangement = Arrangement.Center) {
                    Text("OpenGL 水滴样本", color = Color.White.copy(alpha = 0.88f), fontSize = 14.sp, fontWeight = FontWeight.Black, maxLines = 1)
                    Text("点开后再启动水滴预览和参数滑块。", color = Color.White.copy(alpha = 0.42f), fontSize = 9.sp, fontWeight = FontWeight.Bold, maxLines = 1, overflow = TextOverflow.Ellipsis)
                }
                Text(if (dropletLabExpanded) "收起" else "展开", color = Color.White.copy(alpha = 0.52f), fontSize = 10.sp, fontWeight = FontWeight.ExtraBold)
            }
        }
        if (dropletLabExpanded) {
            OpenGlLargeDropletPreview(
'''
        if (!frostText.contains('if (dropletLabExpanded) {\n            OpenGlLargeDropletPreview(')) {
            if (frostText.contains(oldOpenGlStart)) {
                frostText = frostText.replace(oldOpenGlStart, newOpenGlStart)
            } else {
                throw new GradleException('OpenGL droplet lazy-load start block not found.')
            }
        }

        def oldOpenGlEnd = '''        GlassPanelSlider("阴影扩散", "阴影边缘柔化范围", dropletShadowSoftness, 2f..36f) { dropletShadowSoftness = it }
    }
}
'''
        def newOpenGlEnd = '''        GlassPanelSlider("阴影扩散", "阴影边缘柔化范围", dropletShadowSoftness, 2f..36f) { dropletShadowSoftness = it }
        }
    }
}
'''
        if (frostText.contains(newOpenGlEnd)) {
            // already patched
        } else if (frostText.contains(oldOpenGlEnd)) {
            frostText = frostText.replace(oldOpenGlEnd, newOpenGlEnd)
        } else {
            throw new GradleException('OpenGL droplet lazy-load end block not found.')
        }
        frostPanel.setText(frostText, 'UTF-8')
        println('Patched FrostInfoGlassLab to lazy-load the OpenGL droplet sample behind a foldout.')
    }
}

tasks.named('preBuild') {
    dependsOn patchPolishedOnlineDroplet
    dependsOn patchGlassLabLazyLoading
}
