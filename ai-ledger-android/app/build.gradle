        def dropletStateLine = '    var dropletLabExpanded by rememberSaveable { mutableStateOf(false) }\n\n'
        def stateAnchor = '''    )

    Column(verticalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.fillMaxWidth()) {
        GlassLabMiniTitle("雾面信息玻璃", "只裁剪背景模糊层，不叠边框、高光和折射。")
'''
        def stateReplacement = '''    )
    var dropletLabExpanded by rememberSaveable { mutableStateOf(false) }

    Column(verticalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.fillMaxWidth()) {
        GlassLabMiniTitle("雾面信息玻璃", "只裁剪背景模糊层，不叠边框、高光和折射。")
'''
        if (!frostText.contains(dropletStateLine)) {
            if (frostText.contains(stateAnchor)) {
                frostText = frostText.replace(stateAnchor, stateReplacement)
            } else {
                throw new GradleException('FrostInfoGlassLab droplet state anchor not found.')
            }
        }

        def oldOpenGlStart = '''        GlassLabMiniTitle("OpenGL 横向水滴", "按住点亮；棱彩只保留雾化光泽，不画曲线、直线或外圈霓虹。")
        OpenGlLargeDropletPreview(
'''
        def newOpenGlStart = '''        GlassLabMiniTitle("OpenGL 横向水滴", "按住点亮；棱彩只保留雾化光泽，不画曲线、直线或外圈霓虹。")
        PressableGlass(
            quality = state.quality,
