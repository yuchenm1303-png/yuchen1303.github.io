plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.yuchen.ailedger'
    compileSdk 36

    defaultConfig {
        applicationId 'com.yuchen.ailedger.compose'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0-compose-preview'
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

apply from: 'chat-bubble-polish.gradle'
apply from: 'shared-prism-capsule.gradle'

def patchPolishedOnlineDroplet = tasks.register('patchPolishedOnlineDroplet') {
    doLast {
        def home = file('src/main/java/com/yuchen/ailedger/ui/AssistantHomePolished.kt')
        def text = home.getText('UTF-8')
        def oldBlock = '''@Composable
private fun NetworkChipV2(state: AssistantUiState, modifier: Modifier, onClick: () -> Unit) {
    val accent = if (state.onlineEnabled) Color(0xFF8DF9EA) else Color(0xFF9EB7FF)
    PressableGlass(state.quality, state.glassIntensity * 0.95f, state.motionIntensity, 999, modifier.height(48.dp), GlassRole.Chip, onClick = onClick) {
        Row(
            Modifier.fillMaxSize().padding(horizontal = 12.dp),
            verticalAlignment = Alignment.CenterVertically,
            horizontalArrangement = Arrangement.spacedBy(8.dp)
        ) {
            PulseDotV2(active = state.onlineEnabled || state.isSending, color = accent)
            Column(Modifier.weight(1f), verticalArrangement = Arrangement.Center) {
                Text("联网", color = Color.White.copy(alpha = 0.48f), fontSize = 10.sp, fontWeight = FontWeight.Bold, maxLines = 1)
                Text(if (state.onlineEnabled) "已开启" else "已关闭", color = Color.White.copy(alpha = 0.94f), fontSize = 13.sp, fontWeight = FontWeight.ExtraBold, maxLines = 1)
            }
        }
    }
}
'''
        def newBlock = '''@Composable
private fun NetworkChipV2(state: AssistantUiState, modifier: Modifier, onClick: () -> Unit) {
    NetworkDropletCapsule(
        state = state,
        modifier = modifier,
        enabled = !state.isSending,
        onClick = onClick
    )
}
'''
        if (text.contains(newBlock)) {
            println('NetworkChipV2 already uses NetworkDropletCapsule.')
        } else if (text.contains(oldBlock)) {
            home.setText(text.replace(oldBlock, newBlock), 'UTF-8')
            println('Patched AssistantHomePolished NetworkChipV2 to use NetworkDropletCapsule.')
        } else if (text.contains('private fun ModelStackSelector(') || text.contains('private fun ModelStackCard(')) {
            println('AssistantHomePolished now uses stacked model cards; skipped legacy NetworkChipV2 droplet replacement.')
        } else {
            throw new GradleException('Target NetworkChipV2 block was not found; refusing to build stale online toggle.')
        }

        text = home.getText('UTF-8')
        def oldHeroActions = '''        Row(horizontalArrangement = Arrangement.spacedBy(7.dp)) {
            RoundIconButtonV2("▦", state, onClick = onOpenTools)
            RoundIconButtonV2("⚙", state, onClick = onOpenSettings)
        }
'''
        if (text.contains(oldHeroActions)) {
            home.setText(text.replace(oldHeroActions, ''), 'UTF-8')
            println('Removed top-right hero shortcut buttons from AssistantHomePolished.')
        } else if (text.contains('RoundIconButtonV2("▦", state, onClick = onOpenTools)') || text.contains('RoundIconButtonV2("⚙", state, onClick = onOpenSettings)')) {
            throw new GradleException('AssistantHeroV2 shortcut button block changed; refusing to leave partial top-right buttons.')
        } else {
            println('Top-right hero shortcut buttons already removed.')
        }

        def droplet = file('src/main/java/com/yuchen/ailedger/ui/NetworkDropletCapsule.kt')
        def dropletText = droplet.getText('UTF-8')
        def oldHeight = 'Box(modifier = modifier.height(68.dp), contentAlignment = Alignment.Center)'
        def newHeight = 'Box(modifier = modifier.height(54.dp), contentAlignment = Alignment.Center)'
        if (dropletText.contains(oldHeight)) {
            dropletText = dropletText.replace(oldHeight, newHeight)
            println('Shrunk online sample droplet from 68dp to 54dp.')
        } else if (dropletText.contains(newHeight)) {
            println('Online sample droplet already uses 54dp height.')
        } else {
            throw new GradleException('Target NetworkDropletCapsule height block was not found.')
        }
        droplet.setText(dropletText, 'UTF-8')
    }
}

def patchSettingsParentGlassLayer = tasks.register('patchSettingsParentGlassLayer') {
    doLast {
        def settings = file('src/main/java/com/yuchen/ailedger/ui/SettingsPolishedScreen.kt')
        def text = settings.getText('UTF-8')
        if (!text.contains('import androidx.compose.runtime.CompositionLocalProvider')) {
            text = text.replace('import androidx.compose.runtime.Composable\n', 'import androidx.compose.runtime.Composable\nimport androidx.compose.runtime.CompositionLocalProvider\n')
        }
        def oldScreenBlock = '''    val listState = rememberLazyListState()
    SyncGlassBackdropToScroll(listState)
    var selectedPanel by rememberSaveable { mutableStateOf(SettingsPanel.Appearance) }

    LazyColumn(
        state = listState,
        modifier = Modifier.fillMaxSize(),
        contentPadding = PaddingValues(top = 16.dp, bottom = 132.dp),
        verticalArrangement = Arrangement.spacedBy(13.dp)
    ) {
        item { SettingsEntrance(0, -8, 0.985f) { SettingsHeader() } }
        item { SettingsEntrance(42, 18, 0.965f) { SettingsOverviewCard(state, aiEndpoint) } }
        item { SettingsEntrance(78, 18, 0.97f) { SettingsSectionTitle("常用设置", "选中的入口会持续呼吸，方便快速定位当前面板。") } }
        item { SettingsEntrance(104, 20, 0.965f) { SettingsDashboardGrid(state, aiEndpoint, selectedPanel) { selectedPanel = it } } }
        item {
            SettingsEntrance(140, 22, 0.965f) {
                SettingsDetailPanel(
                    panel = selectedPanel,
                    state = state,
                    aiEndpoint = aiEndpoint,
                    onQualityChange = onQualityChange,
                    onPreviewConversationChange = onPreviewConversationChange,
                    onGlassPresetChange = onGlassPresetChange,
                    onBackgroundThemeChange = onBackgroundThemeChange,
                    onGlassIntensityChange = onGlassIntensityChange,
                    onMotionIntensityChange = onMotionIntensityChange,
                    onRainbowPrismChange = onRainbowPrismChange,
                    onBackdropChange = onBackdropChange,
                    onBorderChange = onBorderChange,
                    onUploadBackgroundClick = onUploadBackgroundClick,
                    onClearCustomBackgroundClick = onClearCustomBackgroundClick
                )
            }
        }
        item { SettingsEntrance(176, 24, 0.96f) { SettingsLabEntry(state, selectedPanel == SettingsPanel.Debug) { selectedPanel = SettingsPanel.Debug } } }
    }
'''
        def newScreenBlock = '''    val listState = rememberLazyListState()
    SyncGlassBackdropToScroll(listState)
    var selectedPanel by rememberSaveable { mutableStateOf(SettingsPanel.Appearance) }
    val parentGlassLayer = rememberSettingsParentGlassLayerState()

    Box(Modifier.fillMaxSize()) {
        SettingsParentGlassLayer(parentGlassLayer, state, Modifier.fillMaxSize())
        CompositionLocalProvider(LocalSettingsParentGlassLayer provides parentGlassLayer) {
            LazyColumn(
                state = listState,
                modifier = Modifier.fillMaxSize(),
                contentPadding = PaddingValues(top = 16.dp, bottom = 132.dp),
                verticalArrangement = Arrangement.spacedBy(13.dp)
            ) {
                item { SettingsEntrance(0, -8, 0.985f) { SettingsHeader() } }
                item { SettingsEntrance(42, 18, 0.965f) { SettingsOverviewCard(state, aiEndpoint) } }
                item { SettingsEntrance(78, 18, 0.97f) { SettingsSectionTitle("常用设置", "选中的入口会持续呼吸，方便快速定位当前面板。") } }
                item { SettingsEntrance(104, 20, 0.965f) { SettingsDashboardGrid(state, aiEndpoint, selectedPanel) { selectedPanel = it } } }
                item {
                    SettingsEntrance(140, 22, 0.965f) {
                        SettingsDetailPanel(
                            panel = selectedPanel,
                            state = state,
                            aiEndpoint = aiEndpoint,
                            onQualityChange = onQualityChange,
                            onPreviewConversationChange = onPreviewConversationChange,
                            onGlassPresetChange = onGlassPresetChange,
                            onBackgroundThemeChange = onBackgroundThemeChange,
                            onGlassIntensityChange = onGlassIntensityChange,
                            onMotionIntensityChange = onMotionIntensityChange,
                            onRainbowPrismChange = onRainbowPrismChange,
                            onBackdropChange = onBackdropChange,
                            onBorderChange = onBorderChange,
                            onUploadBackgroundClick = onUploadBackgroundClick,
                            onClearCustomBackgroundClick = onClearCustomBackgroundClick
                        )
                    }
                }
                item { SettingsEntrance(176, 24, 0.96f) { SettingsLabEntry(state, selectedPanel == SettingsPanel.Debug) { selectedPanel = SettingsPanel.Debug } } }
            }
        }
    }
'''
        if (text.contains(newScreenBlock)) {
            println('Settings screen already hosts parent glass layer.')
        } else if (text.contains(oldScreenBlock)) {
            text = text.replace(oldScreenBlock, newScreenBlock)
            settings.setText(text, 'UTF-8')
            println('Wrapped SettingsPolishedScreen with parent glass layer.')
        } else {
            throw new GradleException('SettingsPolishedScreen body changed; refusing to miss parent layer hookup.')
        }

        def glass = file('src/main/java/com/yuchen/ailedger/ui/Glass.kt')
        def glassText = glass.getText('UTF-8')
        def oldGlassPanel = '''    val effectiveRadius = effectiveGlassRadius(radius, role)
    val shimmer = rememberGlassShimmer(quality, motionIntensity)
'''
        def newGlassPanel = '''    val effectiveRadius = effectiveGlassRadius(radius, role)
    val settingsParentLayer = LocalSettingsParentGlassLayer.current
    if (settingsParentLayer != null) {
        val parentKey = remember { Any() }
        DisposableEffect(settingsParentLayer, parentKey) { onDispose { settingsParentLayer.remove("glass-panel-${parentKey.hashCode()}") } }
        Box(
            modifier = modifier.registerSettingsParentGlass(
                id = "glass-panel-${parentKey.hashCode()}",
                layerState = settingsParentLayer,
                radiusDp = effectiveRadius.toFloat(),
                kind = when (role) {
                    GlassRole.Shell -> SettingsParentGlassKind.Shell
                    GlassRole.Floating -> SettingsParentGlassKind.Floating
                    GlassRole.Chip -> SettingsParentGlassKind.Chip
                    GlassRole.Nav -> SettingsParentGlassKind.Chip
                    GlassRole.Flex -> SettingsParentGlassKind.Detail
                    GlassRole.Card -> SettingsParentGlassKind.Metric
                },
                selected = role == GlassRole.Shell,
                emphasis = glassIntensity
            )
        ) { content() }
        return
    }
    val shimmer = rememberGlassShimmer(quality, motionIntensity)
'''
        if (!glassText.contains('SettingsParentGlassKind') && glassText.contains(oldGlassPanel)) {
            glassText = glassText.replace(oldGlassPanel, newGlassPanel)
            println('Patched GlassPanel to delegate settings glass to parent layer.')
        }
        def oldPressable = '''    val effectiveRadius = effectiveGlassRadius(radius, role)
    val interaction = remember { MutableInteractionSource() }
'''
        def newPressable = '''    val effectiveRadius = effectiveGlassRadius(radius, role)
    val settingsParentLayer = LocalSettingsParentGlassLayer.current
    if (settingsParentLayer != null) {
        val parentKey = remember { Any() }
        val parentInteraction = remember { MutableInteractionSource() }
        DisposableEffect(settingsParentLayer, parentKey) { onDispose { settingsParentLayer.remove("pressable-glass-${parentKey.hashCode()}") } }
        Box(
            modifier = modifier
                .clickable(interactionSource = parentInteraction, indication = null, onClick = onClick)
                .registerSettingsParentGlass(
                    id = "pressable-glass-${parentKey.hashCode()}",
                    layerState = settingsParentLayer,
                    radiusDp = effectiveRadius.toFloat(),
                    kind = when (role) {
                        GlassRole.Floating -> SettingsParentGlassKind.Floating
                        GlassRole.Chip -> SettingsParentGlassKind.Chip
                        GlassRole.Nav -> SettingsParentGlassKind.Chip
                        GlassRole.Flex -> SettingsParentGlassKind.Detail
                        GlassRole.Shell -> SettingsParentGlassKind.Shell
                        GlassRole.Card -> SettingsParentGlassKind.Chip
                    },
                    selected = role == GlassRole.Floating,
                    emphasis = glassIntensity
                )
        ) { content() }
        return
    }
    val interaction = remember { MutableInteractionSource() }
'''
        if (glassText.contains(oldPressable)) {
            glassText = glassText.replace(oldPressable, newPressable)
            println('Patched PressableGlass to delegate settings glass to parent layer.')
        }
        glass.setText(glassText, 'UTF-8')

        def frost = file('src/main/java/com/yuchen/ailedger/ui/FrostInfoGlassPanel.kt')
        def frostText = frost.getText('UTF-8')
        def oldFrost = '''@Composable
fun FrostInfoGlassPanel(modifier: Modifier = Modifier, radius: Float = 17.44f, backdropAlpha: Float = 1f, frostAlpha: Float = 0f, dimAlpha: Float = 0f, content: @Composable () -> Unit) {
    val coordinates = remember { GlassCoordinateSource() }
    Box(modifier = modifier.onGloballyPositioned { coordinates.coordinates = it }.clip(RoundedCornerShape(radius.dp))) {
        BackdropCrop(coordinates, backdropAlpha.coerceIn(0f, 1f), Modifier.fillMaxSize())
        Box(Modifier.fillMaxSize().background(Color.White.copy(alpha = frostAlpha.coerceIn(0f, 0.85f))))
        Box(Modifier.fillMaxSize().background(Color.Black.copy(alpha = dimAlpha.coerceIn(0f, 0.65f))))
        content()
    }
}
'''
        def newFrost = '''@Composable
fun FrostInfoGlassPanel(modifier: Modifier = Modifier, radius: Float = 17.44f, backdropAlpha: Float = 1f, frostAlpha: Float = 0f, dimAlpha: Float = 0f, content: @Composable () -> Unit) {
    val settingsParentLayer = LocalSettingsParentGlassLayer.current
    if (settingsParentLayer != null) {
        val parentKey = remember { Any() }
        DisposableEffect(settingsParentLayer, parentKey) { onDispose { settingsParentLayer.remove("frost-info-${parentKey.hashCode()}") } }
        Box(
            modifier = modifier.registerSettingsParentGlass(
                id = "frost-info-${parentKey.hashCode()}",
                layerState = settingsParentLayer,
                radiusDp = radius,
                kind = SettingsParentGlassKind.Tile,
                selected = frostAlpha > 0.10f,
                emphasis = backdropAlpha + frostAlpha + dimAlpha
            )
        ) { content() }
        return
    }
    val coordinates = remember { GlassCoordinateSource() }
    Box(modifier = modifier.onGloballyPositioned { coordinates.coordinates = it }.clip(RoundedCornerShape(radius.dp))) {
        BackdropCrop(coordinates, backdropAlpha.coerceIn(0f, 1f), Modifier.fillMaxSize())
        Box(Modifier.fillMaxSize().background(Color.White.copy(alpha = frostAlpha.coerceIn(0f, 0.85f))))
        Box(Modifier.fillMaxSize().background(Color.Black.copy(alpha = dimAlpha.coerceIn(0f, 0.65f))))
        content()
    }
}
'''
        if (!frostText.contains('val settingsParentLayer = LocalSettingsParentGlassLayer.current') && frostText.contains(oldFrost)) {
            frostText = frostText.replace(oldFrost, newFrost)
            if (!frostText.contains('import androidx.compose.runtime.DisposableEffect')) {
                frostText = frostText.replace('import androidx.compose.runtime.Composable\n', 'import androidx.compose.runtime.Composable\nimport androidx.compose.runtime.DisposableEffect\n')
            }
            frost.setText(frostText, 'UTF-8')
            println('Patched FrostInfoGlassPanel to delegate settings frost to parent layer.')
        }
    }
}

tasks.named('preBuild') {
    dependsOn patchPolishedOnlineDroplet
    dependsOn patchSettingsParentGlassLayer
}
