plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.yuchen.ailedger'
    compileSdk 36

    defaultConfig {
        applicationId 'com.yuchen.ailedger'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0-native-shell'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

def applyOptionalPatch = { String patchName ->
    def patchFile = file(patchName)
    if (patchFile.exists()) {
        apply from: patchName
    } else {
        println("Skipped missing optional patch: ${patchName}")
    }
}

applyOptionalPatch('chat-bubble-polish.gradle')
applyOptionalPatch('stop-generation-signature-fix.gradle')
applyOptionalPatch('shared-prism-capsule.gradle')
applyOptionalPatch('fix-assistant-home-compile.gradle')
applyOptionalPatch('model-selector-folded-stack.gradle')
applyOptionalPatch('model-selector-stack-press-follow.gradle')
applyOptionalPatch('model-selector-animation-continuity.gradle')
applyOptionalPatch('model-selector-animation-tempo.gradle')
applyOptionalPatch('model-network-original-layout.gradle')
applyOptionalPatch('reuse-lab-droplet.gradle')
applyOptionalPatch('network-droplet-surface-text.gradle')
applyOptionalPatch('droplet-continuous-motion-tuning.gradle')
applyOptionalPatch('stock-market-entry.gradle')
applyOptionalPatch('stock-market-icon-fix.gradle')
applyOptionalPatch('stock-market-a-share.gradle')
applyOptionalPatch('stock-market-pro-detail.gradle')
