plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.yuchen.ailedger'
    compileSdk 36

    defaultConfig {
        applicationId 'com.yuchen.ailedger.compose'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0-compose-preview'
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    jvmToolchain(17)
}

def patchPolishedOnlineDroplet = tasks.register('patchPolishedOnlineDroplet') {
    doLast {
        def home = file('src/main/java/com/yuchen/ailedger/ui/AssistantHomePolished.kt')
        def text = home.getText('UTF-8')
        def oldBlock = '''@Composable
private fun NetworkChipV2(state: AssistantUiState, modifier: Modifier, onClick: () -> Unit) {
    val accent = if (state.onlineEnabled) Color(0xFF8DF9EA) else Color(0xFF9EB7FF)
    PressableGlass(state.quality, state.glassIntensity * 0.95f, state.motionIntensity, 999, modifier.height(48.dp), GlassRole.Chip, onClick = onClick) {
        Row(
            Modifier.fillMaxSize().padding(horizontal = 12.dp),
            verticalAlignment = Alignment.CenterVertically,
            horizontalArrangement = Arrangement.spacedBy(8.dp)
        ) {
            PulseDotV2(active = state.onlineEnabled || state.isSending, color = accent)
            Column(Modifier.weight(1f), verticalArrangement = Arrangement.Center) {
                Text("联网", color = Color.White.copy(alpha = 0.48f), fontSize = 10.sp, fontWeight = FontWeight.Bold, maxLines = 1)
                Text(if (state.onlineEnabled) "已开启" else "已关闭", color = Color.White.copy(alpha = 0.94f), fontSize = 13.sp, fontWeight = FontWeight.ExtraBold, maxLines = 1)
            }
        }
    }
}
'''
        def newBlock = '''@Composable
private fun NetworkChipV2(state: AssistantUiState, modifier: Modifier, onClick: () -> Unit) {
    NetworkDropletCapsule(
        state = state,
        modifier = modifier,
        enabled = !state.isSending,
        onClick = onClick
    )
}
'''
        if (text.contains(newBlock)) {
            println('NetworkChipV2 already uses NetworkDropletCapsule.')
        } else if (text.contains(oldBlock)) {
            home.setText(text.replace(oldBlock, newBlock), 'UTF-8')
            println('Patched AssistantHomePolished NetworkChipV2 to use NetworkDropletCapsule.')
        } else {
            throw new GradleException('Target NetworkChipV2 block was not found; refusing to build stale online toggle.')
        }

        def droplet = file('src/main/java/com/yuchen/ailedger/ui/NetworkDropletCapsule.kt')
        def dropletText = droplet.getText('UTF-8')
        def oldHeight = 'Box(modifier = modifier.height(68.dp), contentAlignment = Alignment.Center)'
        def newHeight = 'Box(modifier = modifier.height(54.dp), contentAlignment = Alignment.Center)'
        if (dropletText.contains(oldHeight)) {
            droplet.setText(dropletText.replace(oldHeight, newHeight), 'UTF-8')
            println('Shrunk online sample droplet from 68dp to 54dp.')
        } else if (dropletText.contains(newHeight)) {
            println('Online sample droplet already uses 54dp height.')
        } else {
            throw new GradleException('Target NetworkDropletCapsule height block was not found.')
        }
    }
}

def patchChatRainbowOverlay = tasks.register('patchChatRainbowOverlay') {
    doLast {
        def home = file('src/main/java/com/yuchen/ailedger/ui/AssistantHomePolished.kt')
        def text = home.getText('UTF-8')
        def newBlock = '''@Composable
private fun RainbowChatGlassOverlay(
    quality: RenderQuality,
    motionIntensity: Float,
    modifier: Modifier = Modifier
) {
    val style = LocalRainbowPrismStyle.current
    val transition = rememberInfiniteTransition(label = "chat-rainbow-mist-overlay")
    val phase by transition.animateFloat(
        initialValue = 0f,
        targetValue = 1f,
        animationSpec = infiniteRepeatable(animation = tween(13200, easing = LinearEasing), repeatMode = RepeatMode.Restart),
        label = "chat-rainbow-mist-phase"
    )
    val driftPhase by transition.animateFloat(
        initialValue = 0.23f,
        targetValue = 1.23f,
        animationSpec = infiniteRepeatable(animation = tween(21400, easing = LinearEasing), repeatMode = RepeatMode.Restart),
        label = "chat-rainbow-mist-drift"
    )
    val breathPhase by transition.animateFloat(
        initialValue = 0.61f,
        targetValue = 1.61f,
        animationSpec = infiniteRepeatable(animation = tween(18600, easing = LinearEasing), repeatMode = RepeatMode.Restart),
        label = "chat-rainbow-mist-breath"
    )
    val motionOn = quality.enableMotion && motionIntensity > 0.02f
    val t = if (motionOn) phase else 0.18f
    val d = if (motionOn) driftPhase else 0.37f
    val b = if (motionOn) breathPhase else 0.52f
    val cycle = t * 2f * PI.toFloat()
    val drift = d * 2f * PI.toFloat()
    val breath = chatRainbowSmoothStep(((sin(b * 2f * PI.toFloat()) + 1f) * 0.5f).coerceIn(0f, 1f))
    val motion = motionIntensity.coerceIn(0f, 1f)
    val visualPresence = (0.46f + motion * 0.54f).coerceIn(0.46f, 1f)
    val overall = style.overall.coerceIn(0f, 2f)
    val edge = style.edgeHighlight.coerceIn(0f, 2f)
    val minSweep = minOf(style.sweepMin, style.sweepMax).coerceIn(0f, 2f)
    val maxSweep = maxOf(style.sweepMin, style.sweepMax).coerceIn(0f, 2f)
    val sweep = minSweep + (maxSweep - minSweep) * breath
    val sweepPower = chatRainbowSmoothStep((sweep / 2f).coerceIn(0f, 1f))
    val halo = style.rainbowHalo.coerceIn(0f, 2f)
    val mistLoad = (visualPresence * overall * (0.70f + 0.18f * sweepPower)).coerceIn(0f, 1.78f)
    val veilLoad = (visualPresence * overall * (0.48f + 0.34f * sweepPower)).coerceIn(0f, 1.68f)
    val haloLoad = (visualPresence * overall * halo * (0.50f + 0.18f * sweepPower)).coerceIn(0f, 1.80f)
    val rimLoad = (visualPresence * overall * (0.36f + edge * 0.28f + sweepPower * 0.28f)).coerceIn(0f, 1.72f)

    Canvas(modifier = modifier) {
        val w = size.width.coerceAtLeast(1f)
        val h = size.height.coerceAtLeast(1f)
        val maxSide = maxOf(w, h)
        val corner = CornerRadius(30.dp.toPx(), 30.dp.toPx())
        val mistA = Offset(
            x = w * (-0.22f + 0.08f * sin(cycle * 0.61f + drift * 0.27f)),
            y = h * (0.18f + 0.20f * cos(drift * 0.73f + 0.90f))
        )
        val mistB = Offset(
            x = w * (1.18f + 0.07f * cos(cycle * 0.53f + 1.70f)),
            y = h * (0.76f + 0.22f * sin(drift * 0.67f + 2.10f))
        )
        val haloCenter = Offset(
            x = w * (0.42f + 0.18f * sin(drift * 0.47f + 0.40f)),
            y = h * (1.18f + 0.08f * cos(cycle * 0.41f + 1.20f))
        )
        val sweepA = 0.46f + 0.28f * sin(cycle * 0.71f + drift * 0.21f)
        val sweepB = 0.54f + 0.34f * cos(cycle * 0.43f + drift * 0.33f)

        drawRoundRect(
            brush = Brush.radialGradient(
                colors = listOf(
                    Color(0xFFFF74D9).copy(alpha = 0.038f * mistLoad),
                    Color(0xFFFFE59A).copy(alpha = 0.024f * mistLoad),
                    Color(0xFF79FFF1).copy(alpha = 0.034f * mistLoad),
                    Color.Transparent
                ),
                center = mistA,
                radius = maxSide * 1.22f
            ),
            size = Size(w, h),
            cornerRadius = corner,
            blendMode = BlendMode.SrcOver
        )
        drawRoundRect(
            brush = Brush.radialGradient(
                colors = listOf(
                    Color(0xFF76FFF1).copy(alpha = 0.034f * mistLoad),
                    Color(0xFF93A3FF).copy(alpha = 0.035f * mistLoad),
                    Color(0xFFFF8FE7).copy(alpha = 0.022f * mistLoad),
                    Color.Transparent
                ),
                center = mistB,
                radius = maxSide * 1.30f
            ),
            size = Size(w, h),
            cornerRadius = corner,
            blendMode = BlendMode.SrcOver
        )
        if (haloLoad > 0.001f) {
            drawRoundRect(
                brush = Brush.radialGradient(
                    colors = listOf(
                        Color.White.copy(alpha = 0.024f * haloLoad),
                        Color(0xFFFFB2EA).copy(alpha = 0.036f * haloLoad),
                        Color(0xFF8FFFF4).copy(alpha = 0.034f * haloLoad),
                        Color(0xFFA9B1FF).copy(alpha = 0.024f * haloLoad),
                        Color.Transparent
                    ),
                    center = haloCenter,
                    radius = maxSide * 1.10f
                ),
                size = Size(w, h),
                cornerRadius = corner,
                blendMode = BlendMode.SrcOver
            )
        }
        drawRoundRect(
            brush = Brush.linearGradient(
                colors = listOf(
                    Color.Transparent,
                    Color(0xFFFFEAA8).copy(alpha = 0.014f * veilLoad),
                    Color(0xFF79FFF2).copy(alpha = 0.026f * veilLoad),
                    Color(0xFFFF82DC).copy(alpha = 0.016f * veilLoad),
                    Color.Transparent
                ),
                start = Offset(w * (sweepA - 0.78f), -h * 0.34f),
                end = Offset(w * (sweepA + 0.76f), h * 1.30f)
            ),
            size = Size(w, h),
            cornerRadius = corner,
            blendMode = BlendMode.SrcOver
        )
        drawRoundRect(
            brush = Brush.linearGradient(
                colors = listOf(
                    Color.Transparent,
                    Color(0xFF9BA8FF).copy(alpha = 0.012f * veilLoad),
                    Color(0xFFFF70D7).copy(alpha = 0.020f * veilLoad),
                    Color(0xFF7CFFF1).copy(alpha = 0.018f * veilLoad),
                    Color.Transparent
                ),
                start = Offset(w * (sweepB + 0.50f), -h * 0.20f),
                end = Offset(w * (sweepB - 0.58f), h * 1.20f)
            ),
            size = Size(w, h),
            cornerRadius = corner,
            blendMode = BlendMode.SrcOver
        )
        val inset = 0.74.dp.toPx()
        val rimSize = Size((w - inset * 2f).coerceAtLeast(1f), (h - inset * 2f).coerceAtLeast(1f))
        drawRoundRect(
            brush = Brush.linearGradient(
                colors = listOf(
                    Color.Transparent,
                    Color(0xFFFF64D8).copy(alpha = 0.090f * rimLoad),
                    Color(0xFFFFE27A).copy(alpha = 0.062f * rimLoad),
                    Color(0xFF67FFF0).copy(alpha = 0.100f * rimLoad),
                    Color(0xFF9CA7FF).copy(alpha = 0.066f * rimLoad),
                    Color.Transparent
                ),
                start = Offset(w * (sweepA - 0.40f), h * -0.06f),
                end = Offset(w * (sweepA + 0.46f), h * 1.04f)
            ),
            topLeft = Offset(inset, inset),
            size = rimSize,
            cornerRadius = CornerRadius((30.dp.toPx() - inset).coerceAtLeast(1f), (30.dp.toPx() - inset).coerceAtLeast(1f)),
            style = Stroke(width = 0.76.dp.toPx() + 0.34.dp.toPx() * sweepPower),
            blendMode = BlendMode.Plus
        )
    }
}

private fun chatRainbowSmoothStep(value: Float): Float {
    val x = value.coerceIn(0f, 1f)
    return x * x * (3f - 2f * x)
}
'''
        if (text.contains(newBlock)) {
            println('RainbowChatGlassOverlay already uses mist-field Canvas implementation.')
            return
        }
        def pattern = /(?s)@Composable\nprivate fun RainbowChatGlassOverlay\(\n    quality: RenderQuality,\n    motionIntensity: Float,\n    modifier: Modifier = Modifier\n\) \{.*?\n\}\n(?:\n\nprivate fun Modifier\.chatPanelPrismOverlay\(phase: Float, motionIntensity: Float\): Modifier = drawWithContent \{.*?\n\}\n)?(?:\n\nprivate fun chatRainbowSmoothStep\(value: Float\): Float \{.*?\n\}\n)?/
        def matcher = text =~ pattern
        if (matcher.size() != 1) {
            throw new GradleException("Target RainbowChatGlassOverlay block was not found; matches=${matcher.size()}")
        }
        home.setText(matcher.replaceFirst(newBlock), 'UTF-8')
        println('Patched AssistantHomePolished RainbowChatGlassOverlay to mist-field Canvas implementation.')
    }
}

def patchChatBubbleViewportClipping = tasks.register('patchChatBubbleViewportClipping') {
    doLast {
        def home = file('src/main/java/com/yuchen/ailedger/ui/AssistantHomePolished.kt')
        def text = home.getText('UTF-8')

        def clipImport = 'import androidx.compose.ui.draw.clipToBounds\n'
        if (!text.contains('import androidx.compose.ui.draw.clipToBounds')) {
            text = text.replace('import androidx.compose.ui.draw.clip\n', 'import androidx.compose.ui.draw.clip\n' + clipImport)
        }

        def oldListBlock = '''                LazyColumn(
                    state = listState,
                    modifier = Modifier.weight(1f).fillMaxWidth(),
                    contentPadding = PaddingValues(top = 5.dp, bottom = 18.dp),
                    verticalArrangement = Arrangement.spacedBy(2.dp)
                ) {
                    items(state.messages, key = { it.id }) { message -> AnimatedMessageBubbleV2(message, state) }
                    item { StarterSuggestionsV2(state, onDraftCommand, onPickImage) }
                }
'''
        def newListBlock = '''                Box(
                    Modifier
                        .weight(1f)
                        .fillMaxWidth()
                        .clipToBounds()
                ) {
                    LazyColumn(
                        state = listState,
                        modifier = Modifier.fillMaxSize(),
                        contentPadding = PaddingValues(top = 0.dp, bottom = 12.dp),
                        verticalArrangement = Arrangement.spacedBy(7.dp)
                    ) {
                        items(state.messages, key = { it.id }) { message -> AnimatedMessageBubbleV2(message, state) }
                        item { StarterSuggestionsV2(state, onDraftCommand, onPickImage) }
                    }
                }
'''
        if (text.contains(oldListBlock)) {
            text = text.replace(oldListBlock, newListBlock)
            println('Wrapped chat LazyColumn in clipToBounds viewport.')
        } else if (text.contains('.clipToBounds()') && text.contains('modifier = Modifier.fillMaxSize()')) {
            println('Chat LazyColumn viewport clipping already patched.')
        } else {
            throw new GradleException('Target chat LazyColumn block was not found; refusing to build unclipped bubbles.')
        }

        def staticAnimatedBubble = '''@Composable
private fun AnimatedMessageBubbleV2(message: ChatMessage, state: AssistantUiState) {
    val fromUser = message.role == MessageRole.User
    Row(
        modifier = Modifier
            .fillMaxWidth()
            .padding(horizontal = 2.dp, vertical = 1.dp),
        horizontalArrangement = if (fromUser) Arrangement.End else Arrangement.Start
    ) {
        MessageBubbleV2(message, state, revealProgress = 1f)
    }
}

@Composable
private fun rememberMessageBubblePhase(active: Boolean): Float {
    if (!active) return 0.18f
    val transition = rememberInfiniteTransition(label = "message-bubble-optics-loop")
    val phase by transition.animateFloat(
        initialValue = 0f,
        targetValue = 1f,
        animationSpec = infiniteRepeatable(animation = tween(1680, easing = LinearEasing), repeatMode = RepeatMode.Restart),
        label = "message-bubble-optics-phase"
    )
    return phase
}

@Composable
private fun MessageBubbleV2'''

        def bubblePattern = /(?s)@Composable\nprivate fun AnimatedMessageBubbleV2\(message: ChatMessage, state: AssistantUiState\) \{.*?\n\}\n\n@Composable\nprivate fun MessageBubbleV2/
        def bubbleMatcher = text =~ bubblePattern
        if (bubbleMatcher.size() == 1) {
            text = bubbleMatcher.replaceFirst(staticAnimatedBubble)
            println('Replaced message bubble enter/exit transform with static clipped row.')
        } else if (text.contains('private fun rememberMessageBubblePhase(active: Boolean): Float')) {
            println('Message bubble transform already removed.')
        } else {
            throw new GradleException("Target AnimatedMessageBubbleV2 block was not found; matches=${bubbleMatcher.size()}")
        }

        def oldPhaseBlock = '''    val transition = rememberInfiniteTransition(label = "message-bubble-optics-loop")
    val phase by transition.animateFloat(
        initialValue = 0f,
        targetValue = 1f,
        animationSpec = infiniteRepeatable(animation = tween(if (sending) 1680 else 3600, easing = LinearEasing), repeatMode = RepeatMode.Restart),
        label = "message-bubble-optics-phase"
    )
'''
        def newPhaseBlock = '''    val phase = rememberMessageBubblePhase(sending)
'''
        if (text.contains(oldPhaseBlock)) {
            text = text.replace(oldPhaseBlock, newPhaseBlock)
            println('Disabled per-history-message infinite bubble animation.')
        } else if (text.contains('val phase = rememberMessageBubblePhase(sending)')) {
            println('Message bubble phase is already sending-only.')
        } else {
            throw new GradleException('Target message bubble phase block was not found.')
        }

        home.setText(text, 'UTF-8')
    }
}

tasks.named('preBuild') {
    dependsOn patchPolishedOnlineDroplet
    dependsOn patchChatRainbowOverlay
    dependsOn patchChatBubbleViewportClipping
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
