        if (!text.contains('private fun AShareIndexStripV2(')) {
            text = text.replace('\n@Composable\nprivate fun StockIntradayChartV2', extraBlock + '\n@Composable\nprivate fun StockIntradayChartV2')
        }

        home.setText(text, 'UTF-8')
        def verified = home.getText('UTF-8')
        if (!verified.contains('上证指数 · SH000001')) throw new GradleException('A-share quote hero was not installed.')
        if (!verified.contains('private fun AShareIndexStripV2(')) throw new GradleException('A-share index strip was not installed.')
        if (verified.contains('Text("$189.84"')) throw new GradleException('US dollar sample quote was not replaced.')
        println('A-share stock market UI installed: China indices, A-share watchlist, A-share intraday chart and feature grid.')
