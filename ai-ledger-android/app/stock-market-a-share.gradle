            AShareWatchRowV2("比亚迪", "002594", "¥247.20", "+1.12%")
        }
    }
}

@Composable
private fun AShareWatchRowV2(name: String, code: String, price: String, change: String) {
    Row(Modifier.fillMaxWidth().height(42.dp), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(10.dp)) {
        Column(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(1.dp)) {
            Text(name, color = Color.White.copy(alpha = 0.92f), fontSize = 14.sp, fontWeight = FontWeight.Black, maxLines = 1, overflow = TextOverflow.Ellipsis)
            Text(code, color = Color.White.copy(alpha = 0.42f), fontSize = 10.sp, fontWeight = FontWeight.Bold, maxLines = 1)
        }
        Text(price, color = Color.White.copy(alpha = 0.90f), fontSize = 13.sp, fontWeight = FontWeight.Black)
        Text(change, color = if (change.startsWith("-")) Color(0xFFFFB4C8) else Color(0xFF7CFFB2), fontSize = 12.sp, fontWeight = FontWeight.ExtraBold)
    }
}
