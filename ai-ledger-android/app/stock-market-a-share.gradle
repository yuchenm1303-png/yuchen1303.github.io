        def extraBlock = '''
@Composable
private fun AShareIndexStripV2(state: AssistantUiState) {
    GlassPanel(state.quality, state.glassIntensity * 0.94f, state.motionIntensity, 24, Modifier.fillMaxWidth(), GlassRole.Card) {
