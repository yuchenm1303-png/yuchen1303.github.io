tasks.register('patchAssistantChatBubblePolish') {
    doLast {
        def home = file('src/main/java/com/yuchen/ailedger/ui/AssistantHomePolished.kt')
        if (!home.exists()) {
            println('AssistantHomePolished.kt not found; skipped chat bubble polish patch.')
            return
        }

        def text = home.getText('UTF-8')
        def originalText = text

        if (!text.contains('onStopGenerating: () -> Unit')) {
            text = text.replace(
                '    onSend: () -> Unit,\n',
                '    onSend: () -> Unit,\n    onStopGenerating: () -> Unit,\n'
            )
        }

        def oldComposerCall = '''            ComposerBarV2(state = state, onComposerChange = onComposerChange, onSend = onSend, onPickImage = onPickImage)
'''
        def newComposerCall = '''            ComposerBarV2(
                state = state,
                onComposerChange = onComposerChange,
                onSend = onSend,
                onStopGenerating = onStopGenerating,
                onPickImage = onPickImage
            )
'''
        if (!text.contains('onStopGenerating = onStopGenerating')) {
            if (text.contains(oldComposerCall)) {
                text = text.replace(oldComposerCall, newComposerCall)
            } else {
                println('ComposerBarV2 call target not found; skipped stop-generating call patch safely.')
            }
        }

        def oldComposerBlock = '''@Composable
private fun ComposerBarV2(state: AssistantUiState, onComposerChange: (String) -> Unit, onSend: () -> Unit, onPickImage: () -> Unit) {
    val sendAction = if (state.isSending) ({}) else onSend
    Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.fillMaxWidth()) {
        RoundIconButtonV2("+", state, size = 48, onClick = onPickImage)
        ComposerInputV2(state, state.composerText, onComposerChange, sendAction, Modifier.weight(1f), "和我说点什么...")
        SendButtonV2(state, onClick = sendAction)
    }
}
'''
        def newComposerBlock = '''@Composable
private fun ComposerBarV2(
    state: AssistantUiState,
    onComposerChange: (String) -> Unit,
    onSend: () -> Unit,
    onStopGenerating: () -> Unit,
    onPickImage: () -> Unit
) {
    val keyboardSendAction = if (state.isSending) ({}) else onSend
    val buttonAction = if (state.isSending) onStopGenerating else onSend
    Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.fillMaxWidth()) {
        RoundIconButtonV2("+", state, size = 48, onClick = onPickImage)
        ComposerInputV2(state, state.composerText, onComposerChange, keyboardSendAction, Modifier.weight(1f), "和我说点什么...")
        SendButtonV2(state, onClick = buttonAction)
    }
}
'''
        if (!text.contains('onStopGenerating: () -> Unit') || !text.contains('buttonAction = if (state.isSending) onStopGenerating else onSend')) {
            if (text.contains(oldComposerBlock)) {
                text = text.replace(oldComposerBlock, newComposerBlock)
            } else {
                println('ComposerBarV2 block target not found; skipped stop-generating block patch safely.')
            }
        }

        if (text != originalText) {
            home.setText(text, 'UTF-8')
            println('Applied minimal AssistantHomePolished stop-generating compatibility patch.')
        } else {
            println('AssistantHomePolished already compatible; skipped chat bubble visual patch.')
        }
    }
}

tasks.named('preBuild') {
    dependsOn tasks.named('patchAssistantChatBubblePolish')
}
