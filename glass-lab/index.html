<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Compose Glass Lab</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#071744;color:white;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;overflow-y:auto;-webkit-overflow-scrolling:touch}body{background:linear-gradient(145deg,#071744,#10369a 54%,#6238c7)}.app{max-width:1480px;margin:auto;padding:18px;padding-bottom:160px}.layout{display:grid;grid-template-columns:minmax(360px,1fr) 420px;gap:18px}.card,.panel{border:1px solid rgba(255,255,255,.16);border-radius:28px;background:rgba(3,9,30,.44);box-shadow:0 20px 60px rgba(0,0,0,.24);backdrop-filter:blur(18px)}.card{padding:14px}.panel{padding:16px;position:sticky;top:12px;max-height:calc(100dvh - 24px);overflow:auto;overscroll-behavior:contain;padding-bottom:60px}h1{font-size:44px;margin:0 0 12px;letter-spacing:-.05em}.sub{color:rgba(255,255,255,.58);font-weight:800;margin-bottom:16px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}button{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:rgba(255,255,255,.78);border-radius:999px;padding:10px 14px;font-weight:900}button.active{background:rgba(255,255,255,.24);color:white}canvas{display:block;width:100%;height:auto;border-radius:22px;background:rgba(0,0,0,.18)}.group{border:1px solid rgba(255,255,255,.11);border-radius:22px;background:rgba(255,255,255,.045);padding:12px;margin-bottom:12px}.group h2{font-size:15px;margin:0 0 10px}.row{display:grid;grid-template-columns:104px 1fr 54px;gap:10px;align-items:center;margin:9px 0}label{font-size:12px;color:rgba(255,255,255,.68);font-weight:850}.val{text-align:right;color:rgba(255,255,255,.74);font-size:12px;font-weight:900}input{width:100%;accent-color:#dfefff}textarea{width:100%;height:190px;border:1px solid rgba(255,255,255,.14);border-radius:18px;background:rgba(0,0,0,.28);color:rgba(255,255,255,.86);padding:12px;font-family:monospace;font-size:12px;line-height:1.55}@media(max-width:980px){.layout{grid-template-columns:1fr}.panel{position:relative;top:auto;max-height:none}.app{padding:12px;padding-bottom:190px}h1{font-size:34px}}
</style>
</head>
<body>
<main class="app">
<h1>Compose Glass Lab</h1>
<div class="sub">默认参数已保存为当前这套：低雾面、透明中心、顶部窄光、底部回光。</div>
<section class="layout">
<div class="card">
<div class="tabs"><button data-scene="panel" class="active">大面板</button><button data-scene="chips">控件组</button><button data-scene="menu">模型菜单</button></div>
<canvas id="preview" width="1100" height="860"></canvas>
</div>
<aside class="panel">
<div class="group"><h2>材质预设</h2><div class="tabs"><button data-preset="frost" class="active">Frost</button><button data-preset="ios">iOS Menu</button><button data-preset="clear">Clear</button></div></div>
<div class="group"><h2>主体材质</h2><div class="row"><label>雾面密度</label><input id="frost" type="range" min="0.15" max="1.90" step="0.01"><span class="val" data-for="frost"></span></div><div class="row"><label>暗色覆膜</label><input id="tint" type="range" min="0" max="1.6" step="0.01"><span class="val" data-for="tint"></span></div><div class="row"><label>中心安静</label><input id="quiet" type="range" min="0" max="1.4" step="0.01"><span class="val" data-for="quiet"></span></div></div>
<div class="group"><h2>上下边缘光场</h2><div class="row"><label>顶部高光</label><input id="topLight" type="range" min="0" max="2.6" step="0.01"><span class="val" data-for="topLight"></span></div><div class="row"><label>顶部宽度</label><input id="topWidth" type="range" min="1" max="10" step="0.05"><span class="val" data-for="topWidth"></span></div><div class="row"><label>顶部不均匀</label><input id="topVariation" type="range" min="0" max="1.5" step="0.01"><span class="val" data-for="topVariation"></span></div><div class="row"><label>底部回光</label><input id="bottomLight" type="range" min="0" max="1.8" step="0.01"><span class="val" data-for="bottomLight"></span></div><div class="row"><label>底部宽度</label><input id="bottomWidth" type="range" min="1" max="9" step="0.05"><span class="val" data-for="bottomWidth"></span></div></div>
<div class="group"><h2>厚边截面</h2><div class="row"><label>截面宽度</label><input id="edgeDepth" type="range" min="0" max="9" step="0.05"><span class="val" data-for="edgeDepth"></span></div><div class="row"><label>内侧暗槽</label><input id="innerBevel" type="range" min="0" max="1.8" step="0.01"><span class="val" data-for="innerBevel"></span></div><div class="row"><label>外缘细亮</label><input id="outerRim" type="range" min="0" max="1.8" step="0.01"><span class="val" data-for="outerRim"></span></div><div class="row"><label>底部重量</label><input id="bottomMass" type="range" min="0" max="2.2" step="0.01"><span class="val" data-for="bottomMass"></span></div><div class="row"><label>侧边折暗</label><input id="sideBevel" type="range" min="0" max="1.4" step="0.01"><span class="val" data-for="sideBevel"></span></div></div>
<div class="group"><h2>形体</h2><div class="row"><label>左右弱边</label><input id="sideLight" type="range" min="0" max="0.9" step="0.01"><span class="val" data-for="sideLight"></span></div><div class="row"><label>圆角半径</label><input id="radius" type="range" min="18" max="84" step="1"><span class="val" data-for="radius"></span></div><div class="row"><label>投影</label><input id="shadow" type="range" min="0" max="1.6" step="0.01"><span class="val" data-for="shadow"></span></div><div class="row"><label>背景光带</label><input id="ribbon" type="range" min="0" max="1" step="0.01"><span class="val" data-for="ribbon"></span></div></div>
<textarea id="out" readonly></textarea>
</aside>
</section>
</main>
<script>
const c=document.getElementById('preview'),x=c.getContext('2d');let scene='panel';
const presets={frost:{frost:.15,tint:0,quiet:1.4,topLight:1.14,topWidth:1.45,topVariation:.46,bottomLight:1.10,bottomWidth:2.25,edgeDepth:0,innerBevel:0,outerRim:.40,bottomMass:.14,sideBevel:.13,sideLight:0,radius:37,shadow:.27,ribbon:0},ios:{frost:.82,tint:.82,quiet:1.22,topLight:1.3,topWidth:2.15,topVariation:1.05,bottomLight:.48,bottomWidth:2,edgeDepth:3.8,innerBevel:1.05,outerRim:.46,bottomMass:1.32,sideBevel:.48,sideLight:.07,radius:44,shadow:.62,ribbon:.1},clear:{frost:.48,tint:.3,quiet:.8,topLight:1.18,topWidth:2.6,topVariation:.7,bottomLight:.45,bottomWidth:2.4,edgeDepth:2.4,innerBevel:.55,outerRim:.62,bottomMass:.75,sideBevel:.35,sideLight:.14,radius:48,shadow:.55,ribbon:.35}};
const s={...presets.frost},ids=Object.keys(s),$=id=>document.getElementById(id);function set(o){Object.assign(s,o);ids.forEach(id=>$(id).value=s[id]);vals();draw();out()}function vals(){ids.forEach(id=>{let e=document.querySelector(`[data-for="${id}"]`);if(e)e.textContent=id==='radius'?Math.round(s[id]):(+s[id]).toFixed(2)})}ids.forEach(id=>$(id).oninput=e=>{s[id]=+e.target.value;vals();draw();out()});document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-preset]').forEach(q=>q.classList.remove('active'));b.classList.add('active');set(presets[b.dataset.preset])});document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-scene]').forEach(q=>q.classList.remove('active'));b.classList.add('active');scene=b.dataset.scene;draw()});
function rr(a,b,w,h,r){let q=Math.min(r,w/2,h/2);x.beginPath();x.moveTo(a+q,b);x.arcTo(a+w,b,a+w,b+h,q);x.arcTo(a+w,b+h,a,b+h,q);x.arcTo(a,b+h,a,b,q);x.arcTo(a,b,a+w,b,q);x.closePath()}
function bg(){let w=c.width,h=c.height,g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,'#07184b');g.addColorStop(.5,'#10349a');g.addColorStop(1,'#6235c4');x.fillStyle=g;x.fillRect(0,0,w,h);if(s.ribbon>0){x.strokeStyle=`rgba(95,190,255,${.22*s.ribbon})`;x.lineWidth=6;x.beginPath();x.moveTo(0,h*.72);x.bezierCurveTo(w*.3,h*.4,w*.6,h*.55,w*.9,h*.35);x.stroke()}}
function glass(a,b,w,h,t,small){let r=s.radius;x.save();x.shadowColor=`rgba(0,0,0,${.3*s.shadow})`;x.shadowBlur=34*s.shadow;x.shadowOffsetY=14*s.shadow;rr(a,b,w,h,r);x.fillStyle=`rgba(18,24,54,${.25+s.tint*.16})`;x.fill();x.restore();x.save();rr(a,b,w,h,r);x.clip();let base=x.createLinearGradient(a,b,a+w,b+h);base.addColorStop(0,`rgba(255,255,255,${.026*s.frost})`);base.addColorStop(.5,'rgba(255,255,255,0)');base.addColorStop(1,`rgba(0,0,0,${.08*s.quiet})`);x.fillStyle=base;x.fillRect(a,b,w,h);x.globalCompositeOperation='screen';let tw=s.topWidth,bw=s.bottomWidth,ta=.15*s.topLight,ba=.11*s.bottomLight;let top=x.createLinearGradient(a,b,a,b+tw*8);top.addColorStop(0,`rgba(255,255,255,${ta})`);top.addColorStop(.4,`rgba(230,248,255,${ta*.22})`);top.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=top;x.fillRect(a,b,w,tw*8);let topS=x.createLinearGradient(a,b,a+w,b);topS.addColorStop(0,`rgba(255,255,255,${ta*.45*s.topVariation})`);topS.addColorStop(.5,`rgba(255,255,255,${ta*.035})`);topS.addColorStop(1,`rgba(255,255,255,${ta*.1})`);x.strokeStyle=topS;x.lineWidth=tw;rr(a+tw*.45,b+tw*.45,w-tw*.9,h-tw*.9,r);x.stroke();let bot=x.createLinearGradient(a,b+h-bw*8,a,b+h);bot.addColorStop(0,'rgba(255,255,255,0)');bot.addColorStop(.8,`rgba(255,255,255,${ba*.34})`);bot.addColorStop(1,`rgba(255,255,255,${ba*.2})`);x.fillStyle=bot;x.fillRect(a,b+h-bw*8,w,bw*8);x.globalCompositeOperation='source-over';let depth=s.edgeDepth;if(depth>0){let bev=x.createLinearGradient(a,b,a,b+h);bev.addColorStop(0,`rgba(255,255,255,${.02*s.outerRim})`);bev.addColorStop(.12,`rgba(0,0,0,${.055*s.innerBevel})`);bev.addColorStop(1,`rgba(0,0,0,${.09*s.bottomMass})`);x.strokeStyle=bev;x.lineWidth=depth;rr(a+depth*.7,b+depth*.7,w-depth*1.4,h-depth*1.4,r-depth*.4);x.stroke()}let mass=x.createLinearGradient(a,b+h*.52,a,b+h);mass.addColorStop(0,'rgba(0,0,0,0)');mass.addColorStop(1,`rgba(0,2,10,${.31*s.bottomMass})`);x.fillStyle=mass;x.fillRect(a,b+h*.48,w,h*.52);x.restore();let rim=x.createLinearGradient(a,b,a+w,b+h);rim.addColorStop(0,`rgba(255,255,255,${.15*s.outerRim})`);rim.addColorStop(.55,'rgba(255,255,255,0)');rim.addColorStop(1,`rgba(255,255,255,${.018*s.outerRim})`);x.strokeStyle=rim;x.lineWidth=Math.max(.55,.72*s.outerRim);rr(a+1,b+1,w-2,h-2,r);x.stroke();if(t){x.fillStyle='rgba(255,255,255,.93)';x.font=`900 ${small?30:54}px -apple-system,BlinkMacSystemFont,"PingFang SC"`;x.fillText(t,a+(small?70:42),b+(small?55:76))}}
function draw(){bg();if(scene==='panel'){glass(78,56,944,560,'Compose 材质玻璃');glass(112,260,290,102,'采样',1);glass(425,260,290,102,'密度',1);glass(738,260,290,102,'边缘',1);glass(112,438,290,88,'Card',1);glass(425,438,290,88,'Chip',1);glass(738,438,290,88,'Flex',1)}else if(scene==='menu'){glass(245,84,610,500,'Instant')}else{for(let i=0;i<9;i++)glass(90+i%3*315,90+Math.floor(i/3)*150,220,110,['飞行','无线','镜像','专注','相机','手电','翻译','计算','录屏'][i],1)}}
function out(){document.getElementById('out').value=ids.map(k=>`${k}=${k==='radius'?Math.round(s[k]):(+s[k]).toFixed(2)}f`).join('\n')}set(presets.frost);
</script>
</body>
</html>
