<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Compose Glass Optical Field Lab</title>
  <style>
    :root{color-scheme:dark;font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Segoe UI",sans-serif;--line:rgba(255,255,255,.14);--text:rgba(255,255,255,.92);--muted:rgba(255,255,255,.58)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#06102b;color:var(--text)}
    body{background:radial-gradient(circle at 12% 6%,rgba(255,255,255,.10),transparent 8%),radial-gradient(circle at 85% 15%,rgba(114,168,255,.22),transparent 13%),radial-gradient(circle at 60% 88%,rgba(164,82,255,.30),transparent 24%),linear-gradient(145deg,#071744,#10369a 54%,#6238c7);overflow-x:hidden}.app{width:min(1480px,100%);margin:0 auto;padding:22px}header{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;margin-bottom:18px}h1{margin:0;font-size:clamp(30px,4vw,56px);letter-spacing:-.055em;line-height:.95}.sub{margin-top:10px;color:var(--muted);font-weight:850}.badge{padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.07);color:rgba(255,255,255,.72);font-weight:950;white-space:nowrap}.layout{display:grid;grid-template-columns:minmax(360px,1fr) 430px;gap:18px;align-items:start}.card,.controls,.export{border:1px solid rgba(255,255,255,.16);border-radius:30px;background:rgba(3,9,30,.48);box-shadow:0 22px 70px rgba(0,0,0,.26),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.card{padding:16px}.bar{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:4px 4px 14px}.tabs{display:flex;gap:8px;flex-wrap:wrap}button{appearance:none;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.075);color:rgba(255,255,255,.78);border-radius:999px;padding:10px 14px;font-weight:950;cursor:pointer}button:hover{background:rgba(255,255,255,.13);color:white}button.active{background:rgba(255,255,255,.22);color:white}#preview{width:100%;height:auto;display:block;border-radius:22px;background:rgba(0,0,0,.18)}.hint{color:rgba(255,255,255,.56);font-weight:760;line-height:1.7;padding:12px 6px 0;font-size:13px}.controls{padding:16px;position:sticky;top:14px}.title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.title strong{font-size:20px;letter-spacing:-.03em}.group{padding:13px 12px;border:1px solid rgba(255,255,255,.11);border-radius:22px;background:rgba(255,255,255,.045);margin-bottom:12px}.group h2{margin:0 0 10px;font-size:14px;color:rgba(255,255,255,.84);letter-spacing:.02em}.row{display:grid;grid-template-columns:112px 1fr 56px;align-items:center;gap:10px;margin:9px 0}label{font-size:12px;color:rgba(255,255,255,.66);font-weight:850}.value{text-align:right;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.72);font-size:12px;font-weight:900}input[type=range]{width:100%;accent-color:#dfefff}.preset-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.export{margin-top:18px;padding:14px}textarea{width:100%;min-height:190px;resize:vertical;border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:12px;color:rgba(255,255,255,.86);background:rgba(0,0,0,.28);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.55}.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}@media(max-width:980px){.app{padding:14px}header{align-items:flex-start;flex-direction:column}.layout{grid-template-columns:1fr}.controls{position:relative;top:auto}}
  </style>
</head>
<body>
<main class="app">
  <header><div><h1>Compose Glass<br/>Optical Field Lab</h1><div class="sub">厚玻璃模型：外细 rim、内暗槽、上下边缘光场、底部重量。</div></div><div class="badge">网页实时调参 · 再回填 Kotlin</div></header>
  <section class="layout">
    <div class="card"><div class="bar"><div class="tabs"><button data-scene="panel" class="active">大面板</button><button data-scene="chips">控件组</button><button data-scene="menu">模型菜单</button></div><div class="tabs"><button data-bg="blue" class="active">蓝紫背景</button><button data-bg="dark">暗色背景</button><button data-bg="busy">复杂背景</button></div></div><canvas id="preview" width="1100" height="860"></canvas><div class="hint">调厚度优先看边缘：外缘细亮，往里一圈有暗槽，底部有重量但不脏。顶部高光只是光源，厚度感主要来自内暗 bevel 和底部 mass。</div></div>
    <aside><div class="controls"><div class="title"><strong>参数滑块</strong><button id="resetBtn">重置</button></div>
      <div class="group"><h2>材质预设</h2><div class="preset-grid"><button data-preset="clear">Clear</button><button data-preset="frost" class="active">Frost</button><button data-preset="crystal">Crystal</button><button data-preset="dense">Dense</button><button data-preset="ios">iOS Menu</button></div></div>
      <div class="group"><h2>主体材质</h2><div class="row"><label>雾面密度</label><input id="frost" type="range" min="0.15" max="1.90" step="0.01"><span class="value" data-for="frost"></span></div><div class="row"><label>暗色覆膜</label><input id="tint" type="range" min="0.00" max="1.60" step="0.01"><span class="value" data-for="tint"></span></div><div class="row"><label>中心安静</label><input id="quiet" type="range" min="0.00" max="1.40" step="0.01"><span class="value" data-for="quiet"></span></div></div>
      <div class="group"><h2>上下边缘光场</h2><div class="row"><label>顶部高光</label><input id="topLight" type="range" min="0.00" max="2.60" step="0.01"><span class="value" data-for="topLight"></span></div><div class="row"><label>顶部宽度</label><input id="topWidth" type="range" min="1.00" max="10.00" step="0.05"><span class="value" data-for="topWidth"></span></div><div class="row"><label>顶部不均匀</label><input id="topVariation" type="range" min="0.00" max="1.50" step="0.01"><span class="value" data-for="topVariation"></span></div><div class="row"><label>底部回光</label><input id="bottomLight" type="range" min="0.00" max="1.80" step="0.01"><span class="value" data-for="bottomLight"></span></div><div class="row"><label>底部宽度</label><input id="bottomWidth" type="range" min="1.00" max="9.00" step="0.05"><span class="value" data-for="bottomWidth"></span></div></div>
      <div class="group"><h2>厚边截面</h2><div class="row"><label>截面宽度</label><input id="edgeDepth" type="range" min="0.00" max="9.00" step="0.05"><span class="value" data-for="edgeDepth"></span></div><div class="row"><label>内侧暗槽</label><input id="innerBevel" type="range" min="0.00" max="1.80" step="0.01"><span class="value" data-for="innerBevel"></span></div><div class="row"><label>外缘细亮</label><input id="outerRim" type="range" min="0.00" max="1.80" step="0.01"><span class="value" data-for="outerRim"></span></div><div class="row"><label>底部重量</label><input id="bottomMass" type="range" min="0.00" max="2.20" step="0.01"><span class="value" data-for="bottomMass"></span></div><div class="row"><label>侧边折暗</label><input id="sideBevel" type="range" min="0.00" max="1.40" step="0.01"><span class="value" data-for="sideBevel"></span></div></div>
      <div class="group"><h2>形体</h2><div class="row"><label>左右弱边</label><input id="sideLight" type="range" min="0.00" max="0.90" step="0.01"><span class="value" data-for="sideLight"></span></div><div class="row"><label>圆角半径</label><input id="radius" type="range" min="18" max="84" step="1"><span class="value" data-for="radius"></span></div><div class="row"><label>投影</label><input id="shadow" type="range" min="0.00" max="1.60" step="0.01"><span class="value" data-for="shadow"></span></div><div class="row"><label>背景光带</label><input id="ribbon" type="range" min="0.00" max="1.00" step="0.01"><span class="value" data-for="ribbon"></span></div></div>
    </div><div class="export"><div class="title"><strong>Kotlin 参数建议</strong><button id="copyBtn">复制</button></div><textarea id="exportText" spellcheck="false"></textarea><div class="actions"><button id="savePng">保存预览 PNG</button></div></div></aside>
  </section>
</main>
<script>
const canvas=document.getElementById('preview'),ctx=canvas.getContext('2d');let scene='panel',bgMode='blue';
const presets={clear:{frost:.48,tint:.30,quiet:.80,topLight:1.18,topWidth:2.6,topVariation:.70,bottomLight:.45,bottomWidth:2.4,edgeDepth:2.4,innerBevel:.55,outerRim:.62,bottomMass:.75,sideBevel:.35,sideLight:.14,radius:48,shadow:.55,ribbon:.35},frost:{frost:1.00,tint:.62,quiet:1.00,topLight:1.42,topWidth:3.2,topVariation:.85,bottomLight:.56,bottomWidth:2.9,edgeDepth:3.2,innerBevel:.82,outerRim:.76,bottomMass:1.02,sideBevel:.42,sideLight:.18,radius:46,shadow:.72,ribbon:.30},crystal:{frost:.68,tint:.40,quiet:.86,topLight:1.86,topWidth:2.3,topVariation:1.05,bottomLight:.68,bottomWidth:2.1,edgeDepth:2.2,innerBevel:.48,outerRim:1.06,bottomMass:.78,sideBevel:.28,sideLight:.12,radius:48,shadow:.70,ribbon:.26},dense:{frost:1.38,tint:.94,quiet:1.13,topLight:1.08,topWidth:4.0,topVariation:.52,bottomLight:.38,bottomWidth:3.7,edgeDepth:4.8,innerBevel:1.18,outerRim:.54,bottomMass:1.45,sideBevel:.70,sideLight:.10,radius:42,shadow:.95,ribbon:.20},ios:{frost:.82,tint:.82,quiet:1.22,topLight:1.30,topWidth:2.15,topVariation:1.05,bottomLight:.48,bottomWidth:2.0,edgeDepth:3.8,innerBevel:1.05,outerRim:.46,bottomMass:1.32,sideBevel:.48,sideLight:.07,radius:44,shadow:.62,ribbon:.10}};
const state={...presets.frost};const ids=Object.keys(state);const $=id=>document.getElementById(id);function setState(o){Object.assign(state,o);ids.forEach(id=>$(id).value=state[id]);values();draw();exportParams()}function values(){ids.forEach(id=>{const e=document.querySelector(`[data-for="${id}"]`);if(e)e.textContent=id==='radius'?Math.round(state[id]):Number(state[id]).toFixed(2)})}ids.forEach(id=>$(id).addEventListener('input',e=>{state[id]=Number(e.target.value);values();draw();exportParams()}));document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-preset]').forEach(x=>x.classList.remove('active'));b.classList.add('active');setState(presets[b.dataset.preset])});document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-scene]').forEach(x=>x.classList.remove('active'));b.classList.add('active');scene=b.dataset.scene;draw()});document.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-bg]').forEach(x=>x.classList.remove('active'));b.classList.add('active');bgMode=b.dataset.bg;draw()});$('resetBtn').onclick=()=>setState(presets.frost);$('copyBtn').onclick=async()=>{await navigator.clipboard.writeText($('exportText').value);$('copyBtn').textContent='已复制';setTimeout(()=>$('copyBtn').textContent='复制',900)};$('savePng').onclick=()=>{const a=document.createElement('a');a.download='compose-glass-lab.png';a.href=canvas.toDataURL('image/png');a.click()};
function rr(c,x,y,w,h,r){const q=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+q,y);c.arcTo(x+w,y,x+w,y+h,q);c.arcTo(x+w,y+h,x,y+h,q);c.arcTo(x,y+h,x,y,q);c.arcTo(x,y,x+w,y,q);c.closePath()}function bg(){const w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);let g=ctx.createLinearGradient(0,0,w,h);if(bgMode==='dark'){g.addColorStop(0,'#020204');g.addColorStop(.55,'#15161a');g.addColorStop(1,'#000')}else if(bgMode==='busy'){g.addColorStop(0,'#06103a');g.addColorStop(.35,'#0a2d8a');g.addColorStop(.7,'#6528b9');g.addColorStop(1,'#0c0d1b')}else{g.addColorStop(0,'#07184b');g.addColorStop(.48,'#10349a');g.addColorStop(1,'#6235c4')}ctx.fillStyle=g;ctx.fillRect(0,0,w,h);for(let i=0;i<42;i++){const x=((Math.sin(i*12.989)*43758.5453)%1+1)%1*w,y=((Math.sin(i*78.23)*12345.123)%1+1)%1*h;ctx.fillStyle=`rgba(255,255,255,${i%7===0?.20:.05})`;ctx.beginPath();ctx.arc(x,y,i%7===0?2:1,0,Math.PI*2);ctx.fill()}if(bgMode!=='dark'&&state.ribbon>0){ribbon(0,h*.72,w*.82,h*.36,`rgba(95,190,255,${.22*state.ribbon})`,6);ribbon(w*.28,h*.92,w*.98,h*.18,`rgba(255,230,200,${.16*state.ribbon})`,8)}else if(bgMode==='dark'){ctx.filter='blur(10px)';for(let i=0;i<10;i++){ctx.fillStyle=`rgba(255,255,255,${0.035+i*.004})`;ctx.fillRect(80+i*40,110+i*38,280,16)}ctx.filter='none'}}function ribbon(x0,y0,x1,y1,color,width){ctx.save();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.shadowBlur=20;ctx.shadowColor=color;ctx.beginPath();ctx.moveTo(x0,y0);ctx.bezierCurveTo((x0+x1)*.35,y0-120,(x0+x1)*.62,y1+100,x1,y1);ctx.stroke();ctx.restore()}
function glass(x,y,w,h,label,sub,o={}){const r=o.radius??state.radius;ctx.save();ctx.shadowColor=`rgba(0,0,0,${.30*state.shadow})`;ctx.shadowBlur=34*state.shadow;ctx.shadowOffsetY=14*state.shadow;rr(ctx,x,y,w,h,r);ctx.fillStyle=`rgba(18,24,54,${.25+state.tint*.16})`;ctx.fill();ctx.restore();ctx.save();rr(ctx,x,y,w,h,r);ctx.clip();let base=ctx.createLinearGradient(x,y,x+w,y+h);base.addColorStop(0,`rgba(255,255,255,${.026*state.frost})`);base.addColorStop(.45,`rgba(255,255,255,${.008*state.frost})`);base.addColorStop(1,`rgba(0,0,0,${.11*state.tint})`);ctx.fillStyle=base;ctx.fillRect(x,y,w,h);let quiet=ctx.createRadialGradient(x+w*.50,y+h*.46,0,x+w*.50,y+h*.46,Math.max(w,h)*.72);quiet.addColorStop(0,`rgba(255,255,255,${.010/Math.max(.25,state.quiet)})`);quiet.addColorStop(.55,'rgba(255,255,255,0)');quiet.addColorStop(1,`rgba(0,0,0,${.045*state.quiet})`);ctx.fillStyle=quiet;ctx.fillRect(x,y,w,h);ctx.globalCompositeOperation='screen';const tw=state.topWidth,bw=state.bottomWidth,topA=.15*state.topLight,botA=.11*state.bottomLight,depth=state.edgeDepth;let top=ctx.createLinearGradient(x,y,x,y+tw*7);top.addColorStop(0,`rgba(255,255,255,${topA})`);top.addColorStop(.18,`rgba(238,250,255,${topA*.42})`);top.addColorStop(.52,`rgba(170,215,255,${topA*.10})`);top.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=top;ctx.fillRect(x,y,w,tw*8);let topField=ctx.createLinearGradient(x,y,x+w,y);topField.addColorStop(0,`rgba(255,255,255,${topA*.45*state.topVariation})`);topField.addColorStop(.20,`rgba(255,255,255,${topA*.16})`);topField.addColorStop(.55,`rgba(255,255,255,${topA*.035})`);topField.addColorStop(.82,`rgba(255,255,255,${topA*.20*state.topVariation})`);topField.addColorStop(1,`rgba(255,255,255,${topA*.10})`);ctx.strokeStyle=topField;ctx.lineWidth=tw;rr(ctx,x+tw*.45,y+tw*.45,w-tw*.9,h-tw*.9,Math.max(0,r-tw*.15));ctx.stroke();let bottom=ctx.createLinearGradient(x,y+h-bw*8,x,y+h);bottom.addColorStop(0,'rgba(255,255,255,0)');bottom.addColorStop(.48,`rgba(220,240,255,${botA*.12})`);bottom.addColorStop(.84,`rgba(255,255,255,${botA*.36})`);bottom.addColorStop(1,`rgba(255,255,255,${botA*.22})`);ctx.fillStyle=bottom;ctx.fillRect(x,y+h-bw*8,w,bw*8);let bottomStroke=ctx.createLinearGradient(x,y+h,x+w,y+h);bottomStroke.addColorStop(0,'rgba(255,255,255,0)');bottomStroke.addColorStop(.28,`rgba(255,255,255,${botA*.20})`);bottomStroke.addColorStop(.58,`rgba(255,255,255,${botA*.40})`);bottomStroke.addColorStop(1,'rgba(255,255,255,0)');ctx.strokeStyle=bottomStroke;ctx.lineWidth=bw;rr(ctx,x+bw*.5,y+bw*.5,w-bw,h-bw,Math.max(0,r-bw*.2));ctx.stroke();let side=ctx.createLinearGradient(x,y,x+w,y);side.addColorStop(0,`rgba(255,255,255,${.030*state.sideLight})`);side.addColorStop(.08,'rgba(255,255,255,0)');side.addColorStop(.92,'rgba(255,255,255,0)');side.addColorStop(1,`rgba(255,255,255,${.024*state.sideLight})`);ctx.strokeStyle=side;ctx.lineWidth=2.2;rr(ctx,x+1.4,y+1.4,w-2.8,h-2.8,r);ctx.stroke();ctx.globalCompositeOperation='source-over';let bevel=ctx.createLinearGradient(x,y,x,y+h);bevel.addColorStop(0,`rgba(255,255,255,${.020*state.outerRim})`);bevel.addColorStop(.10,`rgba(0,0,0,${.055*state.innerBevel})`);bevel.addColorStop(.58,`rgba(0,0,0,${.020*state.innerBevel})`);bevel.addColorStop(1,`rgba(0,0,0,${.090*state.bottomMass})`);ctx.strokeStyle=bevel;ctx.lineWidth=depth;rr(ctx,x+depth*.70,y+depth*.70,w-depth*1.4,h-depth*1.4,Math.max(0,r-depth*.40));ctx.stroke();let sideDark=ctx.createLinearGradient(x,y,x+w,y);sideDark.addColorStop(0,`rgba(0,0,0,${.075*state.sideBevel})`);sideDark.addColorStop(.16,'rgba(0,0,0,0)');sideDark.addColorStop(.84,'rgba(0,0,0,0)');sideDark.addColorStop(1,`rgba(0,0,0,${.055*state.sideBevel})`);ctx.strokeStyle=sideDark;ctx.lineWidth=Math.max(1.2,depth*.45);rr(ctx,x+depth,y+depth,w-depth*2,h-depth*2,Math.max(0,r-depth*.55));ctx.stroke();let mass=ctx.createLinearGradient(x,y+h*.52,x,y+h);mass.addColorStop(0,'rgba(0,0,0,0)');mass.addColorStop(.50,`rgba(5,13,34,${.12*state.bottomMass})`);mass.addColorStop(.76,`rgba(3,7,20,${.19*state.bottomMass})`);mass.addColorStop(1,`rgba(0,2,10,${.31*state.bottomMass})`);ctx.fillStyle=mass;ctx.fillRect(x,y+h*.48,w,h*.52);ctx.restore();ctx.save();let rim=ctx.createLinearGradient(x,y,x+w,y+h);rim.addColorStop(0,`rgba(255,255,255,${.15*state.outerRim})`);rim.addColorStop(.18,`rgba(255,255,255,${.030*state.outerRim})`);rim.addColorStop(.55,'rgba(255,255,255,0)');rim.addColorStop(.82,`rgba(0,0,0,${.10*state.bottomMass})`);rim.addColorStop(1,`rgba(255,255,255,${.018*state.outerRim})`);ctx.strokeStyle=rim;ctx.lineWidth=Math.max(.55,.72*state.outerRim);rr(ctx,x+1,y+1,w-2,h-2,r);ctx.stroke();ctx.restore();if(label){ctx.save();ctx.fillStyle='rgba(255,255,255,.93)';ctx.font=`900 ${o.titleSize??50}px ui-rounded,-apple-system,BlinkMacSystemFont,sans-serif`;ctx.fillText(label,x+(o.pad??42),y+(o.titleY??72));if(sub){ctx.fillStyle='rgba(255,255,255,.50)';ctx.font=`800 ${o.subSize??25}px ui-rounded,-apple-system,BlinkMacSystemFont,sans-serif`;ctx.fillText(sub,x+(o.pad??42),y+(o.subY??116))}ctx.restore()}}
