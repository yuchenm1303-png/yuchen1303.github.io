<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Liquid Glass Blur Lab</title>
<style>
:root{--blur:28px;--sat:1.35;--bright:1.05;--contrast:1.05;--alpha:.72;--frost:.22;--r:166;--g:198;--b:230;--radius:42px;--highlight:.18;--shadow:.34;--edge:0}
*{box-sizing:border-box}body{margin:0;background:#071a33;color:white;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.page{display:grid;grid-template-columns:390px 1fr;min-height:100vh}.ctrl{padding:24px;background:rgba(3,10,24,.92);border-right:1px solid rgba(255,255,255,.12);overflow:auto}.ctrl h1{font-size:26px;margin:0 0 8px}.ctrl p{margin:0 0 18px;color:rgba(230,245,255,.72);font-size:13px;line-height:1.55}.group{border-top:1px solid rgba(255,255,255,.1);padding:13px 0}.group h2{margin:0 0 10px;color:#88e9ff;font-size:13px;letter-spacing:.06em}label{display:flex;justify-content:space-between;margin:11px 0 3px;font-size:13px;font-weight:700}.value{font-variant-numeric:tabular-nums;color:#bfe9ff}input{width:100%;accent-color:#91dcff}button{width:100%;margin:12px 0;padding:12px;border-radius:16px;border:1px solid rgba(255,255,255,.18);background:rgba(116,201,255,.18);color:#fff;font-weight:800}pre{white-space:pre-wrap;word-break:break-word;background:rgba(255,255,255,.08);border-radius:14px;padding:12px;font-size:11px;color:#dff6ff}.stage{display:grid;place-items:center;padding:28px}.phone{position:relative;width:min(430px,92vw);aspect-ratio:9/16;border-radius:38px;overflow:hidden;background:#08234a;box-shadow:0 32px 90px rgba(0,0,0,.45)}.bg{position:absolute;inset:0;background:linear-gradient(#061d40,#0c345e 48%,#49659a 72%,#18365b)}.blob{position:absolute;border-radius:999px;filter:blur(18px);opacity:.9}.b1{left:35px;top:78px;width:145px;height:145px;background:#58caff}.b2{left:210px;top:92px;width:170px;height:135px;background:#29e594}.b3{left:125px;top:330px;width:165px;height:145px;background:#ff4f74}.b4{right:28px;top:520px;width:145px;height:145px;background:#75e5ff}.b5{left:55px;bottom:118px;width:170px;height:130px;background:#40f06d}.b6{right:40px;bottom:120px;width:150px;height:120px;background:#ff638f}.icons{position:absolute;inset:0;font-weight:900;text-align:center}.ico{position:absolute;width:78px;height:78px;border-radius:20px;background:#fff;color:#124;display:grid;place-items:center;font-size:28px}.ico:after{content:attr(data-t);position:absolute;top:84px;color:white;font-size:14px;text-shadow:0 2px 7px #000}.i1{left:38px;top:175px}.i2{left:176px;top:175px;background:#ff446d;color:#fff}.i3{right:38px;top:175px}.i4{left:38px;top:420px;background:#bd95ff;color:#fff}.i5{left:176px;top:420px;background:#29deb8;color:#fff}.i6{right:38px;top:420px;background:#ff996e;color:#fff}.content{position:relative;padding:58px 22px 88px}.ey{color:#80efff;font-weight:900;letter-spacing:.08em}.title{font-size:48px;font-weight:950;letter-spacing:-.08em;margin:10px 0 12px}.sub{color:rgba(235,245,255,.74);font-size:18px;font-weight:700;margin-bottom:20px}.glass{position:relative;overflow:hidden;border-radius:var(--radius);background:rgba(var(--r),var(--g),var(--b),var(--alpha));backdrop-filter:blur(var(--blur)) saturate(var(--sat)) brightness(var(--bright)) contrast(var(--contrast));-webkit-backdrop-filter:blur(var(--blur)) saturate(var(--sat)) brightness(var(--bright)) contrast(var(--contrast));box-shadow:inset 0 1px 0 rgba(255,255,255,var(--highlight)),inset 0 -20px 42px rgba(5,18,38,calc(var(--shadow)*.28)),0 18px 42px rgba(0,0,0,calc(var(--shadow)*.18))}.glass:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 34% 4%,rgba(255,255,255,calc(var(--frost)*.95)),transparent 38%),linear-gradient(180deg,rgba(255,255,255,calc(var(--frost)*.42)),transparent 38%,rgba(0,0,0,calc(var(--shadow)*.14)));mix-blend-mode:screen;pointer-events:none}.glass:after{content:"";position:absolute;inset:0;border-radius:inherit;border:1px solid rgba(255,255,255,var(--edge));pointer-events:none}.hero{padding:26px 24px;margin-bottom:16px}.hero small{color:rgba(255,255,255,.68);font-weight:800}.hero h3{font-size:26px;margin:10px 0}.hero p,.item p{margin:0;color:rgba(255,255,255,.70);font-weight:650}.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.chip{padding:14px 12px;min-height:72px}.chip span{display:block;color:rgba(255,255,255,.66);font-size:13px;font-weight:800}.chip b{font-size:22px}.list{display:grid;gap:14px}.item{display:grid;grid-template-columns:54px 1fr auto;gap:14px;align-items:center;min-height:86px;padding:15px 18px}.icon{width:54px;height:54px;border-radius:20px;background:rgba(10,30,58,.45);display:grid;place-items:center;font-size:24px;font-weight:950}.item h3{margin:0 0 4px;font-size:22px}.nav{position:absolute;left:20px;right:20px;bottom:18px;height:58px;border-radius:29px;display:grid;grid-template-columns:repeat(3,1fr);place-items:center;text-align:center;font-size:12px;font-weight:800;color:rgba(255,255,255,.7)}@media(max-width:820px){.page{grid-template-columns:1fr}.ctrl{border-right:0}.stage{padding:18px}}
</style>
</head>
<body>
<div class="page">
<aside class="ctrl"><h1>Liquid Glass Blur Lab</h1><p>先调“模糊主体”。目标是卡片里面明显糊、雾面舒服、文字清楚。调完点复制，把 JSON 发给我。</p>
<div class="group"><h2>模糊 / 背景</h2><label>Blur <span class="value" id="v-blur"></span></label><input data-var="blur" data-unit="px" type="range" min="0" max="80" step="1" value="28"><label>Saturation <span class="value" id="v-sat"></span></label><input data-var="sat" type="range" min="0.6" max="2.4" step=".01" value="1.35"><label>Brightness <span class="value" id="v-bright"></span></label><input data-var="bright" type="range" min="0.6" max="1.6" step=".01" value="1.05"><label>Contrast <span class="value" id="v-contrast"></span></label><input data-var="contrast" type="range" min="0.6" max="1.8" step=".01" value="1.05"></div>
<div class="group"><h2>玻璃主体</h2><label>Glass Alpha <span class="value" id="v-alpha"></span></label><input data-var="alpha" type="range" min="0" max="1" step=".01" value=".72"><label>Frost <span class="value" id="v-frost"></span></label><input data-var="frost" type="range" min="0" max=".6" step=".01" value=".22"><label>Highlight <span class="value" id="v-highlight"></span></label><input data-var="highlight" type="range" min="0" max=".5" step=".01" value=".18"><label>Shadow <span class="value" id="v-shadow"></span></label><input data-var="shadow" type="range" min="0" max=".8" step=".01" value=".34"><label>Edge 临时边线 <span class="value" id="v-edge"></span></label><input data-var="edge" type="range" min="0" max=".3" step=".01" value="0"></div>
<div class="group"><h2>雾面颜色</h2><label>R <span class="value" id="v-r"></span></label><input data-var="r" type="range" min="80" max="255" step="1" value="166"><label>G <span class="value" id="v-g"></span></label><input data-var="g" type="range" min="80" max="255" step="1" value="198"><label>B <span class="value" id="v-b"></span></label><input data-var="b" type="range" min="80" max="255" step="1" value="230"><label>Radius <span class="value" id="v-radius"></span></label><input data-var="radius" data-unit="px" type="range" min="12" max="70" step="1" value="42"></div>
<button id="copy">复制当前参数</button><pre id="out"></pre></aside>
<section class="stage"><div class="phone"><div class="bg"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i><i class="blob b5"></i><i class="blob b6"></i></div><div class="icons"><div class="ico i1" data-t="ChatGPT">AI</div><div class="ico i2" data-t="小红书">书</div><div class="ico i3" data-t="翻译">文</div><div class="ico i4" data-t="图像">图</div><div class="ico i5" data-t="云盘">云</div><div class="ico i6" data-t="提醒">铃</div></div><div class="content"><div class="ey">TOOLS</div><div class="title">功能</div><div class="sub">把手机能力变成助手可以执行的动作。</div><section class="glass hero"><small>功能中心</small><h3>从列表变成真正可进入的功能页</h3><p>先调出舒服的模糊主体，再进入下一步统一折射。</p></section><div class="chips"><div class="glass chip"><span>今日支出</span><b>¥30</b></div><div class="glass chip"><span>账单</span><b>4 笔</b></div><div class="glass chip"><span>预算</span><b>¥1500</b></div></div><div class="list"><article class="glass item"><div class="icon">账</div><div><h3>账单中心</h3><p>手动记账、预算、分类和最近明细</p></div><b>›</b></article><article class="glass item"><div class="icon">图</div><div><h3>数据统计</h3><p>按周、月、年查看趋势</p></div><b>›</b></article><article class="glass item"><div class="icon">铃</div><div><h3>提醒闹钟</h3><p>创建提醒和闹钟</p></div><b>›</b></article><article class="glass item"><div class="icon">启</div><div><h3>应用控制</h3><p>打开微信、支付宝等应用</p></div><b>›</b></article></div></div><nav class="glass nav"><span>✦<br>AI 助手</span><span>▦<br>功能</span><span>⚙<br>设置</span></nav></div></section>
</div>
<script>
const root=document.documentElement,out=document.getElementById('out'),inputs=[...document.querySelectorAll('input')];
function f(v){let n=Number(v);return Number.isInteger(n)?String(n):n.toFixed(2)}
function render(){let data={};inputs.forEach(i=>{let k=i.dataset.var,u=i.dataset.unit||'';root.style.setProperty('--'+k,i.value+u);data[k]=Number(i.value);let lab=document.getElementById('v-'+k);if(lab)lab.textContent=f(i.value)+u});let mapped={cssPreview:data,androidHint:{blurCssPx:data.blur,blurTextureAlpha:+Math.min(.98,.72+data.alpha*.26).toFixed(3),frostAmount:+data.frost.toFixed(3),tintRgb:[data.r,data.g,data.b],brightness:+data.bright.toFixed(3),saturation:+data.sat.toFixed(3),contrast:+data.contrast.toFixed(3),topHighlight:+data.highlight.toFixed(3),bottomShadow:+data.shadow.toFixed(3),edgeLine:+data.edge.toFixed(3),radiusPreviewPx:data.radius}};out.textContent=JSON.stringify(mapped,null,2)}
inputs.forEach(i=>i.addEventListener('input',render));document.getElementById('copy').onclick=async()=>{await navigator.clipboard.writeText(out.textContent);document.getElementById('copy').textContent='已复制';setTimeout(()=>document.getElementById('copy').textContent='复制当前参数',900)};render();
</script>
</body>
</html>
