name: Apply OpenGL Viewport Source Fix

on:
  push:
    branches:
      - dev-update-1
    paths:
      - 'ai-ledger-android/app/.build-trigger.txt'

permissions:
  contents: write

jobs:
  apply-source-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev-update-1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Kotlin source files
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          repo = Path('.')
          card = repo / 'ai-ledger-android/app/src/main/java/com/yuchen/ailedger/ui/gl/OpenGLGlassCardLayer.kt'
          glass = repo / 'ai-ledger-android/app/src/main/java/com/yuchen/ailedger/ui/Glass.kt'
          app = repo / 'ai-ledger-android/app/src/main/java/com/yuchen/ailedger/ui/App.kt'
          workflow = repo / '.github/workflows/apply-opengl-viewport-source-fix.yml'

          text = card.read_text(encoding='utf-8')
          for line in [
              'import androidx.compose.foundation.layout.Box\n',
              'import androidx.compose.foundation.layout.size\n',
              'import androidx.compose.runtime.getValue\n',
              'import androidx.compose.runtime.mutableStateOf\n',
              'import androidx.compose.runtime.remember\n',
              'import androidx.compose.runtime.setValue\n',
              'import androidx.compose.ui.draw.clipToBounds\n',
              'import androidx.compose.ui.unit.IntSize\n',
          ]:
              text = text.replace(line, '')
          restored_function = '''@Composable
fun OpenGLGlassCardLayer(
    radius: Int,
    glassIntensity: Float,
    coordinateSource: GlassCoordinateSource? = null,
    modifier: Modifier = Modifier,
    pressProgress: Float = 0f,
    pressCenter: Offset = Offset(0.5f, 0.5f)
) {
    val backdrop = LocalBlurredBackdrop.current ?: return
    val border = LocalGlassBackdrop.current?.borderStyle ?: GlassBorderStyle()
    val backdropOrigin = LocalBackdropOrigin.current
    val density = LocalDensity.current
    val rootView = LocalView.current

    val blurBitmap = backdrop.image.asAndroidBitmap()
    val lensBitmap = backdrop.lensImage.asAndroidBitmap()
    val radiusPx = with(density) { radius.dp.toPx() }.roundToInt().toFloat()
    val intensity = glassIntensity.coerceIn(0.35f, 1.35f)
    val cardOrigin = coordinateSource?.offsetRelativeTo(backdropOrigin) ?: Offset.Zero
    val press = pressProgress.coerceIn(0f, 1f)
    val pressX = pressCenter.x.coerceIn(0f, 1f)
    val pressY = pressCenter.y.coerceIn(0f, 1f)

    BoxWithConstraints(modifier = modifier) {
        val widthPx = with(density) { maxWidth.toPx() }.roundToInt().coerceAtLeast(1).toFloat()
        val heightPx = with(density) { maxHeight.toPx() }.roundToInt().coerceAtLeast(1).toFloat()
        val rootWidthPx = backdrop.fullWidthPx.toFloat().coerceAtLeast(1f)
        val rootHeightPx = backdrop.fullHeightPx.toFloat().coerceAtLeast(1f)
        AndroidView(
            modifier = Modifier.matchParentSize(),
            factory = { context -> OpenGLGlassCardTextureView(context) },
            update = { view ->
                val rootDirty = view.setSamplingRootView(rootView)
                val specDirty = view.setGlassSpec(widthPx, heightPx, radiusPx, intensity)
                val samplingDirty = view.setSamplingSpec(cardOrigin.x, cardOrigin.y, rootWidthPx, rootHeightPx)
                val pressDirty = view.setPressSpec(press, pressX, pressY)
                val preDrawSamplingDirty = view.syncSamplingFromWindowPosition()
                val textureDirty = view.setBackdropTextures(blurBitmap, lensBitmap)
                val styleDirty = view.setGlassStyle(border)
                if (rootDirty || specDirty || samplingDirty || pressDirty || preDrawSamplingDirty || textureDirty || styleDirty) {
                    view.requestRender()
                }
            }
        )
    }
}
'''
          pattern = re.compile(r'@Composable\nfun OpenGLGlassCardLayer\([\s\S]*?\n\}\n\nprivate class OpenGLGlassCardTextureView')
          text, count = pattern.subn(restored_function + '\nprivate class OpenGLGlassCardTextureView', text, count=1)
          if count != 1:
              raise SystemExit('OpenGLGlassCardLayer function block not found')
          card.write_text(text, encoding='utf-8')

          text = glass.read_text(encoding='utf-8')
          old = '    val useUnifiedBackdrop = registry != null && roleUsesUnifiedBackdrop(role) && !useCardOpenGlBackdrop && !viewportOwnsShell\n    val key = remember { Any() }\n'
          new = '    val useUnifiedBackdrop = registry != null && roleUsesUnifiedBackdrop(role) && !useCardOpenGlBackdrop && !viewportOwnsShell\n    val registerWithUnifiedLayer = useUnifiedBackdrop || viewportOwnsShell\n    val key = remember { Any() }\n'
          if old not in text and 'val registerWithUnifiedLayer = useUnifiedBackdrop || viewportOwnsShell' not in text:
              raise SystemExit('Glass registration insertion point not found')
          text = text.replace(old, new, 1)
          text = text.replace('    if (useUnifiedBackdrop) {\n        SideEffect {', '    if (registerWithUnifiedLayer) {\n        SideEffect {', 1)
          text = text.replace('    DisposableEffect(registry, key, useUnifiedBackdrop) { onDispose { registry?.remove(key) } }', '    DisposableEffect(registry, key, registerWithUnifiedLayer) { onDispose { registry?.remove(key) } }', 1)
          glass.write_text(text, encoding='utf-8')

          text = app.read_text(encoding='utf-8')
          text = text.replace(
              '                    if (!ENABLE_OPENGL_GLASS_PROBE) UnifiedGlassBackdropLayer(Modifier.fillMaxSize())\n                    OpenGLGlassProbeLayer(enabled = ENABLE_OPENGL_GLASS_PROBE, modifier = Modifier.fillMaxSize())\n',
              '                    if (!ENABLE_OPENGL_GLASS_PROBE) UnifiedGlassBackdropLayer(Modifier.fillMaxSize())\n                    if (!ENABLE_OPENGL_GLASS_PROBE) OpenGLGlassViewportRegistryLayer(glassRegistry, Modifier.fillMaxSize())\n                    OpenGLGlassProbeLayer(enabled = ENABLE_OPENGL_GLASS_PROBE, modifier = Modifier.fillMaxSize())\n'
          )
          text = text.replace(
              '                    CompositionLocalProvider(LocalDensity provides compactDensity) {\n',
              '                    CompositionLocalProvider(\n                        LocalDensity provides compactDensity,\n                        LocalOpenGLGlassViewportActive provides true\n                    ) {\n'
          )
          app.write_text(text, encoding='utf-8')

          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-ledger-android/app/src/main/java/com/yuchen/ailedger/ui/gl/OpenGLGlassCardLayer.kt ai-ledger-android/app/src/main/java/com/yuchen/ailedger/ui/Glass.kt ai-ledger-android/app/src/main/java/com/yuchen/ailedger/ui/App.kt .github/workflows/apply-opengl-viewport-source-fix.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "切换首页大玻璃为全屏 OpenGL 视口"
          git push origin HEAD:dev-update-1
