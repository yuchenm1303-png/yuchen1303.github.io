name: Export sticker base64 for Loom

on:
  push:
    branches:
      - tmp/export-stickers-for-loom
    paths:
      - .github/workflows/export-stickers-b64-for-loom.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export exact WebP assets as small base64 parts
        shell: bash
        run: |
          set -euo pipefail
          SRC='ai-ledger-android/app/src/main/assets/inline_stickers_v1.zip'
          OUT='loom-sticker-export-parts'
          rm -rf "$OUT" /tmp/loom-stickers /tmp/loom-b64
          mkdir -p "$OUT" /tmp/loom-stickers /tmp/loom-b64
          unzip -q "$SRC" -d /tmp/loom-stickers
          count=0
          for f in /tmp/loom-stickers/*.webp; do
            name="$(basename "$f")"
            base64 -w0 "$f" > "/tmp/loom-b64/$name.b64"
            split -b 8000 -d -a 2 "/tmp/loom-b64/$name.b64" "$OUT/$name.part"
            count=$((count + 1))
          done
          test "$count" -eq 19
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A "$OUT"
          git commit -m 'chore: split exact sticker export into transfer-safe parts'
          git push
