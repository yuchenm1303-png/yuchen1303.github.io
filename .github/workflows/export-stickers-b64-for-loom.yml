name: Export exact sticker artifact for Loom

on:
  push:
    branches:
      - tmp/export-stickers-for-loom
    paths:
      - .github/workflows/export-stickers-b64-for-loom.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact WebP assets
        shell: bash
        run: |
          set -euo pipefail
          SRC='ai-ledger-android/app/src/main/assets/inline_stickers_v1.zip'
          OUT='/tmp/loom-stickers-exact'
          rm -rf "$OUT"
          mkdir -p "$OUT"
          unzip -q "$SRC" -d "$OUT"
          test "$(find "$OUT" -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 19
      - name: Upload exact sticker artifact
        uses: actions/upload-artifact@v4
        with:
          name: loom-stickers-exact
          path: /tmp/loom-stickers-exact/*.webp
          if-no-files-found: error
          retention-days: 1
