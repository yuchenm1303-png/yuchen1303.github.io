name: Export sticker base64 for Loom

on:
  push:
    branches:
      - tmp/export-stickers-for-loom
    paths:
      - .github/workflows/export-stickers-b64-for-loom.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test scoped token access to Loom
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/loom.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/yuchenm1303-png/Loom)"
          echo "loom_api_status=$status"
          if [ "$status" = 200 ]; then
            python - <<'PY'
          import json
          print(json.load(open('/tmp/loom.json'))['full_name'])
          PY
          fi
