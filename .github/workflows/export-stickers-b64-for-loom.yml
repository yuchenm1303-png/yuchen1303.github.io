name: Export sticker assets for Loom

on:
  push:
    branches:
      - tmp/export-stickers-for-loom
    paths:
      - .github/workflows/export-stickers-b64-for-loom.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize exact WebP assets on transfer branch
        shell: bash
        run: |
          set -euo pipefail
          SRC='ai-ledger-android/app/src/main/assets/inline_stickers_v1.zip'
          OUT='loom-sticker-export-webp'
          rm -rf "$OUT"
          mkdir -p "$OUT"
          unzip -q "$SRC" -d "$OUT"
          test "$(find "$OUT" -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 19
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT"
          git commit -m 'chore: materialize exact sticker WebPs for Loom transfer'
          git push
