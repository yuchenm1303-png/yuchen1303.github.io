name: ChatGPT Comment Trigger Compose APK

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  build:
    name: Build Compose APK from comment
    if: >-
      github.event.issue.number == 5 &&
      contains(github.event.comment.body, '/build-compose-apk') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'COLLABORATOR' ||
       github.event.comment.author_association == 'MEMBER')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev-update-1 source
        uses: actions/checkout@v4
        with:
          ref: dev-update-1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Compose debug APK
        working-directory: ai-ledger-android
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p . :app:assembleDebug

      - name: Upload Compose APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-assistant-compose-debug-apk
          path: ai-ledger-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
