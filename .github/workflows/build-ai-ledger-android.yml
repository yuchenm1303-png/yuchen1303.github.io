name: Build AI Ledger Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - dev-update-1
    paths:
      - 'ai-ledger/**'
      - 'ai-ledger-android/**'
      - '.github/workflows/build-ai-ledger-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: ai-ledger-android
        run: npm ci

      - name: Copy web assets
        working-directory: ai-ledger-android
        run: npm run copy:web

      - name: Sync Android platform
        working-directory: ai-ledger-android
        run: npx cap sync android

      - name: Install native assistant plugin
        working-directory: ai-ledger-android
        run: npm run android:install-plugin

      - name: Build debug APK
        working-directory: ai-ledger-android/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-ledger-debug-apk
          path: ai-ledger-android/android/app/build/outputs/apk/debug/app-debug.apk
