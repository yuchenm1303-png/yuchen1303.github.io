name: Build AI Ledger Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ai-ledger/**'
      - 'ai-ledger-android/**'
      - '.github/workflows/build-ai-ledger-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        working-directory: ai-ledger-android
        run: npm install

      - name: Copy web assets
        working-directory: ai-ledger-android
        run: npm run copy:web

      - name: Add Android platform
        working-directory: ai-ledger-android
        run: npx cap add android

      - name: Build debug APK
        working-directory: ai-ledger-android/android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-ledger-debug-apk
          path: ai-ledger-android/android/app/build/outputs/apk/debug/app-debug.apk
