name: Build Compose Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - dev-update-1
    paths:
      - "ai-ledger-android/**"
      - ".github/workflows/build-compose-android-apk.yml"

jobs:
  debug_test:
    name: Test and build debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build debug APK
        working-directory: ai-ledger-android
        run: gradle -p . :app:testDebugUnitTest :app:assembleDebug

      - name: Upload materialized home sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: materialized-home-sources
          path: |
            ai-ledger-android/app/src/main/java/com/yuchen/ailedger/ui/AssistantHomePolished.kt
            ai-ledger-android/app/src/main/java/com/yuchen/ailedger/ui/NetworkDropletCapsule.kt
            ai-ledger-android/app/src/main/java/com/yuchen/ailedger/ui/FrostInfoGlassPanel.kt
            ai-ledger-android/app/src/main/java/com/yuchen/ailedger/ui/UnifiedModelStackSelector.kt
            ai-ledger-android/app/src/main/java/com/yuchen/ailedger/ui/gl/OpenGLDropletGlassLayer.kt
          if-no-files-found: error

      - name: Upload Compose debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-assistant-compose-debug-apk
          path: ai-ledger-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0

  performance:
    name: Build performance APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Build performance APK
        working-directory: ai-ledger-android
        run: gradle -p . :app:assemblePerformance

      - name: Upload Compose performance APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-assistant-compose-performance-apk
          path: ai-ledger-android/app/build/outputs/apk/performance/app-performance.apk
          if-no-files-found: error
          compression-level: 0
