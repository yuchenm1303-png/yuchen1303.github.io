name: Build Compose Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - dev-update-1
    paths:
      - "ai-ledger-android/**"
      - ".github/workflows/build-compose-android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use preinstalled JDK 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          java -version

      - name: Build Compose debug APK
        working-directory: ai-ledger-android
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p . :app:assembleDebug

      - name: Upload Compose APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-assistant-compose-debug-apk
          path: ai-ledger-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
