name: Build Compose Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - dev-update-1
    paths:
      - "ai-ledger-android/**"
      - ".github/workflows/build-compose-android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev-update-1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply stable OpenGL card host source fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('ai-ledger-android/app/src/main/java/com/yuchen/ailedger/ui/gl/OpenGLGlassCardLayer.kt')
          text = path.read_text(encoding='utf-8')
          original = text

          if 'OpenGLGlassCardHostView' not in text:
              text = text.replace(
                  'import android.view.View\nimport android.view.ViewTreeObserver\n',
                  'import android.view.View\nimport android.view.ViewTreeObserver\nimport android.widget.FrameLayout\n'
              )

              old_block = '''        AndroidView(
            modifier = Modifier.matchParentSize(),
            factory = { context -> OpenGLGlassCardTextureView(context) },
            update = { view ->
                val rootDirty = view.setSamplingRootView(rootView)
                val specDirty = view.setGlassSpec(widthPx, heightPx, radiusPx, intensity)
                val samplingDirty = view.setSamplingSpec(cardOrigin.x, cardOrigin.y, rootWidthPx, rootHeightPx)
                val pressDirty = view.setPressSpec(press, pressX, pressY)
                val preDrawSamplingDirty = view.syncSamplingFromWindowPosition()
                val textureDirty = view.setBackdropTextures(blurBitmap, lensBitmap)
                val styleDirty = view.setGlassStyle(border)
                if (rootDirty || specDirty || samplingDirty || pressDirty || preDrawSamplingDirty || textureDirty || styleDirty) {
                    view.requestRender()
                }
            }
        )
'''
              new_block = '''        AndroidView(
            modifier = Modifier.matchParentSize(),
            factory = { context -> OpenGLGlassCardHostView(context) },
            update = { view ->
                val surfaceDirty = view.setStableSurfaceSize(
                    width = widthPx.roundToInt(),
                    height = heightPx.roundToInt(),
                    rootWidth = rootWidthPx.roundToInt(),
                    rootHeight = rootHeightPx.roundToInt()
                )
                val rootDirty = view.setSamplingRootView(rootView)
                val specDirty = view.setGlassSpec(widthPx, heightPx, radiusPx, intensity)
                val samplingDirty = view.setSamplingSpec(cardOrigin.x, cardOrigin.y, rootWidthPx, rootHeightPx)
                val pressDirty = view.setPressSpec(press, pressX, pressY)
                val preDrawSamplingDirty = view.syncSamplingFromWindowPosition()
                val textureDirty = view.setBackdropTextures(blurBitmap, lensBitmap)
                val styleDirty = view.setGlassStyle(border)
                if (surfaceDirty || rootDirty || specDirty || samplingDirty || pressDirty || preDrawSamplingDirty || textureDirty || styleDirty) {
                    view.requestRender()
                }
            }
        )
'''
              if old_block not in text:
                  raise SystemExit('Target AndroidView block not found; aborting without source changes.')
              text = text.replace(old_block, new_block, 1)

              marker = 'private class OpenGLGlassCardTextureView(context: Context) : TextureView(context), TextureView.SurfaceTextureListener {'
              host_class = '''private class OpenGLGlassCardHostView(context: Context) : FrameLayout(context) {
    private val textureView = OpenGLGlassCardTextureView(context)
    private var stableSurfaceWidth = 1
    private var stableSurfaceHeight = 1
    private var lastRootWidth = 1
    private var lastRootHeight = 1

    init {
        clipChildren = true
        clipToPadding = true
        isClickable = false
        isFocusable = false
        importantForAccessibility = IMPORTANT_FOR_ACCESSIBILITY_NO
        addView(textureView, LayoutParams(1, 1))
    }

    fun setStableSurfaceSize(width: Int, height: Int, rootWidth: Int, rootHeight: Int): Boolean {
        val safeWidth = width.coerceAtLeast(1)
        val safeHeight = height.coerceAtLeast(1)
        val safeRootWidth = rootWidth.coerceAtLeast(1)
        val safeRootHeight = rootHeight.coerceAtLeast(1)
        val rootChanged = kotlin.math.abs(safeRootWidth - lastRootWidth) > 2 || kotlin.math.abs(safeRootHeight - lastRootHeight) > 2
        if (rootChanged) {
            stableSurfaceWidth = safeWidth
            stableSurfaceHeight = safeHeight
            lastRootWidth = safeRootWidth
            lastRootHeight = safeRootHeight
        } else {
            stableSurfaceWidth = max(stableSurfaceWidth, safeWidth)
            stableSurfaceHeight = max(stableSurfaceHeight, safeHeight)
        }
        val lp = textureView.layoutParams
        val dirty = lp.width != stableSurfaceWidth || lp.height != stableSurfaceHeight
        if (dirty) {
            textureView.layoutParams = LayoutParams(stableSurfaceWidth, stableSurfaceHeight)
        }
        return dirty || rootChanged
    }

    fun setSamplingRootView(rootView: View): Boolean = textureView.setSamplingRootView(rootView)
    fun syncSamplingFromWindowPosition(): Boolean = textureView.syncSamplingFromWindowPosition()
    fun setGlassSpec(width: Float, height: Float, radius: Float, intensity: Float): Boolean = textureView.setGlassSpec(width, height, radius, intensity)
    fun setSamplingSpec(originX: Float, originY: Float, rootWidth: Float, rootHeight: Float): Boolean = textureView.setSamplingSpec(originX, originY, rootWidth, rootHeight)
    fun setPressSpec(progress: Float, centerX: Float, centerY: Float): Boolean = textureView.setPressSpec(progress, centerX, centerY)
    fun setBackdropTextures(blurBitmap: Bitmap, lensBitmap: Bitmap): Boolean = textureView.setBackdropTextures(blurBitmap, lensBitmap)
    fun setGlassStyle(style: GlassBorderStyle): Boolean = textureView.setGlassStyle(style)
    fun requestRender() = textureView.requestRender()
}

'''
              if marker not in text:
                  raise SystemExit('TextureView class marker not found; aborting without source changes.')
              text = text.replace(marker, host_class + marker, 1)
              path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/build-compose-android-apk.yml')
          workflow.write_text('''name: Build Compose Android APK

