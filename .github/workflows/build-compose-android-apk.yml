name: Build Compose Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - dev-update-1
    paths:
      - "ai-ledger-android/**"
      - ".github/workflows/build-compose-android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build Compose debug APK
        working-directory: ai-ledger-android
        run: gradle -p . :app:assembleDebug

      - name: Upload Compose APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-assistant-compose-debug-apk
          path: ai-ledger-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
