name: Build Compose Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - dev-update-1
    paths:
      - "ai-ledger-android/**"
      - ".github/workflows/build-compose-android-apk.yml"

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  backend_contract:
    name: Test backend and lightweight source contracts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Android project
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            ai-ledger-android
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test backend modules
        working-directory: ai-ledger-android/app/backend
        run: npm test
      - name: Verify Android lightweight contracts
        run: python ai-ledger-android/scripts/verify_lightweight_contracts.py
      - name: Verify real-time streaming contracts
        run: python ai-ledger-android/scripts/verify_streaming_contracts.py

  debug_test:
    name: Test, build and verify debug APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Android project
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            ai-ledger-android
      - name: Use JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Test and build debug APK
        working-directory: ai-ledger-android
        env:
          AI_LEDGER_CLIENT_TOKEN: ${{ secrets.AI_LEDGER_CLIENT_TOKEN }}
        run: gradle -p . :app:testDebugUnitTest :app:assembleDebug --build-cache --max-workers=4 --stacktrace
      - name: Unpack and verify launcher resources
        id: launcher_verify
        run: |
          set -euo pipefail

          apk="ai-ledger-android/app/build/outputs/apk/debug/app-debug.apk"
          report_dir="ai-ledger-android/app/build/reports/launcher-verification"
          report="$report_dir/report.md"
          listing="$report_dir/apk-entries.txt"
          resources="$report_dir/resources.txt"
          manifest="$report_dir/manifest.txt"
          mkdir -p "$report_dir"

          test -s "$apk"
          unzip -l "$apk" > "$listing"

          required_entries=(
            "res/mipmap-anydpi-v26/ic_launcher.xml"
            "res/mipmap-anydpi-v26/ic_launcher_round.xml"
            "res/drawable/ic_launcher_background_v2.xml"
            "res/drawable/ic_launcher_foreground_v2.xml"
            "res/drawable/ic_launcher_legacy_v2.xml"
            "res/drawable/ic_launcher_legacy_round_v2.xml"
          )
          for entry in "${required_entries[@]}"; do
            grep -Fq "$entry" "$listing" || {
              echo "Missing packaged launcher entry: $entry" >&2
              exit 1
            }
          done

          aapt2="$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}/build-tools" -type f -name aapt2 2>/dev/null | sort -V | tail -n 1)"
          test -x "$aapt2"
          "$aapt2" dump resources "$apk" > "$resources"

          required_resources=(
            "drawable/ic_launcher_background_v2"
            "drawable/ic_launcher_foreground_v2"
            "drawable/ic_launcher_legacy_v2"
            "drawable/ic_launcher_legacy_round_v2"
            "drawable/ic_launcher_legacy_round_background_v2"
            "mipmap/ic_launcher"
            "mipmap/ic_launcher_round"
          )
          for resource in "${required_resources[@]}"; do
            grep -Fq "$resource" "$resources" || {
              echo "Missing packaged launcher resource: $resource" >&2
              exit 1
            }
          done

          apkanalyzer="$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}" -type f -name apkanalyzer 2>/dev/null | head -n 1 || true)"
          if [ -n "$apkanalyzer" ] && [ -x "$apkanalyzer" ]; then
            "$apkanalyzer" manifest print "$apk" > "$manifest"
            grep -Eq 'android:icon="(@mipmap/)?ic_launcher"' "$manifest"
            grep -Eq 'android:roundIcon="(@mipmap/)?ic_launcher_round"' "$manifest"
          else
            "$aapt2" dump xmltree "$apk" AndroidManifest.xml > "$manifest"
            grep -Fq "android:icon" "$manifest"
            grep -Fq "android:roundIcon" "$manifest"
          fi

          {
            echo "# Launcher APK verification"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- APK: \`$apk\`"
            echo "- APK size: $(stat -c '%s bytes' "$apk")"
            echo "- Adaptive icon XML: present"
            echo "- Round adaptive icon XML: present"
            echo "- Legacy icon XML: present"
            echo "- Dedicated round legacy icon XML: present"
            echo "- Foreground/background resources: present in compiled resource table"
            echo "- Manifest icon and roundIcon declarations: present"
            echo
            echo "Result: PASS"
          } > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload launcher verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-apk-verification
          path: ai-ledger-android/app/build/reports/launcher-verification
          if-no-files-found: warn
      - name: Upload Compose debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-assistant-compose-debug-apk
          path: ai-ledger-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
      - name: Publish launcher verification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_OUTCOME: ${{ steps.launcher_verify.outcome }}
        run: |
          set -euo pipefail
          if [ "$VERIFY_OUTCOME" = "success" ]; then
            state="success"
            description="APK launcher resources unpacked and verified"
          else
            state="failure"
            description="APK launcher verification failed"
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="launcher-apk-self-check" \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  performance:
    name: Build performance APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Android project
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            ai-ledger-android
      - name: Use JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
          cache-read-only: true
      - name: Build performance APK
        working-directory: ai-ledger-android
        env:
          AI_LEDGER_CLIENT_TOKEN: ${{ secrets.AI_LEDGER_CLIENT_TOKEN }}
        run: gradle -p . :app:assemblePerformance --build-cache --max-workers=4 --stacktrace
      - name: Upload Compose performance APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-assistant-compose-performance-apk
          path: ai-ledger-android/app/build/outputs/apk/performance/app-performance.apk
          if-no-files-found: error
          compression-level: 0
      - name: Download previous performance APK baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          baseline_dir="ai-ledger-android/app/build/apk-baseline"
          mkdir -p "$baseline_dir"

          previous_run_id="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/build-compose-android-apk.yml/runs?branch=dev-update-1&status=success&per_page=20" \
              --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | .id" \
              | head -n 1 || true
          )"
          if [ -z "$previous_run_id" ]; then
            echo "No previous successful workflow run found."
            exit 0
          fi

          artifact_id="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${previous_run_id}/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.name == "ai-assistant-compose-performance-apk" and .expired == false) | .id' \
              | head -n 1 || true
          )"
          if [ -z "$artifact_id" ]; then
            echo "No previous performance APK artifact found."
            exit 0
          fi

          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            > "$baseline_dir/artifact.zip"
          unzip -q "$baseline_dir/artifact.zip" -d "$baseline_dir/unpacked"
          baseline_apk="$(find "$baseline_dir/unpacked" -type f -name '*.apk' | head -n 1 || true)"
          if [ -n "$baseline_apk" ]; then
            cp "$baseline_apk" "$baseline_dir/baseline-performance.apk"
            echo "Baseline APK restored from workflow run ${previous_run_id}."
          fi
      - name: Generate APK size regression report
        run: |
          set -euo pipefail
          report="ai-ledger-android/app/build/reports/apk-regression.md"
          current="ai-ledger-android/app/build/outputs/apk/performance/app-performance.apk"
          mapping="ai-ledger-android/app/build/outputs/mapping/performance/mapping.txt"
          baseline="ai-ledger-android/app/build/apk-baseline/baseline-performance.apk"
          args=(
            --current "$current"
            --mapping "$mapping"
            --report "$report"
            --max-growth-percent 5
            --max-growth-bytes 1048576
          )
          if [ -f "$baseline" ]; then
            args+=(--baseline "$baseline")
          fi

          set +e
          python ai-ledger-android/scripts/apk_metrics.py "${args[@]}"
          status=$?
          set -e
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload APK regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-assistant-apk-regression-report
          path: ai-ledger-android/app/build/reports/apk-regression.md
          if-no-files-found: warn
