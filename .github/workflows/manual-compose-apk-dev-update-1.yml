name: Manual Compose APK Build Dev Update 1

on:
  workflow_dispatch:

jobs:
  build:
    name: Build dev-update-1 Compose APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev-update-1 source
        uses: actions/checkout@v4
        with:
          ref: dev-update-1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Compose debug APK
        working-directory: ai-ledger-android
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p . :app:assembleDebug

      - name: Upload Compose APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-assistant-compose-debug-apk
          path: ai-ledger-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
