name: Temporary Fix OpenGL Glass Surface

on:
  push:
    branches:
      - dev-update-1
    paths:
      - '.github/workflows/temporary-fix-opengl-glass-surface.yml'

permissions:
  contents: write

jobs:
  apply-source-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev-update-1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch OpenGL glass source
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('ai-ledger-android/app/src/main/java/com/yuchen/ailedger/ui/gl/OpenGLGlassCardLayer.kt')
          text = path.read_text(encoding='utf-8')
          original = text

          text = text.replace(
              'import androidx.compose.foundation.layout.BoxWithConstraints\n',
              'import androidx.compose.foundation.layout.Box\n'
              'import androidx.compose.foundation.layout.BoxWithConstraints\n'
              'import androidx.compose.foundation.layout.size\n'
          )
          text = text.replace(
              'import androidx.compose.runtime.Composable\n',
              'import androidx.compose.runtime.Composable\n'
              'import androidx.compose.runtime.getValue\n'
              'import androidx.compose.runtime.mutableStateOf\n'
              'import androidx.compose.runtime.remember\n'
              'import androidx.compose.runtime.setValue\n'
          )
          text = text.replace(
              'import androidx.compose.ui.Modifier\n',
              'import androidx.compose.ui.Modifier\n'
              'import androidx.compose.ui.draw.clipToBounds\n'
          )
          text = text.replace(
              'import androidx.compose.ui.unit.dp\n',
              'import androidx.compose.ui.unit.IntSize\n'
              'import androidx.compose.ui.unit.dp\n'
          )

          old = '''    BoxWithConstraints(modifier = modifier) {
        val widthPx = with(density) { maxWidth.toPx() }.roundToInt().coerceAtLeast(1).toFloat()
        val heightPx = with(density) { maxHeight.toPx() }.roundToInt().coerceAtLeast(1).toFloat()
        val rootWidthPx = backdrop.fullWidthPx.toFloat().coerceAtLeast(1f)
        val rootHeightPx = backdrop.fullHeightPx.toFloat().coerceAtLeast(1f)
        AndroidView(
            modifier = Modifier.matchParentSize(),
            factory = { context -> OpenGLGlassCardTextureView(context) },
            update = { view ->
                val rootDirty = view.setSamplingRootView(rootView)
                val specDirty = view.setGlassSpec(widthPx, heightPx, radiusPx, intensity)
                val samplingDirty = view.setSamplingSpec(cardOrigin.x, cardOrigin.y, rootWidthPx, rootHeightPx)
                val pressDirty = view.setPressSpec(press, pressX, pressY)
                val preDrawSamplingDirty = view.syncSamplingFromWindowPosition()
                val textureDirty = view.setBackdropTextures(blurBitmap, lensBitmap)
                val styleDirty = view.setGlassStyle(border)
                if (rootDirty || specDirty || samplingDirty || pressDirty || preDrawSamplingDirty || textureDirty || styleDirty) {
                    view.requestRender()
                }
            }
        )
    }
'''
          new = '''    BoxWithConstraints(modifier = modifier.clipToBounds()) {
        val widthIntPx = with(density) { maxWidth.toPx() }.roundToInt().coerceAtLeast(1)
        val heightIntPx = with(density) { maxHeight.toPx() }.roundToInt().coerceAtLeast(1)
        val widthPx = widthIntPx.toFloat()
        val heightPx = heightIntPx.toFloat()
        val rootWidthPx = backdrop.fullWidthPx.toFloat().coerceAtLeast(1f)
        val rootHeightPx = backdrop.fullHeightPx.toFloat().coerceAtLeast(1f)
        var stableSurfaceSize by remember(rootWidthPx, rootHeightPx) { mutableStateOf(IntSize(widthIntPx, heightIntPx)) }
        val stableWidth = max(stableSurfaceSize.width, widthIntPx)
        val stableHeight = max(stableSurfaceSize.height, heightIntPx)
        if (stableWidth != stableSurfaceSize.width || stableHeight != stableSurfaceSize.height) {
            stableSurfaceSize = IntSize(stableWidth, stableHeight)
        }
        val surfaceWidthDp = with(density) { stableSurfaceSize.width.toDp() }
        val surfaceHeightDp = with(density) { stableSurfaceSize.height.toDp() }

        Box(Modifier.matchParentSize().clipToBounds()) {
            AndroidView(
                modifier = Modifier.size(surfaceWidthDp, surfaceHeightDp),
                factory = { context -> OpenGLGlassCardTextureView(context) },
                update = { view ->
                    val rootDirty = view.setSamplingRootView(rootView)
                    val specDirty = view.setGlassSpec(widthPx, heightPx, radiusPx, intensity)
                    val samplingDirty = view.setSamplingSpec(cardOrigin.x, cardOrigin.y, rootWidthPx, rootHeightPx)
                    val pressDirty = view.setPressSpec(press, pressX, pressY)
                    val preDrawSamplingDirty = view.syncSamplingFromWindowPosition()
                    val textureDirty = view.setBackdropTextures(blurBitmap, lensBitmap)
                    val styleDirty = view.setGlassStyle(border)
                    if (rootDirty || specDirty || samplingDirty || pressDirty || preDrawSamplingDirty || textureDirty || styleDirty) {
                        view.requestRender()
                    }
                }
            )
        }
    }
'''
          if old not in text:
              raise SystemExit('Target OpenGLGlassCardLayer block was not found; aborting without source changes.')
          text = text.replace(old, new)

          workflow = Path('.github/workflows/temporary-fix-opengl-glass-surface.yml')
          if workflow.exists():
              workflow.unlink()

          if text == original:
              raise SystemExit('No Kotlin source changes produced; aborting.')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-ledger-android/app/src/main/java/com/yuchen/ailedger/ui/gl/OpenGLGlassCardLayer.kt .github/workflows/temporary-fix-opengl-glass-surface.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "修复键盘动画时 OpenGL 玻璃抖动"
          git push origin HEAD:dev-update-1
