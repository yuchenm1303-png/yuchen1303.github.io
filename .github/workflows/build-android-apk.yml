name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - dev-update-1
    paths:
      - 'ai-ledger/**'
      - 'ai-ledger-android/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ai-ledger-android/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: ai-ledger-android
        run: npm ci

      - name: Copy web assets
        working-directory: ai-ledger-android
        run: npm run copy:web

      - name: Sync Android platform
        working-directory: ai-ledger-android
        run: npx cap sync android

      - name: Install native assistant plugin
        working-directory: ai-ledger-android
        run: npm run android:install-plugin

      - name: Build debug APK
        working-directory: ai-ledger-android/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Prepare APK artifact
        run: |
          mkdir -p artifacts
          SHORT_SHA="${GITHUB_SHA::7}"
          APK_NAME="AI-Assistant-${GITHUB_RUN_NUMBER}-${SHORT_SHA}-debug.apk"
          cp ai-ledger-android/android/app/build/outputs/apk/debug/app-debug.apk "artifacts/${APK_NAME}"
          cat > artifacts/build-info.txt <<EOF
          workflow=${GITHUB_WORKFLOW}
          run_number=${GITHUB_RUN_NUMBER}
          branch=${GITHUB_REF_NAME}
          commit=${GITHUB_SHA}
          apk=${APK_NAME}
          EOF
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"
          echo "Prepared ${APK_NAME}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Assistant-debug-apk-${{ github.run_number }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14