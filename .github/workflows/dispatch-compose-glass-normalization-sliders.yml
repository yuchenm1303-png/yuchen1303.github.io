name: Dispatch Compose Glass Normalization Slider Patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-compose-glass-normalization-sliders.yml
      - .compose-glass-normalization-sliders-dispatch.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-dev-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-update-1
          fetch-depth: 0
      - name: Run patch script from dev workflow
        run: |
          sed -n "/python3 <<'PY'/,/^          PY/p" .github/workflows/apply-compose-glass-normalization-sliders.yml | sed '1d;$d;s/^          //' > /tmp/compose_glass_normalization_patch.py
          python3 /tmp/compose_glass_normalization_patch.py
      - name: Commit patched files to dev-update-1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ai-ledger-android/app/src/main/java/com/yuchen/ailedger/ui/ComposeGlassLabState.kt \
            ai-ledger-android/app/src/main/java/com/yuchen/ailedger/ui/GlassDebugFloatingPanel.kt \
            ai-ledger-android/app/src/main/java/com/yuchen/ailedger/ui/Glass.kt \
            ai-ledger-android/app/.compose-glass-normalization-sliders-trigger.txt
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Update Compose glass normalization sliders"
          git push origin HEAD:dev-update-1
