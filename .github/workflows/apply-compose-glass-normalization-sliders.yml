                        ComposeGlassLabState.updateSizeAdaptiveTuning(sizeTuning.copy(bodyHeightRangePx = it))
                    }
                    LabSlider("body 高度最小值", "高度阻尼最低保留比例", sizeTuning.bodyHeightMin, ComposePressDampRange) {
