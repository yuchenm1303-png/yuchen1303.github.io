              r'private fun singleCardPressureOpticsFor\(size: OrdinaryGlassSizeAdaptiveTuning\): OrdinaryGlassPressureOpticsTuning \{[\s\S]*?\n\}\n\nprivate fun defaultComposeGlassStyle',
              new_pressure + '\n\nprivate fun defaultComposeGlassStyle',
              'singleCardPressureOpticsFor',
