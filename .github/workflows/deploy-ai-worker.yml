name: Deploy AI Worker

on:
  workflow_dispatch:
  push:
    branches:
      - dev-update-1
    paths:
      - 'ai-ledger-worker/**'
      - '.github/workflows/deploy-ai-worker.yml'

jobs:
  deploy-ai-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-ledger-worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Cloudflare secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "CLOUDFLARE_API_TOKEN is not configured."
            exit 1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is not configured."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ai-ledger-worker/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Show Worker health
        run: |
          echo "Worker deployed. Open the app settings and tap Test Connection, or check /health on the configured endpoint."
