name: Build Android PDF Viewer

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-pdf-viewer/**'
      - '.github/workflows/build-android-pdf-viewer.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: android-pdf-viewer
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pdf-viewer-debug-apk
          path: android-pdf-viewer/app/build/outputs/apk/debug/app-debug.apk
