name: Build Compose Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - dev-update-1
    paths:
      - 'android-compose/**'
      - '.github/workflows/build-compose-apk.yml'

jobs:
  build-compose-apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android-compose
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-ledger-compose-debug-apk
          path: android-compose/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
